<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול חכם | OneFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Rubik', sans-serif; background: linear-gradient(135deg, #eef2ff 0%, #f0fdf4 50%, #faf5ff 100%); min-height: 100vh; }
        .card { background: white; border-radius: 1.75rem; box-shadow: 0 8px 40px rgba(99,102,241,.13); border: 1px solid #e8edf5; }
        .camp-input { width:100%; padding:.75rem 1rem; border:1.5px solid #e2e8f0; border-radius:.85rem; font-size:.95rem; outline:none; font-family:'Rubik',sans-serif; background:#f8fafc; color:#1e293b; transition: all .2s; }
        .camp-input:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.12); background:white; }
        .btn-submit { background: linear-gradient(135deg,#4f46e5,#7c3aed); color:white; padding:.85rem 2rem; border-radius:1rem; font-weight:800; cursor:pointer; border:none; transition:all .2s; font-family:'Rubik',sans-serif; font-size:1rem; box-shadow: 0 4px 16px rgba(99,102,241,.35); width:100%; }
        .btn-submit:hover { transform:translateY(-2px); box-shadow: 0 8px 24px rgba(99,102,241,.45); }
        .btn-submit:active { transform:translateY(0); }
        .hero-gradient { background: linear-gradient(135deg,#4f46e5 0%,#7c3aed 50%,#6366f1 100%); }
    </style>
</head>
<body class="flex items-start justify-center p-4 pt-6 pb-16">

<div class="w-full max-w-lg">

    <!-- Loading state -->
    <div id="camp-loading" class="card p-10 text-center">
        <div class="w-14 h-14 rounded-2xl hero-gradient flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-leaf text-white text-xl"></i>
        </div>
        <p class="text-slate-400 font-medium">טוען קמפיין...</p>
    </div>

    <!-- Error state -->
    <div id="camp-error" class="card p-10 text-center hidden">
        <div class="w-14 h-14 bg-red-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-triangle-exclamation text-red-500 text-xl"></i>
        </div>
        <h2 class="font-black text-slate-800 text-lg mb-2">הקמפיין לא נמצא</h2>
        <p class="text-slate-400 text-sm">הלינק לא תקף או שהקמפיין הסתיים.</p>
    </div>

    <!-- Success state -->
    <div id="camp-success" class="card p-10 text-center hidden">
        <div class="w-20 h-20 bg-emerald-100 rounded-3xl flex items-center justify-center mx-auto mb-5">
            <i class="fa-solid fa-circle-check text-emerald-500 text-4xl"></i>
        </div>
        <h2 class="font-black text-slate-800 text-xl mb-3">הפרטים התקבלו!</h2>
        <p class="text-slate-500 text-sm leading-relaxed">תודה שהשארת פרטים,<br>נציג יפנה אליך עם פרטים בהקדם.</p>
        <div class="mt-6 flex flex-col items-center gap-3">
            <img src="/api/public/logo" class="h-12 w-12 rounded-xl object-contain"
                 onerror="this.style.display='none'">
            <p class="text-xs text-slate-400 font-bold tracking-widest uppercase">צוות OneFlow Life</p>
        </div>
    </div>

    <!-- Campaign form -->
    <div id="camp-form-wrapper" class="hidden">

        <!-- System top banner (from superadmin) -->
        <div id="camp-system-banner" class="hidden mb-3">
            <a id="camp-system-banner-link" href="#" target="_blank">
                <img id="camp-system-banner-img" src="" class="w-full rounded-2xl object-cover" style="max-height:120px" alt="OneFlow">
            </a>
        </div>

        <!-- Hero header -->
        <div id="camp-hero" class="hero-gradient p-8 text-center text-white mb-0 relative overflow-hidden" style="border-radius:1.75rem 1.75rem 0 0">
            <img id="camp-banner-bg" src="" class="absolute inset-0 w-full h-full object-cover hidden" style="z-index:0">
            <div class="absolute inset-0 hidden" id="camp-banner-overlay" style="background:rgba(0,0,0,0.45);z-index:1"></div>
            <div class="relative" style="z-index:2">
                <!-- OneFlow logo row -->
                <div class="flex items-center justify-center mb-4">
                    <img id="camp-oneflow-logo" src="" class="h-14 w-14 rounded-2xl object-contain hidden">
                    <div id="camp-leaf-icon" class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-sm">
                        <i class="fa-solid fa-leaf text-2xl text-white"></i>
                    </div>
                </div>
                <h1 id="camp-title" class="text-2xl font-black mb-2 leading-snug"></h1>
                <p id="camp-subtitle" class="text-indigo-200 text-sm font-medium leading-relaxed"></p>
            </div>
        </div>

        <!-- Text content + form -->
        <div class="card rounded-t-none p-7 space-y-5" style="border-top:none; border-radius:0 0 1.75rem 1.75rem">

            <div id="camp-text" class="text-slate-600 text-sm leading-relaxed bg-indigo-50 rounded-2xl p-4 border border-indigo-100 hidden"></div>

            <div id="camp-fields" class="space-y-4"></div>

            <button class="btn-submit" onclick="submitCampaignForm()">
                <i class="fa-solid fa-paper-plane ml-2"></i>שלח פרטים
            </button>

            <p id="camp-form-err" class="text-red-500 text-xs text-center hidden font-medium"></p>

            <p class="text-center text-[11px] text-slate-300 font-medium pt-2">
                <i class="fa-solid fa-lock mr-1"></i>פרטייך מאובטחים · <i class="fa-solid fa-leaf mr-1 ml-1"></i>OneFlow Community
            </p>
        </div>
    </div>

</div>

<script>
const API = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';
let campToken = null;
let campData = null;

const FIELD_LABELS = {
    'name': 'שם פרטי',
    'last_name': 'שם משפחה',
    'business_name': 'שם עסק',
    'address': 'כתובת',
    'city': 'עיר',
    'phone': 'טלפון',
    'email': 'כתובת מייל',
    'free_text': 'הודעה חופשית'
};
const FIELD_TYPES = {
    'phone': 'tel',
    'email': 'email',
    'free_text': 'textarea'
};

window.onload = async () => {
    const params = new URLSearchParams(window.location.search);
    campToken = params.get('t');
    if (!campToken) { showError(); return; }
    try {
        const [campRes, bannerRes] = await Promise.all([
            fetch(`${API}/public/campaign/${campToken}`),
            fetch(`${API}/public/system-banner`)
        ]);
        const data = await campRes.json();
        if (!data.success) { showError(); return; }
        campData = data.campaign;
        const bannerData = await bannerRes.json().catch(() => ({}));
        renderCampaign(bannerData);
    } catch(e) { showError(); }
};

function showError() {
    document.getElementById('camp-loading').classList.add('hidden');
    document.getElementById('camp-error').classList.remove('hidden');
}

function renderCampaign(bannerData) {
    document.getElementById('camp-loading').classList.add('hidden');
    document.getElementById('camp-form-wrapper').classList.remove('hidden');

    // System top banner
    if (bannerData?.bannerImg) {
        const bannerWrap = document.getElementById('camp-system-banner');
        const bannerImg = document.getElementById('camp-system-banner-img');
        const bannerLink = document.getElementById('camp-system-banner-link');
        bannerImg.src = bannerData.bannerImg;
        if (bannerData.bannerLink) bannerLink.href = bannerData.bannerLink;
        else bannerLink.removeAttribute('href');
        bannerWrap.classList.remove('hidden');
    }

    // Load logo dynamically (bypasses browser cache)
    if (bannerData?.logoSrc) {
        const logoImg = document.getElementById('camp-oneflow-logo');
        const leafIcon = document.getElementById('camp-leaf-icon');
        const successLogo = document.querySelector('#camp-success img');
        if (logoImg) {
            logoImg.src = bannerData.logoSrc;
            logoImg.classList.remove('hidden');
            if (leafIcon) leafIcon.classList.add('hidden');
        }
        if (successLogo) successLogo.src = bannerData.logoSrc;
    }

    document.getElementById('camp-title').textContent = campData.title || 'הצטרפות לקהילה';
    const subtitle = campData.subtitle || '';
    if (subtitle) { document.getElementById('camp-subtitle').textContent = subtitle; }
    if (campData.image_url) {
        const bg = document.getElementById('camp-banner-bg');
        const overlay = document.getElementById('camp-banner-overlay');
        bg.src = campData.image_url;
        bg.classList.remove('hidden');
        overlay.classList.remove('hidden');
    }
    const textEl = document.getElementById('camp-text');
    if (campData.text_content) {
        textEl.innerHTML = campData.text_content
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .split(/\n\n+/).map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`).join('<p class="mt-3"></p>');
        textEl.classList.remove('hidden');
    }

    const fields = Array.isArray(campData.fields_config) ? campData.fields_config : [];
    const container = document.getElementById('camp-fields');
    if (!fields.length) {
        container.innerHTML = `
            <div>
                <label class="text-xs font-bold text-slate-500 block mb-1.5">שם מלא</label>
                <input type="text" id="field-name" class="camp-input" placeholder="ישראל ישראלי">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 block mb-1.5">טלפון</label>
                <input type="tel" id="field-phone" class="camp-input" placeholder="050-0000000" dir="ltr">
            </div>`;
    } else {
        container.innerHTML = fields.map(f => {
            const label = FIELD_LABELS[f] || f;
            const type = FIELD_TYPES[f] || 'text';
            const dir = (f==='phone'||f==='email') ? 'dir="ltr"' : '';
            if (type === 'textarea') {
                return `<div>
                <label class="text-xs font-bold text-slate-500 block mb-1.5">${label}</label>
                <textarea id="field-${f}" class="camp-input" rows="3" placeholder="${label}" style="resize:none"></textarea>
            </div>`;
            }
            return `<div>
                <label class="text-xs font-bold text-slate-500 block mb-1.5">${label}</label>
                <input type="${type}" id="field-${f}" class="camp-input" placeholder="${label}" ${dir}>
            </div>`;
        }).join('');
    }
}

async function submitCampaignForm() {
    const err = document.getElementById('camp-form-err');
    err.classList.add('hidden');
    const fields = campData?.fields_config?.length ? campData.fields_config : ['name', 'phone'];
    const data = {};
    for (const f of fields) {
        const el = document.getElementById(`field-${f}`);
        if (el) data[f] = el.value.trim();
    }
    const hasValue = Object.values(data).some(v => v);
    if (!hasValue) { err.textContent = 'אנא מלא לפחות שדה אחד'; err.classList.remove('hidden'); return; }
    try {
        const res = await fetch(`${API}/public/campaign/${campToken}/submit`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
        });
        const result = await res.json();
        if (result.success) {
            document.getElementById('camp-form-wrapper').classList.add('hidden');
            document.getElementById('camp-success').classList.remove('hidden');
        } else { err.textContent = result.error || 'שגיאה'; err.classList.remove('hidden'); }
    } catch(e) { err.textContent = 'שגיאת תקשורת'; err.classList.remove('hidden'); }
}
</script>
</body>
</html>
