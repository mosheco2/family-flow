<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- decorative circles -->
  <circle cx="100" cy="100" r="180" fill="white" fill-opacity="0.05"/>
  <circle cx="1100" cy="530" r="220" fill="white" fill-opacity="0.05"/>
  <circle cx="1050" cy="80" r="120" fill="white" fill-opacity="0.06"/>
  <circle cx="150" cy="550" r="100" fill="white" fill-opacity="0.06"/>
  <!-- leaf icon -->
  <g transform="translate(480,160)">
    <path d="M120,0 C120,0 240,60 240,180 C240,270 180,330 120,330 C60,330 0,270 0,180 C0,60 120,0 120,0 Z" fill="url(#leaf)" fill-opacity="0.25"/>
    <path d="M120,30 C120,30 30,120 30,210 C30,270 70,310 120,310" stroke="white" stroke-width="3" fill="none" stroke-opacity="0.4"/>
  </g>
  <!-- OneFlow text -->
  <text x="600" y="290" font-family="Arial, sans-serif" font-size="96" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">OneFlow</text>
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="white" fill-opacity="0.8" text-anchor="middle" letter-spacing="4">LIFE</text>
  <!-- tagline -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="28" fill="white" fill-opacity="0.65" text-anchor="middle">oneflowlife.co.il</text>
</svg>
