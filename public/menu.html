<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>תפריט</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FBF7EF;--surface:#fff;--border:#E5DCCB;--sand:#E7DFD0;
  --ink:#241E19;--ink2:#5C5148;--ink3:#9C8C71;
  --accent:#6B2434;--accent2:#4E1926;
}
html{background:var(--sand)}
body{font-family:'Assistant',Helvetica,sans-serif;color:var(--ink);background:var(--sand);min-height:100vh}

/* ── hero ── */
.hero{position:relative;min-height:220px;background:var(--ink);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.hero-img{position:absolute;inset:0;object-fit:cover;width:100%;height:100%;opacity:.38}
.hero-body{position:relative;padding:clamp(24px,5vw,52px) clamp(20px,6vw,72px) clamp(20px,4vw,36px);display:flex;align-items:flex-end;gap:18px}
.hero-logo{width:64px;height:64px;border-radius:6px;object-fit:cover;border:2px solid rgba(255,255,255,.18);flex-shrink:0}
.hero-text{flex:1;min-width:0}
.hero-eyebrow{font-size:10px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;margin-bottom:7px}
.hero-title{font-family:'Frank Ruhl Libre',serif;font-size:clamp(22px,4.5vw,40px);font-weight:500;color:#FBF7EF;line-height:1.2;margin-bottom:6px}
.hero-slogan{font-size:13.5px;font-weight:300;color:#C8BFB0}
.hero-meta{display:flex;flex-wrap:wrap;gap:5px 18px;font-size:12.5px;color:#C8BFB0;margin-top:10px}
.hero-meta strong{color:#FBF7EF;font-weight:500}

/* ── progress bar ── */
.prog-bar{background:var(--bg);border-bottom:1px solid var(--border);padding:14px clamp(16px,5vw,56px);display:flex;align-items:center;gap:0;overflow-x:auto}
.prog-step{display:flex;align-items:center;gap:0;flex-shrink:0}
.prog-num{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:var(--ink3);background:var(--bg);transition:.2s}
.prog-num.active{border-color:var(--accent);color:var(--accent);background:#f9f0f2}
.prog-num.done{border-color:var(--accent);background:var(--accent);color:#fff}
.prog-label{font-size:11px;color:var(--ink3);margin-right:6px;white-space:nowrap;display:none}
@media(min-width:600px){.prog-label{display:block}}
.prog-line{width:24px;height:1px;background:var(--border);margin:0 4px;flex-shrink:0}
.prog-line.done{background:var(--accent)}

/* ── main ── */
.wiz-body{max-width:820px;margin:0 auto;padding:clamp(20px,4vw,44px) clamp(14px,4vw,32px) 120px}

/* ── step screen ── */
.step-title{font-family:'Frank Ruhl Libre',serif;font-size:clamp(18px,3vw,26px);font-weight:500;margin-bottom:5px}
.step-sub{font-size:13px;font-weight:300;color:var(--ink3);margin-bottom:22px;line-height:1.6}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:10px}
.item-card{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:14px 16px;cursor:pointer;transition:.15s;display:flex;align-items:flex-start;gap:10px;user-select:none}
.item-card:hover{border-color:var(--accent);background:#fdf7f8}
.item-card.selected{border-color:var(--accent);background:#fdf7f8}
.item-sel{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;margin-top:2px;transition:.15s;display:flex;align-items:center;justify-content:center}
.item-card.selected .item-sel{background:var(--accent);border-color:var(--accent)}
.item-card.selected .item-sel::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff}
.item-card.multi .item-sel{border-radius:3px}
.item-card.multi.selected .item-sel::after{content:'✓';font-size:11px;color:#fff;border-radius:0;width:auto;height:auto;background:transparent}
.item-info{flex:1;min-width:0}
.item-name{font-size:14px;font-weight:500;color:var(--ink);margin-bottom:2px}
.item-desc{font-size:12px;font-weight:300;color:var(--ink3);line-height:1.5}
.item-allergens{font-size:11px;color:#b45309;margin-top:4px}
.item-price{font-size:12.5px;font-weight:600;color:var(--accent);white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums}

/* ── summary ── */
.sum-table{width:100%;border-collapse:collapse;margin-bottom:24px}
.sum-table tr{border-bottom:1px solid var(--border)}
.sum-table td{padding:13px 4px;font-size:13.5px;vertical-align:top}
.sum-table .lbl{color:var(--ink3);font-size:11px;letter-spacing:.18em;width:90px;padding-top:16px}
.sum-table .val{font-weight:500;color:var(--ink)}
.sum-table .chg button{font-size:11.5px;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:4px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.total-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-top:1.5px solid var(--border);margin-bottom:28px}
.total-label{font-size:13px;color:var(--ink3)}
.total-val{font-family:'Frank Ruhl Libre',serif;font-size:22px;font-weight:500;color:var(--ink)}

/* ── form ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:480px){.form-grid{grid-template-columns:1fr}}
.field label{font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.06em;display:block;margin-bottom:5px}
.field input,.field textarea{width:100%;padding:10px 13px;border:none;border-bottom:1.5px solid var(--border);background:transparent;font-size:16px;font-family:inherit;color:var(--ink);outline:none;transition:.15s;border-radius:0}
.field input:focus,.field textarea:focus{border-bottom-color:var(--accent)}
.field textarea{resize:vertical;min-height:80px}
.field.full{grid-column:1/-1}

/* ── done screen ── */
.done-wrap{text-align:center;padding:48px 20px}
.done-check{width:56px;height:56px;border:1.5px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:22px;color:var(--ink)}
.done-num{font-family:'Frank Ruhl Libre',serif;font-size:28px;font-weight:500;margin-bottom:6px}
.done-sub{font-size:13.5px;font-weight:300;color:var(--ink3);margin-bottom:28px}
.done-total{font-size:13px;color:var(--ink3);margin-bottom:32px}
.done-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}
.btn-pdf{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;background:var(--accent);color:#FBF7EF;border:none;border-radius:3px;font-size:13.5px;font-family:inherit;font-weight:600;cursor:pointer;letter-spacing:.04em}
.btn-pdf:hover{background:var(--accent2)}
.btn-wa{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;background:#25D366;color:#fff;border:none;border-radius:3px;font-size:13.5px;font-family:inherit;font-weight:600;cursor:pointer}
.btn-wa:hover{background:#1ebe5a}
/* ── pdf print source (hidden on screen, shown on print) ── */
#pdf-print-target{display:none}
@media print{
  body>*{display:none!important}
  #pdf-print-target{display:block!important;width:100%}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  @page{size:A4 portrait;margin:0.85in}
  body{background:white!important}
}






/* ── nav buttons ── */
.nav-bar{position:fixed;bottom:0;right:0;left:0;background:var(--bg);border-top:1px solid var(--border);padding:12px clamp(14px,5vw,48px);display:flex;gap:10px;justify-content:space-between;z-index:100}
.btn-back{padding:11px 22px;background:transparent;border:1.5px solid var(--border);border-radius:3px;font-size:13.5px;font-family:inherit;color:var(--ink2);cursor:pointer;font-weight:500}
.btn-next{padding:11px 28px;background:var(--accent);color:#FBF7EF;border:none;border-radius:3px;font-size:13.5px;font-family:inherit;font-weight:600;cursor:pointer;letter-spacing:.04em;flex:1;max-width:280px}
.btn-next:hover{background:var(--accent2)}
.btn-next:disabled{opacity:.5;cursor:default}

/* ── error ── */
.err-msg{color:var(--accent);font-size:13px;padding:10px 0;min-height:22px}

/* ── contact bar ── */
.contact-bar{text-align:center;padding:18px 20px;font-size:13px;font-weight:300;color:var(--ink3);border-top:1px solid var(--border);background:var(--bg)}
.contact-bar a{color:var(--accent);text-decoration:none}
/* ── floating pdf btn ── */
.fab-pdf{position:fixed;bottom:82px;left:14px;z-index:200;display:flex;align-items:center;gap:6px;padding:9px 16px;background:var(--accent);color:#FBF7EF;border:none;border-radius:24px;font-size:12.5px;font-family:inherit;font-weight:600;cursor:pointer;box-shadow:0 3px 12px rgba(107,36,52,.35);letter-spacing:.03em;transition:.15s}
.fab-pdf:hover{background:var(--accent2);transform:translateY(-1px)}

/* ── states ── */
.state-center{min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink3);font-size:15px;font-weight:300}
.spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="state-center"><div class="spinner"></div><span>טוען תפריט…</span></div></div>
<button class="fab-pdf" id="fab-pdf-btn" onclick="exportMenuPDF()" style="display:none" title="תצוגה מקדימה ושיתוף">תצוגה מקדימה ושיתוף</button>
<a id="fab-store-btn" style="display:none;position:fixed;bottom:82px;right:14px;z-index:200;align-items:center;gap:6px;padding:9px 16px;background:#fff;color:var(--accent);border:1.5px solid var(--accent);border-radius:24px;font-size:12.5px;font-family:inherit;font-weight:600;cursor:pointer;box-shadow:0 3px 12px rgba(107,36,52,.18);letter-spacing:.03em;text-decoration:none" target="_blank">🛍️ לחנות</a>
<div id="pdf-print-target"></div>

<script>
/* ── state ── */
let _d = null;          // template data
let _mode = null;       // null=landing, 'template'=wizard, 'catalog'=catalog builder
let _step = 0;          // wizard: 0..sections.length = summary, +1 = form, +2 = done
let _sel = {};          // wizard selections { sectionId: [itemId, ...] }
let _form = {};         // contact form values
let _err = '';
/* catalog builder state */
let _catItems = [];     // all catalog items
let _cart = {};         // catalogItemId -> qty
let _catFilter = '';    // search string
let _catCategory = '';  // category filter
let _catView = 'browse'; // 'browse' | 'form' | 'done'

const slug = location.pathname.replace(/^\/menu\//, '').trim();
const _isPdfMode  = new URLSearchParams(location.search).get('pdf')  === '1';
const _isWaMode   = new URLSearchParams(location.search).get('wa')   === '1';
const _fromSlug   = new URLSearchParams(location.search).get('from') || null;
let   _fromName   = null; // populated after load if _fromSlug is set

/* ── boot ── */
(async () => {
    if (!slug) { renderError('כתובת תפריט לא תקינה'); return; }
    try {
        const res = await fetch('/api/menu/public/' + encodeURIComponent(slug));
        if (res.status === 404) { renderError('התפריט אינו זמין'); return; }
        if (!res.ok) { renderError('שגיאה בטעינת התפריט'); return; }
        _d = await res.json();
    } catch(e) { renderError('שגיאת תקשורת — נסה לרענן'); return; }

    document.title = _d.name + ' — תפריט';
    _d.sections = (_d.sections || []).filter(s => (s.items || []).some(i => i.is_available !== false));
    // resolve "from" slug name for back button
    if (_fromSlug) {
        try {
            const fr = await fetch('/api/menu/public/' + encodeURIComponent(_fromSlug));
            if (fr.ok) { const fd = await fr.json(); _fromName = fd.name || null; }
        } catch(e) {}
    }
    _applyPageDesign();
    buildFullPdfSource(false);
    document.getElementById('fab-pdf-btn').style.display = 'flex';
    // store button
    if (_d.store_id) {
        const storeBtn = document.getElementById('fab-store-btn');
        storeBtn.href = location.origin + '/storefront.html?store=' + encodeURIComponent(_d.store_id);
        storeBtn.style.display = 'flex';
    }
    if (_isPdfMode) { setTimeout(exportMenuPDF, 800); return; }
    if (_isWaMode)  { setTimeout(exportAndShareWa, 800); }
    // routing logic
    if (!_d.show_related_options) {
        // no landing: go directly to template wizard or catalog
        if (_d.sections.length) { _mode = 'template'; }
        else { startCatalogMode(); return; }
    }
    // else: show landing (mode=null)
    render();
})();

/* ── render router ── */
function render() {
    if (_mode === null) { renderLanding(); return; } // async — ok, fire and forget
    if (_mode === 'catalog') { renderCatalogFlow(); return; }
    const totalSteps = _d.sections.length;
    if (_step < totalSteps) renderStep(_step);
    else if (_step === totalSteps) renderSummary();
    else if (_step === totalSteps + 1) renderForm();
    else renderDone();
}

/* ── landing ── */
let _relatedMenus = null; // cached related menus

async function renderLanding() {
    const hasSections = _d.sections && _d.sections.length > 0;

    // fetch related menus once
    if (_d.show_related_options && _relatedMenus === null) {
        try {
            const r = await fetch('/api/menu/public/' + encodeURIComponent(slug) + '/related');
            _relatedMenus = r.ok ? await r.json() : [];
        } catch(e) { _relatedMenus = []; }
    }

    const evLabels = {wedding:'חתונה',bar_mitzvah:'בר/בת מצווה',birthday:'יום הולדת',corporate:'אירוע עסקי',other:'אירוע'};

    const relatedSection = (_d.show_related_options) ? `
      <div style="margin-top:24px;padding-top:22px;border-top:1px solid var(--border)">
        <div style="font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px">אפשרויות נוספות</div>
        <div style="display:flex;flex-direction:column;gap:9px">
          ${(_relatedMenus||[]).map(m => `
          <a href="/menu/${encodeURIComponent(m.public_slug)}?from=${encodeURIComponent(slug)}" style="display:flex;align-items:center;gap:12px;background:var(--sand);border:1px solid var(--border);border-radius:8px;padding:11px 13px;text-decoration:none;color:inherit">
            ${m.logo_url ? `<img src="${esc(m.logo_url)}" style="width:36px;height:36px;object-fit:cover;border-radius:5px;flex-shrink:0">` : `<div style="width:36px;height:36px;border-radius:5px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">📋</div>`}
            <div>
              <div style="font-size:13.5px;font-weight:600;color:var(--ink)">${esc(m.name)}</div>
              ${m.event_type ? `<div style="font-size:11.5px;color:var(--ink3)">${evLabels[m.event_type]||m.event_type}</div>` : ''}
            </div>
            <div style="margin-right:auto;color:var(--ink3);font-size:12px">←</div>
          </a>`).join('')}
          <button onclick="startCatalogMode()" style="display:flex;align-items:center;gap:12px;background:var(--sand);border:1px solid var(--border);border-radius:8px;padding:11px 13px;text-align:right;font-family:inherit;cursor:pointer;width:100%">
            <div style="width:36px;height:36px;border-radius:5px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">🛒</div>
            <div>
              <div style="font-size:13.5px;font-weight:600;color:var(--ink)">הרכב תפריט חופשי מהקטלוג</div>
              <div style="font-size:11.5px;color:var(--ink3)">בחר מנות ישירות מהקטלוג שלנו</div>
            </div>
            <div style="margin-right:auto;color:var(--ink3);font-size:12px">←</div>
          </button>
        </div>
      </div>` : '';

    document.getElementById('app').innerHTML = `
      ${heroHtml()}
      ${backBarHtml()}
      <div class="wiz-body" style="padding-bottom:60px">
        ${hasSections ? `
        <h2 class="step-title" style="margin-bottom:6px">התפריט שלנו</h2>
        <div class="step-sub" style="margin-bottom:16px">לחצו להתחיל בבחירת המנות</div>
        <button onclick="startTemplateMode()" style="width:100%;background:var(--accent);color:#FBF7EF;border:none;border-radius:8px;padding:16px 20px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:14px;text-align:right">
          <div style="font-size:22px">📋</div>
          <div style="flex:1">
            <div style="font-size:15px;font-weight:700;margin-bottom:3px">${esc(_d.name)}</div>
            <div style="font-size:12.5px;opacity:.85">${_d.slogan ? esc(_d.slogan) : 'בחירה שלב אחר שלב מהקטגוריות'}</div>
          </div>
          <div style="font-size:18px;opacity:.7">←</div>
        </button>` : `
        <button onclick="startCatalogMode()" style="width:100%;background:var(--accent);color:#FBF7EF;border:none;border-radius:8px;padding:16px 20px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:14px;text-align:right">
          <div style="font-size:22px">🛒</div>
          <div style="flex:1">
            <div style="font-size:15px;font-weight:700;margin-bottom:3px">הרכב תפריט</div>
            <div style="font-size:12.5px;opacity:.85">בחר מנות ישירות מהקטלוג שלנו</div>
          </div>
          <div style="font-size:18px;opacity:.7">←</div>
        </button>`}
        ${relatedSection}
      </div>`;
}

async function startTemplateMode() {
    _mode = 'template';
    _step = 0;
    render();
}

async function startCatalogMode() {
    document.getElementById('app').innerHTML = `<div class="state-center"><div class="spinner"></div><span>טוען קטלוג…</span></div>`;
    try {
        const res = await fetch('/api/menu/public/' + encodeURIComponent(slug) + '/catalog');
        if (!res.ok) throw new Error(res.status);
        _catItems = await res.json();
    } catch(e) { renderError('שגיאה בטעינת הקטלוג — נסה לרענן'); return; }
    _cart = {};
    _catFilter = '';
    _catCategory = '';
    _catView = 'browse';
    _mode = 'catalog';
    renderCatalogFlow();
}

/* ── catalog builder ── */
function renderCatalogFlow() {
    if (_catView === 'form')  { renderCatalogForm(); return; }
    if (_catView === 'done')  { renderCatalogDone(); return; }
    renderCatalogBrowse();
}

function _catTotal() {
    return Object.entries(_cart).reduce((s,[id,qty]) => {
        const it = _catItems.find(i => i.id == id);
        return s + (it ? Number(it.price||0)*qty : 0);
    }, 0);
}
function _cartCount() { return Object.values(_cart).reduce((s,q) => s+q, 0); }

function renderCatalogBrowse() {
    const cats = [...new Set(_catItems.map(i => i.category).filter(Boolean))];
    const q = _catFilter.toLowerCase();
    const visible = _catItems.filter(i => {
        if (_catCategory && i.category !== _catCategory) return false;
        if (q && !(i.name||'').toLowerCase().includes(q) && !(i.description||'').toLowerCase().includes(q)) return false;
        return true;
    });
    const cartCount = _cartCount();
    const total = _catTotal();

    const itemCards = visible.map(item => {
        const qty = _cart[item.id] || 0;
        return `<div style="background:var(--surface);border:1.5px solid ${qty?'var(--accent)':'var(--border)'};border-radius:8px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px">
          ${item.image_url ? `<img src="${esc(item.image_url)}" style="width:56px;height:56px;object-fit:cover;border-radius:6px;flex-shrink:0;border:1px solid var(--border)">` : ''}
          <div style="flex:1;min-width:0">
            <div style="font-size:13.5px;font-weight:500;color:var(--ink);margin-bottom:2px">${esc(item.name)}</div>
            ${item.description ? `<div style="font-size:11.5px;color:var(--ink3);margin-bottom:4px;line-height:1.5">${esc(item.description)}</div>` : ''}
            ${item.price > 0 && !(_d.hide_prices || _d.event_mode) ? `<div style="font-size:12.5px;color:var(--accent);font-weight:600">₪${num(item.price)}</div>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:7px;flex-shrink:0;margin-top:2px">
            ${qty > 0 ? `<button onclick="catChangeQty(${item.id},-1)" style="width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">−</button>
            <span style="font-size:14px;font-weight:700;color:var(--ink);min-width:16px;text-align:center">${qty}</span>` : ''}
            <button onclick="catChangeQty(${item.id},1)" style="width:26px;height:26px;border-radius:50%;background:var(--accent);border:none;color:#FBF7EF;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">+</button>
          </div>
        </div>`;
    }).join('');

async function submitCatalogForm() {
    const errEl = document.getElementById('cat-form-err');
    if (!(_form.name||'').trim()) { errEl.textContent = 'שם מלא נדרש'; return; }
    const ph = (_form.phone||'').trim();
    if (!ph || ph.length < 7 || !/^[0-9+\-() ]+$/.test(ph)) { errEl.textContent = 'מספר טלפון לא תקין'; return; }
    const btn = document.querySelector('.btn-next');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }
    const cartItems = Object.entries(_cart).map(([id,qty]) => {
        const it = _catItems.find(i => i.id == id);
        return it ? { catalog_item_id: Number(id), name: it.name, price: it.price, qty } : null;
    }).filter(Boolean);
    try {
        const res = await fetch('/api/menu/public/' + encodeURIComponent(slug) + '/catalog-request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                customer_name: _form.name,
                customer_phone: _form.phone,
                customer_email: _form.email || null,
                event_date: _form.date || null,
                guest_count: _form.guests || null,
                custom_notes: _form.notes || null,
                cart_items: cartItems
            })
        });
        const data = await res.json();
        if (!res.ok) { if (btn) { btn.disabled=false; btn.textContent='שליחת הבקשה ←'; } errEl.textContent = data.error||'שגיאה'; return; }
        window._reqNumber = data.request_number;
        _catView = 'done';
        renderCatalogFlow();
    } catch(e) { if (btn) { btn.disabled=false; btn.textContent='שליחת הבקשה ←'; } errEl.textContent = 'שגיאת תקשורת — נסה שנית'; }
}

/* ── progress ── */
function progressHtml(activeIdx) {
    const steps = _d.sections.map((s,i) => ({ label: s.name, idx: i }));
    steps.push({ label: 'סיכום', idx: steps.length });
    return `<div class="prog-bar">${steps.map((s,i) => {
        const isDone = i < activeIdx;
        const isActive = i === activeIdx;
        return `${i > 0 ? `<div class="prog-line${isDone?' done':''}"></div>` : ''}
        <div class="prog-step">
          <div class="prog-num${isActive?' active':''}${isDone?' done':''}">${isDone ? '✓' : String(i+1).padStart(2,'0')}</div>
          <span class="prog-label" style="${isActive?'color:var(--accent);font-weight:600':'color:var(--ink3)'}">${esc(s.label)}</span>
        </div>`;
    }).join('')}</div>`;
}

/* ── step screen ── */
function renderStep(idx) {
    const sec = _d.sections[idx];
    const items = (sec.items || []).filter(i => i.is_available !== false);
    const isMulti = sec.max_choices > 1;
    const curSel = _sel[sec.id] || [];

    const badge = sec.is_required
        ? (sec.max_choices === 1 ? 'בחרו אחד' : `בחרו ${sec.min_choices}–${sec.max_choices}`)
        : (sec.max_choices === 1 ? 'בחירה אחת (אופציונלי)' : `עד ${sec.max_choices} (אופציונלי)`);

    const itemsHtml = items.map(item => {
        const chosen = curSel.includes(item.id);
        return `<div class="item-card${chosen?' selected':''}${isMulti?' multi':''}" onclick="toggleItem(${sec.id},${item.id},${isMulti},${sec.max_choices})">
          <div class="item-sel"></div>
          ${item.image_url ? `<img src="${esc(item.image_url)}" alt="${esc(item.name)}" style="width:52px;height:52px;object-fit:cover;border-radius:6px;flex-shrink:0;border:1px solid var(--border)">` : ''}
          <div class="item-info">
            <div class="item-name">${esc(item.name)}</div>
            ${item.description ? `<div class="item-desc">${esc(item.description)}</div>` : ''}
            ${item.allergens ? `<div class="item-allergens">אלרגנים: ${esc(item.allergens)}</div>` : ''}
          </div>
          ${item.price > 0 && !(_d.hide_prices || _d.event_mode) ? `<div class="item-price">+₪${num(item.price)}</div>` : ''}
        </div>`;
    }).join('');

    document.getElementById('app').innerHTML = `
      ${heroHtml()}
      ${backBarHtml()}
      ${progressHtml(idx)}
      <div class="wiz-body">
        <div style="font-size:10px;letter-spacing:.22em;color:var(--accent);margin-bottom:8px">${String(idx+1).padStart(2,'0')} / ${String(_d.sections.length).padStart(2,'0')}</div>
        <h2 class="step-title">${esc(sec.name)}</h2>
        <div class="step-sub">${esc(sec.description || badge)}</div>
        <div class="items-grid">${itemsHtml}</div>
        <div class="err-msg" id="step-err">${esc(_err)}</div>
      </div>
      <div class="nav-bar">
        ${idx > 0 ? `<button class="btn-back" onclick="goBack()">חזרה</button>` : '<div></div>'}
        ${(_d.pricing_mode||'per_person')==='per_item' && calcTotal()>0 ? `<span style="font-size:13px;color:var(--accent);font-weight:700;align-self:center">₪${num(calcTotal())}</span>` : '<div></div>'}
        <button class="btn-next" onclick="nextStep(${sec.id},${sec.min_choices||0},${sec.max_choices},${!!sec.is_required})">הבא ←</button>
      </div>`;
    _err = '';
    window.scrollTo(0,0);
}

function toggleItem(secId, itemId, isMulti, maxChoices) {
    const cur = _sel[secId] || [];
    if (!isMulti) {
        _sel[secId] = cur.includes(itemId) ? [] : [itemId];
    } else {
        if (cur.includes(itemId)) {
            _sel[secId] = cur.filter(id => id !== itemId);
        } else {
            if (cur.length >= maxChoices) { _err = `ניתן לבחור עד ${maxChoices} פריטים`; renderStep(_step); return; }
            _sel[secId] = [...cur, itemId];
        }
    }
    _err = '';
    renderStep(_step);
}

function nextStep(secId, minChoices, maxChoices, isRequired) {
    const cur = _sel[secId] || [];
    if (isRequired && cur.length < minChoices) {
        _err = minChoices === 1 ? 'יש לבחור לפחות פריט אחד' : `יש לבחור לפחות ${minChoices} פריטים`;
        document.getElementById('step-err').textContent = _err; return;
    }
    _step++; render();
}

function goBack() { if (_step > 0) { _step--; render(); } }

/* ── summary ── */
function renderSummary() {
    const rows = _d.sections.map((sec, idx) => {
        const chosen = (_sel[sec.id] || []);
        const names = chosen.map(id => {
            const item = (sec.items||[]).find(i => i.id === id);
            return item ? item.name : '';
        }).filter(Boolean);
        return `<tr class="sum-table">
          <td class="lbl">${esc(sec.name)}</td>
          <td class="val">${names.length ? names.map(n=>`<div>${esc(n)}</div>`).join('') : '<span style="color:var(--ink3);font-weight:300">—</span>'}</td>
          <td class="chg"><button onclick="goToStep(${idx})">שינוי</button></td>
        </tr>`;
    }).join('');

    const total = calcTotal();

    document.getElementById('app').innerHTML = `
      ${heroHtml()}
      ${backBarHtml()}
      ${progressHtml(_d.sections.length)}
      <div class="wiz-body">
        <h2 class="step-title">סיכום בחירות</h2>
        <div class="step-sub">בדקו שהכל נכון לפני שממשיכים</div>
        <table class="sum-table">${rows}</table>
        ${total ? `<div class="total-row"><span class="total-label">${(_d.pricing_mode||'per_person')==='per_item' ? 'סה״כ תפריט' : 'סה״כ משוער לאיש'}</span><span class="total-val">₪${num(total)}</span></div>` : ''}
      </div>
      <div class="nav-bar">
        <button class="btn-back" onclick="goBack()">חזרה</button>
        <button class="btn-next" onclick="goToForm()">המשך למילוי פרטים ←</button>
      </div>`;
    window.scrollTo(0,0);
}

function goToStep(idx) { _step = idx; render(); }
function goToForm() { _step = _d.sections.length + 1; render(); }

function calcTotal() {
    const pm = _d.pricing_mode || 'per_person';
    let itemsTotal = 0;
    for (const sec of _d.sections) {
        for (const id of (_sel[sec.id] || [])) {
            const item = (sec.items||[]).find(i => i.id === id);
            if (item && item.price > 0) itemsTotal += Number(item.price);
        }
    }
    if (pm === 'per_item') return itemsTotal;
    if (!_d.base_price_per_person) return 0;
    return Number(_d.base_price_per_person) + itemsTotal;
}

                guest_count: _form.guests ? parseInt(_form.guests) : undefined,
                custom_notes: (_form.notes||'').trim() || undefined,
                selections
            })
        });
        const data = await res.json();
        if (!res.ok) { errEl.textContent = data.error || 'שגיאה בשליחה'; btn.disabled=false; btn.textContent='שליחת הבקשה ←'; return; }
        window._reqNumber = data.request_number;
        _step = _d.sections.length + 2;
        render();
    } catch(e) {
        errEl.textContent = 'שגיאת תקשורת — נסה שוב';
        btn.disabled=false; btn.textContent='שליחת הבקשה ←';
    }
}

/* ── apply design options to the public page (palette → CSS vars, plating/airiness → dynamic style) ── */
function _applyPageDesign() {
    const p = _PDF_PALETTES[_pdfOpts.palette] || _PDF_PALETTES.bordeaux;
    const root = document.documentElement;
    root.style.setProperty('--accent',  p.accent);
    root.style.setProperty('--accent2', p.ink === '#0E1824' ? '#1E3560' : p.accent + 'CC');
    root.style.setProperty('--border',  p.ruleSoft);
    root.style.setProperty('--bg',      p.paper);

    // plating & airiness via dynamic style tag
    const air = _pdfOpts.airiness || 2;
    const itemGap   = [8, 10, 14][air-1] + 'px';
    const cardPad   = [11, 14, 18][air-1] + 'px 14px';
    const gridGap   = [8, 10, 14][air-1] + 'px';
    const plating   = _pdfOpts.plating || 'square';
    const imgRadius = plating === 'circle' ? '50%' : '6px';
    const imgSize   = plating === 'large' ? '80px' : '56px';
    const imgDisp   = plating === 'none' ? 'none' : 'block';

    let dyn = document.getElementById('_design-dyn-style');
    if (!dyn) { dyn = document.createElement('style'); dyn.id = '_design-dyn-style'; document.head.appendChild(dyn); }
    dyn.textContent = `
      .items-grid{gap:${gridGap}}
      .item-card{padding:${cardPad}}
      .item-card img{width:${imgSize};height:${imgSize};border-radius:${imgRadius};display:${imgDisp}}
    `;
}

function _pdfBuildSections(sections, selFilter) {

        let items = (sec.items || []).filter(i => i.is_available !== false);
        if (selFilter) {
            const ids = selFilter[sec.id] || [];
            items = ids.map(id => items.find(i => i.id === id)).filter(Boolean);

        const dishesHtml = items.map(item => _pdfDish(item, showPrices)).join('');
        return `

            ${_pdfDivider()}
            <div class="pdf-sec-title">${esc(sec.name)}</div>

      <div style="background:${p.accent};color:#fff;text-align:center;padding:18px 24px 16px;margin-bottom:0;break-inside:avoid">
        ${_d.event_greeting ? `<div style="font-size:17px;font-weight:700;line-height:1.4;margin-bottom:${_d.event_intro ? '8px' : '0'}">${esc(_d.event_greeting)}</div>` : ''}
        ${_d.event_intro ? `<div style="font-size:12px;opacity:.9;line-height:1.7;white-space:pre-line">${esc(_d.event_intro)}</div>` : ''}
      </div>` : '';
    return `
      ${_pdfStyles()}
      <div style="direction:rtl">
        ${_pdfHeader(bizName)}
        ${eventBanner}
        ${heroBlock}
        ${_pdfTitleSection(bizName, titleOverride)}
        ${sectionsHtml}
        ${footnoteHtml || ''}
        ${_pdfFooter()}
      </div>`;
}

function buildFullPdfSource(selOnly) {
    // selOnly=true → show only _sel selections (for summary step PDF)
    const bizName = _d.name || '';
    const selFilter = selOnly ? _sel : null;
    const sectionsHtml = _pdfBuildSections(_d.sections || [], selFilter);

    const footnotes = [];
    if (!selOnly) {
        if ((_d.pricing_mode||'per_person')==='per_person' && _d.base_price_per_person > 0)
            footnotes.push(`מחיר לאיש: ₪${num(_d.base_price_per_person)}`);
        if (_d.min_guests && _d.max_guests)
            footnotes.push(`${_d.min_guests}–${_d.max_guests} אורחים`);
    } else {
        const total = calcTotal();
        if (total) footnotes.push(`סה"כ: ₪${num(total)}`);
    }
    const footnoteHtml = footnotes.length ? `<div class="pdf-footnote">${footnotes.join(' · ')}</div>` : '';

    buildPrintTarget(_pdfWrap(bizName, null, sectionsHtml, footnoteHtml));
}

function exportMenuPDF() {
    if (_mode === 'catalog') {
        // If user has cart items — show only cart; otherwise show full catalog
        const hasCart = Object.keys(_cart).length > 0;
        buildCatalogPdfSource(hasCart);
    } else {
        // In template mode: if on summary or beyond, show only selected items
        const onSummaryOrLater = _step >= (_d.sections||[]).length;
        const hasSelections = Object.values(_sel).some(arr => arr.length > 0);
        buildFullPdfSource(onSummaryOrLater && hasSelections);
    }
    window.print();
}

function buildCatalogPdfSource(cartOnly) {
    const bizName = _d.name || '';
    // Show only cart items when cartOnly=true
    const sourceItems = cartOnly
        ? Object.entries(_cart)
            .map(([id, qty]) => { const it = _catItems.find(i => i.id === Number(id)); return it ? { ...it, _qty: qty } : null; })
            .filter(Boolean)
        : _catItems;

    const cats = [...new Set(sourceItems.map(i => i.category).filter(Boolean))];
    const grouped = cats.length
        ? cats.map(cat => ({ name: cat, items: sourceItems.filter(i => i.category === cat) }))
        : [{ name: null, items: sourceItems }];

    const sectionsHtml = grouped.map(g => {
        const dishesHtml = g.items.map(item => _pdfDish(item, true)).join('');
        return `
          <div class="pdf-section-block" style="margin-bottom:6px">
            ${_pdfDivider()}
            ${g.name ? `<div class="pdf-sec-title">${esc(g.name)}</div>` : ''}
            <div class="pdf-dishes-list">${dishesHtml}</div>
          </div>`;
    }).join('');

    const total = cartOnly ? Object.entries(_cart).reduce((s,[id,qty]) => {
        const it = _catItems.find(i => i.id === Number(id));
        return s + (it ? Number(it.price||0)*qty : 0);
    }, 0) : 0;
    const footnoteHtml = total ? `<div class="pdf-footnote">סה"כ: ₪${num(total)}</div>` : '';

    buildPrintTarget(_pdfWrap(bizName, 'קטלוג מנות', sectionsHtml, footnoteHtml));
}

function exportAndShareWa() {
    const menuUrl = `${location.origin}${location.pathname}`;
    const text = `היי, הנה התפריט שלנו — ${_d.name}:\n${menuUrl}`;
    if (navigator.share) {
        navigator.share({ title: `תפריט ${_d.name}`, text, url: menuUrl }).catch(() => {
            window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
        });
    } else {
        window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }
}

/* ── utilities ── */
function renderError(msg) {
    document.getElementById('app').innerHTML = `<div class="state-center"><span style="font-size:32px">🍽️</span><span>${msg}</span></div>`;
}
function esc(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function num(n) { return Number(n).toLocaleString('he-IL'); }
</script>
