<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">קמפיין קהילה</title>
<!-- ברירת מחדל לתצוגה המקדימה בווצאפ/רשתות — עבור לינקים בנתיב /campaign/:code
     השרת מחליף את התגים האלה בזמן אמת לפי הגדרות הקמפיין (ראה server.js) -->
<meta property="og:type" content="website">
<meta property="og:title" content="קמפיין קהילה">
<meta property="og:description" content="קמפיין קהילה ב-WEFLOWZ — הצטרפו והזמינו מהעסקים המשתתפים">
<meta property="og:image" content="">
<link rel="icon" href="/api/public/logo" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
/* Design system copied from storefront-restaurant.html ("חמה" template) — the same visual
   language every business using that template gets for its own public storefront. */
*,*::before,*::after{box-sizing:border-box}
:root{--accent:#e63946;--accent-dark:#c0392b;--bg:#FAFAF7;--dark:#111113;--border:#ECEAE3;--card:#fff;--muted:#8C8C86;--subtle:#F1EFE9}
body{margin:0;background:var(--bg);font-family:'Heebo',system-ui,sans-serif;color:var(--dark);direction:rtl;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
input,button,select,textarea{font-family:inherit}
::placeholder{color:#9E9E98}
::-webkit-scrollbar{height:5px;width:5px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:99px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.72);opacity:0}65%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}
@keyframes panelIn{from{transform:translateX(101%)}to{transform:none}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sheetIn{from{transform:translateY(101%)}to{transform:none}}

/* גיליון פרטי מוצר (תוספות/מרכיבים) — זהה לתבנית "חמה" (storefront-restaurant.html) */
#sheet-overlay{position:fixed;inset:0;z-index:400;background:rgba(10,10,11,.55);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
#sheet{width:min(520px,100%);max-height:94vh;background:var(--bg);border-radius:26px 26px 0 0;overflow:auto;animation:sheetIn .28s cubic-bezier(.2,.8,.2,1) both}
#sheet-img{position:relative;aspect-ratio:16/9;background:var(--subtle);display:flex;align-items:center;justify-content:center}
#sheet-img img{width:100%;height:100%;object-fit:cover}
#sheet-img-ph{font-size:48px;opacity:.5}
#sheet-close{position:absolute;top:max(12px,env(safe-area-inset-top,12px));left:12px;width:34px;height:34px;border:none;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:14px;cursor:pointer;color:var(--dark);z-index:5;display:flex;align-items:center;justify-content:center}
#sheet-body{padding:20px 20px 26px;display:flex;flex-direction:column;gap:14px}
#sheet-name-row{display:flex;align-items:baseline;gap:10px}
#sheet-name{font-family:'Rubik',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.035em;margin:0}
#sheet-price{font-family:'Rubik',sans-serif;font-size:19px;font-weight:700;margin-right:auto;letter-spacing:-.03em}
#sheet-desc{font-size:13.5px;font-weight:300;color:#6E6E69;line-height:1.55;margin:0}
#sheet-meta-text{font-size:11.5px;color:#A5A59E}
.sheet-section-title{font-size:13px;font-weight:600;margin-bottom:8px}
.sheet-option{display:flex;align-items:center;gap:10px;width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:13px;background:#fff;cursor:pointer;text-align:right;transition:.15s;font-size:13.5px;font-weight:500}
.sheet-option.checked{border-color:var(--dark);background:var(--subtle)}
.opt-check{width:20px;height:20px;flex:none;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;border:1px solid #D9D6CD}
.opt-check.on{background:var(--dark);border-color:var(--dark)}
.opt-extra-price{margin-right:auto;font-size:13px;font-weight:600;color:#6E6E69}
#sheet-note-input{width:100%;padding:12px 15px;border:1px solid var(--border);border-radius:14px;background:#fff;font-size:13px;outline:none;transition:.15s;box-sizing:border-box}
#sheet-note-input:focus{border-color:var(--dark)}
#sheet-footer{position:sticky;bottom:0;padding-top:6px;background:linear-gradient(to top,var(--bg) 70%,rgba(250,250,247,0));display:flex;gap:10px;align-items:center}
#sheet-qty-ctrl{display:flex;align-items:center;gap:3px;background:#fff;border:1px solid var(--border);border-radius:99px;padding:4px;flex:none}
.sq-btn{width:32px;height:32px;border:none;border-radius:50%;background:transparent;font-size:17px;cursor:pointer;transition:.15s}
.sq-btn:hover{background:var(--subtle)}
#sheet-qty-val{min-width:22px;text-align:center;font-size:14px;font-weight:700}
#sheet-add-btn{flex:1;padding:15px;border:none;border-radius:16px;background:var(--dark);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
#sheet-add-btn:hover{background:var(--accent)}

#main-header{position:sticky;top:0;z-index:200;background:rgba(250,250,247,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
#header-inner{max-width:1280px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#header-logo{width:48px;height:48px;flex:none;border-radius:13px;background:var(--dark);display:flex;align-items:center;justify-content:center;overflow:hidden}
#header-logo img{width:100%;height:100%;object-fit:contain;border-radius:13px;padding:4px}
#header-logo i{color:#fff;font-size:15px}
#header-name{font-family:'Rubik',sans-serif;font-size:16.5px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}
#cart-header-btn{display:flex;align-items:center;gap:9px;padding:9px 8px 9px 15px;border:none;border-radius:99px;background:var(--dark);color:#fff;font-size:13px;font-weight:600;cursor:pointer;flex:none;transition:background .15s;margin-right:auto}
#cart-header-btn:hover{background:var(--accent)}
#cart-header-count{min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:99px;background:rgba(255,255,255,.18);font-size:11.5px;font-weight:700}

/* מובייל: גובה נגזר מהתוכן (כותרת/סלוגן/תיאור) כדי שהטקסט לעולם לא ייחתך,
   אבל התמונה תמיד ב-cover כך שהיא ממלאת את כל השטח ללא רווחים/פסים כהים
   מעל ומתחת (עלול לחתוך מעט מהצדדים בתמונה — עדיף על פני שטח ריק) */
#hero{position:relative;background:var(--dark) center/cover no-repeat;overflow:hidden;min-height:200px}
/* דסקטופ/טאבלט: מספיק רוחב שהטקסט תמיד נכנס גם ביחס קבוע — נועל יחס 18:5
   כדי שתמונת נושא במידות המומלצות (1800×500) תמלא בדיוק 100% מהשטח, בלי
   חיתוך ובלי רווחים */
@media (min-width:820px){
    #hero{aspect-ratio:18/5;min-height:0;display:flex;align-items:center}
}
#hero-blob1{position:absolute;top:-30%;left:-6%;width:54%;height:80%;border-radius:50%;background:var(--accent);filter:blur(100px);opacity:.38}
#hero-blob2{position:absolute;bottom:-30%;right:-8%;width:46%;height:70%;border-radius:50%;background:#e8a87c;filter:blur(110px);opacity:.2}
#hero-inner{position:relative;max-width:1280px;margin:0 auto;padding:clamp(28px,4vw,54px) 20px clamp(24px,3vw,40px)}
#hero-text{animation:rise .5s ease both}
#hero-badge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:12px;font-weight:500;color:rgba(255,255,255,.86);margin-bottom:16px}
#hero-badge-dot{width:7px;height:7px;border-radius:50%;background:#7FB77E;animation:glow 2s ease-in-out infinite}
#hero h1{font-family:'Rubik',sans-serif;font-size:clamp(30px,5.4vw,52px);font-weight:800;letter-spacing:-.045em;line-height:1;color:#fff;margin:0 0 13px;text-wrap:balance}
#hero-slogan{font-size:clamp(15px,1.8vw,18px);font-weight:600;color:var(--accent);margin:0 0 8px}
#hero-sub{font-size:clamp(13px,1.4vw,15px);font-weight:300;color:rgba(255,255,255,.64);line-height:1.55;margin:0;max-width:52ch}

#biz-nav-wrap{position:sticky;top:59px;z-index:100;background:rgba(250,250,247,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
#biz-nav{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
#biz-nav::-webkit-scrollbar{display:none}
.biz-pill{flex:none;padding:8px 15px;border:none;border-radius:99px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;transition:.15s;background:#fff;color:#5C5C58;box-shadow:0 1px 2px rgba(0,0,0,.05);display:inline-flex;align-items:center;gap:6px}
.biz-pill.active{background:var(--dark);color:#fff}
.biz-pill img{width:16px;height:16px;border-radius:50%;object-fit:cover}

#catalog-outer{max-width:1280px;margin:0 auto;padding:clamp(18px,2.4vw,28px) 20px 0}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:13px}
/* מובייל: שני מוצרים בשורה במקום מוצר אחד ברוחב מלא, בגודל קומפקטי יותר —
   דסקטופ (מעל 820px) לא משתנה */
@media (max-width:819px){
    .products-grid{grid-template-columns:1fr 1fr;gap:9px}
    .product-card{padding:7px;border-radius:16px}
    .product-name{font-size:12.5px}
    .product-price{font-size:14px}
    .community-badge{font-size:9px;padding:2px 6px}
    .product-footer{gap:5px;padding-top:8px;flex-wrap:wrap}
    .add-pill{height:28px;padding:0 10px;font-size:11px}
}
.product-card{background:#fff;border-radius:20px;padding:9px;display:flex;flex-direction:column;transition:.18s cubic-bezier(.2,.8,.2,1);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.product-card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(0,0,0,.1)}
.product-img-wrap{position:relative;aspect-ratio:4/3;border-radius:14px;background:var(--subtle);display:flex;align-items:center;justify-content:center;overflow:hidden}
.product-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.product-img-ph{font-size:32px;opacity:.5}
.community-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;font-size:10.5px;font-weight:600;margin-bottom:4px;width:fit-content}
.product-body{padding:12px 7px 5px;display:flex;flex-direction:column;gap:4px;flex:1}
.product-name{font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.product-footer{display:flex;align-items:center;gap:9px;margin-top:auto;padding-top:12px}
.product-price{font-family:'Rubik',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.03em}
.add-pill{margin-right:auto;height:34px;padding:0 14px;border:none;border-radius:99px;background:var(--subtle);color:var(--dark);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
.add-pill:hover{background:var(--dark);color:#fff}
.catalog-empty{padding:46px 20px;text-align:center;color:var(--muted);font-weight:300}

#store-footer{margin-top:clamp(30px,4vw,54px);background:var(--dark);color:rgba(255,255,255,.6)}
#footer-inner{max-width:1280px;margin:0 auto;padding:24px 20px;text-align:center}
#footer-copy{font-size:11.5px;color:rgba(255,255,255,.35)}

#cart-bar{position:sticky;bottom:0;z-index:300;padding:13px 18px calc(13px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 62%,rgba(250,250,247,0));display:none}
#cart-bar-inner{max-width:1240px;margin:0 auto;background:var(--dark);border-radius:20px;padding:12px 14px;box-shadow:0 14px 36px rgba(0,0,0,.24);animation:pop .24s ease both}
#cart-bar-btn{width:100%;display:flex;align-items:center;gap:11px;padding:12px 8px 12px 12px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;transition:.15s}
#cart-bar-btn:hover{background:var(--accent-dark)}
#cart-bar-count{min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(255,255,255,.2);font-size:13px;font-weight:700}
#cart-bar-label{flex:1;text-align:right}
#cart-bar-total{font-family:'Rubik',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.03em}

#panel-overlay{position:fixed;inset:0;z-index:500;background:rgba(10,10,11,.55);backdrop-filter:blur(3px);display:none;justify-content:flex-end}
#cart-panel{width:min(430px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;animation:panelIn .28s cubic-bezier(.2,.8,.2,1) both}
#panel-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:#fff}
#panel-title{font-family:'Rubik',sans-serif;font-size:19px;font-weight:700;letter-spacing:-.03em}
#panel-close{margin-right:auto;width:32px;height:32px;border:none;border-radius:50%;background:var(--subtle);font-size:14px;cursor:pointer;color:#3B3B39;transition:.15s}
#panel-close:hover{background:var(--dark);color:#fff}
#panel-body{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
#panel-cart-step{display:flex;flex-direction:column;gap:9px}
.single-biz-notice{display:flex;align-items:center;gap:8px;padding:10px 13px;border-radius:14px;background:#fef3c7;border:1px solid #fde68a;color:#92400e;font-size:12px;font-weight:600}
.cart-line{display:flex;gap:11px;padding:11px;background:#fff;border-radius:16px;align-items:flex-start}
.cart-line-img{width:46px;height:46px;flex:none;border-radius:12px;background:var(--subtle);display:flex;align-items:center;justify-content:center;font-size:16px;opacity:.5}
.cart-line-info{flex:1;min-width:0}
.cart-line-name{font-size:13.5px;font-weight:600}
.cart-line-remove{margin-top:4px;padding:0;border:none;background:transparent;font-size:11.5px;color:var(--accent);cursor:pointer;font-weight:500}
.cart-line-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.cart-line-price{font-size:13.5px;font-weight:700}
.qty-mini{display:flex;align-items:center;gap:2px;background:var(--subtle);border-radius:99px;padding:2px}
.qty-mini button{width:26px;height:26px;border:none;border-radius:50%;background:transparent;font-size:15px;cursor:pointer}
.qty-mini .qm-val{min-width:18px;text-align:center;font-size:12.5px;font-weight:700}
#cart-empty-msg{padding:34px 10px;text-align:center;color:var(--muted);font-weight:300;font-size:13.5px}

#panel-checkout-step{display:none;flex-direction:column;gap:14px}
.checkout-card{background:#fff;border-radius:18px;padding:16px}
.checkout-card-title{font-size:13px;font-weight:600;margin-bottom:10px}
.co-input{width:100%;padding:12px 15px;border:1px solid var(--border);border-radius:13px;font-size:13px;outline:none;margin-bottom:9px;transition:.15s}
.co-input:focus{border-color:var(--dark)}
.co-input:last-child{margin-bottom:0}
.co-input[readonly]{background:var(--subtle);color:var(--muted)}
.pickup-note{display:flex;align-items:flex-start;gap:9px;padding:12px 13px;border-radius:13px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12px;font-weight:500;line-height:1.5}

#panel-done-step{display:none;flex-direction:column;gap:16px;padding-top:10px}
#done-icon{width:62px;height:62px;margin:0 auto 14px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:27px;animation:pop .3s ease both}
#done-title{font-family:'Rubik',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.035em;text-align:center}
#done-sub{font-size:13px;color:var(--muted);font-weight:300;text-align:center;margin-top:4px}
#new-order-btn{padding:14px;border:1px solid var(--border);border-radius:15px;background:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
#new-order-btn:hover{background:var(--dark);color:#fff}

#panel-summary{border-top:1px solid var(--border);background:#fff;padding:16px 20px calc(16px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:8px}
.sum-row{display:flex;justify-content:space-between;font-size:13px;color:#6E6E69}
.sum-total{display:flex;justify-content:space-between;padding-top:9px;border-top:1px solid var(--border);font-family:'Rubik',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.03em}
#panel-primary-btn{padding:15px;border:none;border-radius:15px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
#panel-primary-btn:hover{background:var(--accent-dark)}
#panel-primary-btn:disabled{opacity:.6;cursor:default}
#panel-back-btn{padding:9px;border:none;background:transparent;font-size:12.5px;color:var(--muted);cursor:pointer;font-weight:500;display:none}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;padding:13px 22px;border-radius:99px;background:var(--dark);color:#fff;font-size:13.5px;font-weight:500;box-shadow:0 14px 36px rgba(0,0,0,.3);animation:pop .22s ease both;display:none;white-space:nowrap;max-width:90vw}
#loading-screen{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.spinner{width:36px;height:36px;border:3px solid #eee;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
</style>
</head>
<body>

<div id="toast"></div>
<div id="loading-screen"><div class="spinner"></div><p style="font-size:14px;color:var(--muted);font-weight:600">טוען קמפיין...</p></div>

<div id="main-header" style="display:none">
  <div id="header-inner">
    <div id="header-logo"><i class="fa-solid fa-people-group"></i></div>
    <div id="header-name">קמפיין קהילה</div>
    <button id="cart-header-btn" onclick="csOpenCart()">
      <span id="cart-header-count">0</span>
      <i class="fa-solid fa-bag-shopping"></i>
    </button>
  </div>
</div>

<div id="hero" style="display:none">
  <div id="hero-blob1"></div><div id="hero-blob2"></div>
  <div id="hero-inner">
    <div id="hero-text">
      <div id="hero-badge"><span id="hero-badge-dot"></span><span id="cs-community-name">קמפיין קהילה</span></div>
      <h1 id="cs-title">טוען...</h1>
      <p id="hero-slogan" style="display:none"></p>
      <p id="hero-sub"></p>
    </div>
  </div>
</div>

<div id="biz-nav-wrap" style="display:none">
  <div id="biz-nav"></div>
</div>

<div id="catalog-outer">
  <div class="products-grid" id="cs-products"></div>
</div>

<div id="store-footer" style="display:none">
  <div id="footer-inner"><div id="footer-copy">מופעל על ידי WEFLOWZ</div></div>
</div>

<div id="cart-bar">
  <div id="cart-bar-inner">
    <button id="cart-bar-btn" onclick="csOpenCart()">
      <span id="cart-bar-count">0</span>
      <span id="cart-bar-label">לצפייה בעגלה</span>
      <span id="cart-bar-total">₪0</span>
    </button>
  </div>
</div>

<!-- CART PANEL (cart step / checkout step / done step) -->
<div id="panel-overlay" onclick="if(event.target===this)csCloseCart()">
  <div id="cart-panel">
    <div id="panel-head">
      <button id="panel-back-btn" onclick="csBackToCart()"><i class="fa-solid fa-arrow-right"></i></button>
      <span id="panel-title">העגלה שלך</span>
      <button id="panel-close" onclick="csCloseCart()">✕</button>
    </div>
    <div id="panel-body">
      <div id="panel-cart-step">
        <div id="cs-single-biz-notice" class="single-biz-notice" style="display:none"><i class="fa-solid fa-circle-info"></i><span></span></div>
        <div id="cs-cart-items"></div>
      </div>
      <div id="panel-checkout-step">
        <div class="pickup-note"><i class="fa-solid fa-store mt-0.5"></i><span>ההזמנה לאיסוף עצמי מהעסק — אין אפשרות משלוח בקמפיין קהילתי.</span></div>
        <div class="checkout-card">
          <div class="checkout-card-title">פרטי הזמנה</div>
          <input id="cs-cust-name" class="co-input" readonly placeholder="שם מלא">
          <input id="cs-cust-phone" class="co-input" readonly placeholder="טלפון" style="direction:ltr;text-align:center">
          <textarea id="cs-cust-notes" class="co-input" rows="2" placeholder="הערות להזמנה (אופציונלי)" style="resize:none;margin-bottom:0"></textarea>
        </div>
      </div>
      <div id="panel-done-step">
        <div id="done-icon"><i class="fa-solid fa-check"></i></div>
        <div id="done-title">ההזמנה נשלחה!</div>
        <div id="done-sub">ניתן לאסוף מהעסק בהתאם לתיאום</div>
        <button id="new-order-btn" onclick="csCloseCart()">סגור</button>
      </div>
    </div>
    <div id="panel-summary">
      <div class="sum-total"><span>סה"כ</span><span id="cs-panel-total">₪0</span></div>
      <button id="panel-primary-btn" onclick="csPrimaryAction()">המשך להזמנה</button>
    </div>
  </div>
</div>

<!-- sc-auth modal (login/register) -->
<div id="sc-auth-modal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.55)" onclick="if(event.target===this)scAuth.closeModal()">
  <div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;max-height:95vh;overflow-y:auto">
    <div style="padding:20px 20px 0;display:flex;align-items:center;gap:12px">
      <button onclick="scAuth.closeModal()" style="width:32px;height:32px;border-radius:50%;background:#f1f5f9;border:none;cursor:pointer;font-size:16px;flex-shrink:0">✕</button>
      <h3 id="sc-modal-title" style="flex:1;text-align:right;font-size:18px;font-weight:700;color:#1e293b;margin:0">כניסה / הרשמה</h3>
    </div>
    <div id="sc-modal-body" style="padding:20px 20px 36px"></div>
  </div>
</div>

<!-- PIN confirmation overlay -->
<div id="sc-pin-overlay" style="display:none;position:fixed;inset:0;z-index:10001;background:rgba(0,0,0,0.6);align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:20px;padding:28px 24px;width:320px;max-width:90vw;text-align:center">
    <div style="font-size:32px;margin-bottom:8px">🔐</div>
    <h4 style="font-size:16px;font-weight:700;color:#1e293b;margin:0 0 6px">אישור פעולה</h4>
    <p style="font-size:13px;color:#64748b;margin:0 0 18px">הזן את ה-PIN שלך לאישור</p>
    <div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px">
      <input id="sc-pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="• • • • • •"
        style="width:140px;border:2px solid #6366f1;border-radius:12px;padding:12px;font-size:20px;text-align:center;letter-spacing:6px"
        onkeydown="if(event.key==='Enter')scAuth.confirmPin()"/>
    </div>
    <div id="sc-pin-error" style="color:#ef4444;font-size:13px;min-height:18px;margin-bottom:12px"></div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button onclick="scAuth._pinReject&&scAuth._pinReject('cancelled');document.getElementById('sc-pin-overlay').style.display='none'"
        style="padding:10px 20px;border:1.5px solid #e2e8f0;border-radius:12px;background:#fff;font-size:14px;cursor:pointer;color:#64748b">ביטול</button>
    </div>
  </div>
</div>

<!-- אזור אישי (sc-auth) — קמפיין קהילה מקיף כמה עסקים, אז אין "פעילות" של עסק
     בודד להציג כאן כמו בחנות ציבורית רגילה; הפאנל הזה נשאר קיים כי sc-auth.js
     תמיד מפנה אליו (מונע קריסת JS שקטה), אבל כפתור המשתמש בעמוד הזה פותח ישירות
     הזמנות + עריכת פרופיל + התנתקות — נעשה ע"י דריסת scAuth.openActivityPanel ב-community-store-app.js -->
<div id="sc-activity-panel" style="display:none;position:fixed;inset:0;z-index:9997;background:rgba(0,0,0,0.5)" onclick="if(event.target===this)document.getElementById('sc-activity-panel').style.display='none'">
  <div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;max-height:90vh;display:flex;flex-direction:column">
    <div style="padding:18px 18px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f1f5f9;flex-shrink:0">
      <button onclick="document.getElementById('sc-activity-panel').style.display='none'" style="width:32px;height:32px;border-radius:50%;background:#f1f5f9;border:none;cursor:pointer">✕</button>
      <h3 style="flex:1;text-align:right;font-size:17px;font-weight:700;color:#1e293b;margin:0">האזור האישי שלי</h3>
    </div>
    <div id="sc-activity-list" style="flex:1;overflow-y:auto;padding:12px 16px"></div>
  </div>
</div>

<!-- גיליון פרטי מוצר — תוספות/מרכיבים, זהה למבנה בחנות הציבורית המקורית (storefront-restaurant.html) -->
<div id="sheet-overlay" onclick="if(event.target===this)closeSheet()">
  <div id="sheet">
    <div id="sheet-img">
      <div id="sheet-img-ph">🍽️</div>
      <button id="sheet-close" onclick="closeSheet()">✕</button>
    </div>
    <div id="sheet-body">
      <div>
        <div id="sheet-name-row">
          <h3 id="sheet-name"></h3>
          <span id="sheet-price"></span>
        </div>
        <p id="sheet-desc"></p>
        <div id="sheet-meta-text"></div>
      </div>
      <div id="sheet-options"></div>
      <div>
        <div class="sheet-section-title">הערה</div>
        <input id="sheet-note-input" placeholder="הערות מיוחדות…">
      </div>
      <div id="sheet-footer">
        <div id="sheet-qty-ctrl">
          <button class="sq-btn" onclick="sheetQty(1)">+</button>
          <span id="sheet-qty-val">1</span>
          <button class="sq-btn" onclick="sheetQty(-1)">−</button>
        </div>
        <button id="sheet-add-btn" onclick="sheetAdd()">הוספה לעגלה · ₪0</button>
      </div>
    </div>
  </div>
</div>

<script src="/sc-auth.js"></script>
<script src="/community-store-app.js?v=13"></script>
</body>
</html>
