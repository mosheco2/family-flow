<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>קמפיין קהילה | WEFLOWZ</title>
    <link rel="icon" href="/api/public/logo" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Heebo', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .chip { white-space: nowrap; scroll-snap-align: start; }
    </style>
</head>
<body class="pb-28">

    <!-- Header / Banner -->
    <div id="cs-banner" class="bg-gradient-to-br from-indigo-600 to-purple-600 text-white px-5 pt-8 pb-6 rounded-b-[2rem] shadow-lg">
        <div class="max-w-2xl mx-auto">
            <div class="flex items-center gap-2 text-xs font-bold text-indigo-100 mb-1"><i class="fa-solid fa-people-group"></i><span id="cs-community-name">קמפיין קהילה</span></div>
            <h1 id="cs-title" class="text-2xl font-black">טוען...</h1>
            <p id="cs-desc" class="text-sm text-indigo-100 mt-1"></p>
        </div>
    </div>

    <div class="max-w-2xl mx-auto px-4 -mt-4">
        <!-- Business filter chips -->
        <div id="cs-biz-chips" class="flex gap-2 overflow-x-auto hide-scrollbar py-3 mb-2"></div>

        <!-- Products grid -->
        <div id="cs-products" class="grid grid-cols-2 gap-3 pb-6">
            <div class="col-span-2 text-center text-slate-400 py-12"><i class="fa-solid fa-spinner fa-spin ml-2"></i>טוען מוצרים...</div>
        </div>
    </div>

    <!-- Floating cart button -->
    <button id="cs-cart-btn" onclick="csOpenCart()" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-indigo-600 text-white font-bold px-6 py-3.5 rounded-full shadow-2xl flex items-center gap-2.5 z-40">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cs-cart-count">0</span> פריטים · ₪<span id="cs-cart-total">0</span>
    </button>

    <!-- Cart drawer -->
    <div id="cs-cart-modal" class="hidden fixed inset-0 bg-black/50 z-50" onclick="if(event.target===this)csCloseCart()">
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-full max-w-lg bg-white rounded-t-[2rem] max-h-[85vh] overflow-y-auto">
            <div class="p-5 pb-2 flex items-center justify-between sticky top-0 bg-white z-10 border-b border-slate-100">
                <button onclick="csCloseCart()" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center">✕</button>
                <h3 class="font-black text-lg text-slate-800">העגלה שלך</h3>
            </div>
            <div id="cs-cart-biz-name" class="px-5 pt-2 text-xs font-bold text-indigo-600"></div>
            <div id="cs-cart-items" class="p-5 space-y-3"></div>
            <div class="p-5 border-t border-slate-100">
                <div class="flex justify-between items-center mb-4 text-lg font-black text-slate-800">
                    <span>סה"כ</span><span>₪<span id="cs-cart-modal-total">0</span></span>
                </div>
                <button onclick="csCheckout()" id="cs-checkout-btn" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-2xl shadow-lg">המשך להזמנה</button>
            </div>
        </div>
    </div>

    <!-- sc-auth modal (login/register) -->
    <div id="sc-auth-modal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.55)" onclick="if(event.target===this)scAuth.closeModal()">
      <div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;max-height:95vh;overflow-y:auto">
        <div style="padding:20px 20px 0;display:flex;align-items:center;gap:12px">
          <button onclick="scAuth.closeModal()" style="width:32px;height:32px;border-radius:50%;background:#f1f5f9;border:none;cursor:pointer;font-size:16px;flex-shrink:0">✕</button>
          <h3 id="sc-modal-title" style="flex:1;text-align:right;font-size:18px;font-weight:700;color:#1e293b;margin:0">כניסה / הרשמה</h3>
        </div>
        <div id="sc-modal-body" style="padding:20px 20px 36px"></div>
      </div>
    </div>

    <!-- PIN confirmation overlay -->
    <div id="sc-pin-overlay" style="display:none;position:fixed;inset:0;z-index:10001;background:rgba(0,0,0,0.6);align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:20px;padding:28px 24px;width:320px;max-width:90vw;text-align:center">
        <div style="font-size:32px;margin-bottom:8px">🔐</div>
        <h4 style="font-size:16px;font-weight:700;color:#1e293b;margin:0 0 6px">אישור פעולה</h4>
        <p style="font-size:13px;color:#64748b;margin:0 0 18px">הזן את ה-PIN שלך לאישור</p>
        <div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px">
          <input id="sc-pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="• • • • • •"
            style="width:140px;border:2px solid #6366f1;border-radius:12px;padding:12px;font-size:20px;text-align:center;letter-spacing:6px"
            onkeydown="if(event.key==='Enter')scAuth.confirmPin()"/>
        </div>
        <div id="sc-pin-error" style="color:#ef4444;font-size:13px;min-height:18px;margin-bottom:12px"></div>
        <div style="display:flex;gap:10px;justify-content:center">
          <button onclick="scAuth._pinReject&&scAuth._pinReject('cancelled');document.getElementById('sc-pin-overlay').style.display='none'"
            style="padding:10px 20px;border:1.5px solid #e2e8f0;border-radius:12px;background:#fff;font-size:14px;cursor:pointer;color:#64748b">ביטול</button>
        </div>
      </div>
    </div>

    <script src="/sc-auth.js"></script>
    <script src="community-store-app.js?v=1"></script>
</body>
</html>
