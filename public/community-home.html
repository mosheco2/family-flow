<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>עולם הקהילות — One Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8fafc; }
        .fade-in { animation: fadeIn .35s ease; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .banner-scroll { scrollbar-width: none; }
        .banner-scroll::-webkit-scrollbar { display: none; }
        .slide-up { animation: slideUp .4s cubic-bezier(.4,0,.2,1); }
        @keyframes slideUp { from { transform:translateY(30px); opacity:0; } to { transform:translateY(0); opacity:1; } }
    </style>
</head>
<body class="min-h-screen">

<!-- Header -->
<div class="bg-white border-b border-slate-100 shadow-sm sticky top-0 z-50">
    <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
        <button onclick="goToApp()" class="text-slate-500 hover:text-slate-700 transition flex items-center gap-1.5 text-sm font-bold">
            <i class="fa-solid fa-arrow-right text-xs"></i> חזרה לאפליקציה
        </button>
        <div class="text-center">
            <div class="font-black text-slate-800 text-base leading-none">🏘️ עולם הקהילות</div>
            <div class="text-[10px] text-slate-400 font-medium">ONE flow LIFE</div>
        </div>
        <div id="user-avatar" class="w-8 h-8 rounded-full bg-orange-100 flex items-center justify-center text-orange-600 font-black text-xs">
            <i class="fa-solid fa-user"></i>
        </div>
    </div>
</div>

<div class="max-w-lg mx-auto px-4 pb-20">

    <!-- Approved banners carousel -->
    <div class="mt-5 mb-6" id="banners-section">
        <div class="flex items-center justify-between mb-3">
            <h2 class="font-black text-slate-800 text-base">✨ מבצעים מיוחדים</h2>
            <span class="text-xs text-slate-400">מאושרים על ידי ONE flow</span>
        </div>
        <div id="banners-loading" class="flex overflow-x-auto banner-scroll gap-3 pb-2">
            <div class="shrink-0 w-72 h-28 bg-slate-100 rounded-2xl animate-pulse"></div>
            <div class="shrink-0 w-72 h-28 bg-slate-100 rounded-2xl animate-pulse"></div>
        </div>
        <div id="banners-container" class="hidden flex overflow-x-auto banner-scroll gap-3 pb-2"></div>
        <div id="banners-empty" class="hidden text-center py-8 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
            <i class="fa-solid fa-store text-3xl text-slate-300 mb-2 block"></i>
            <p class="text-sm text-slate-400 font-bold">אין מבצעים מיוחדים כרגע</p>
            <p class="text-xs text-slate-400 mt-1">עסקים יכולים לבקש קידום מיוחד דרך פאנל הניהול</p>
        </div>
    </div>

    <!-- Quick navigation -->
    <div class="mb-6">
        <h2 class="font-black text-slate-800 text-base mb-3">⚡ גישה מהירה</h2>
        <div class="grid grid-cols-2 gap-3">
            <button onclick="goToTab('join')" class="bg-white border border-slate-200 rounded-2xl p-4 text-right shadow-sm hover:shadow-md hover:border-orange-300 transition active:scale-95">
                <div class="text-2xl mb-2">🔗</div>
                <div class="font-black text-slate-800 text-sm">הקהילות שלי</div>
                <div class="text-xs text-slate-400 mt-0.5">חיבור וניהול קהילות</div>
            </button>
            <button onclick="goToTab('promos')" class="bg-white border border-slate-200 rounded-2xl p-4 text-right shadow-sm hover:shadow-md hover:border-pink-300 transition active:scale-95">
                <div class="text-2xl mb-2">🏷️</div>
                <div class="font-black text-slate-800 text-sm">המבצעים שלי</div>
                <div class="text-xs text-slate-400 mt-0.5">מבצעים מיוחדים לקהילה</div>
            </button>
            <button onclick="goToTab('benefits')" class="bg-white border border-slate-200 rounded-2xl p-4 text-right shadow-sm hover:shadow-md hover:border-teal-300 transition active:scale-95">
                <div class="text-2xl mb-2">🎁</div>
                <div class="font-black text-slate-800 text-sm">ההטבות שלי</div>
                <div class="text-xs text-slate-400 mt-0.5">הטבות עסקיות לחברי הקהילה</div>
            </button>
            <button onclick="goToTab('interests')" class="bg-white border border-slate-200 rounded-2xl p-4 text-right shadow-sm hover:shadow-md hover:border-indigo-300 transition active:scale-95">
                <div class="text-2xl mb-2">🔍</div>
                <div class="font-black text-slate-800 text-sm">חיפוש קהילות</div>
                <div class="text-xs text-slate-400 mt-0.5">מצא קהילות לפי עניין ואזור</div>
            </button>
        </div>
    </div>

    <!-- Pool quick access -->
    <div class="mb-6">
        <button onclick="goToTab('pool')" class="w-full bg-gradient-to-l from-cyan-500 to-blue-600 text-white rounded-2xl p-4 flex items-center gap-4 shadow-md hover:shadow-lg transition active:scale-[.98]">
            <div class="text-3xl">🌊</div>
            <div class="text-right flex-1">
                <div class="font-black text-base">FlowPool</div>
                <div class="text-xs text-blue-100 mt-0.5">קנייה קבוצתית — חסוך יחד עם השכנים</div>
            </div>
            <i class="fa-solid fa-arrow-left text-blue-200"></i>
        </button>
    </div>

    <!-- Divider + news placeholder -->
    <div class="bg-white rounded-2xl border border-slate-100 p-5 shadow-sm">
        <div class="flex items-center gap-3 mb-3">
            <i class="fa-solid fa-newspaper text-slate-300 text-xl"></i>
            <div>
                <div class="font-black text-slate-700 text-sm">חדשות הקהילה</div>
                <div class="text-xs text-slate-400">בקרוב — פרסום הודעות ומאמרים מקהילתיים</div>
            </div>
        </div>
        <div class="bg-slate-50 rounded-xl p-3 text-center border border-dashed border-slate-200">
            <p class="text-xs text-slate-400">המדור ייפתח בקרוב</p>
        </div>
    </div>
</div>

<script>
const API = '/api';
const token = localStorage.getItem('ofl_token');
const savedGroup = (() => { try { return JSON.parse(localStorage.getItem('ofl_current_group')); } catch(e) { return null; } })();

// Auth guard
if (!token || !savedGroup) {
    window.location.href = '/index.html';
}

function goToApp() {
    window.location.href = '/index.html';
}

function goToTab(tab) {
    localStorage.setItem('ofl_open_community_tab', tab);
    window.location.href = '/index.html#community';
}

async function loadApprovedBanners() {
    try {
        const res = await fetch(`${API}/community/approved-banners`, {
            headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        const loading = document.getElementById('banners-loading');
        const container = document.getElementById('banners-container');
        const empty = document.getElementById('banners-empty');
        loading.classList.add('hidden');

        const banners = data.banners || [];
        if (!banners.length) {
            empty.classList.remove('hidden');
            return;
        }

        container.classList.remove('hidden');
        container.innerHTML = banners.map(b => {
            const storeUrl = b.group_code
                ? `/storefront.html?store=${b.group_code}&communityId=${b.community_id}`
                : '#';
            const logoHtml = b.business_logo && !b.business_logo.startsWith('data:')
                ? `<img src="${b.business_logo}" class="w-10 h-10 rounded-xl object-cover border border-white/30 shrink-0">`
                : `<div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-xl shrink-0">🏪</div>`;
            return `<a href="${storeUrl}" class="shrink-0 w-72 block bg-gradient-to-br from-indigo-600 to-purple-700 text-white rounded-2xl p-4 shadow-md hover:shadow-lg transition no-underline fade-in">
                <div class="flex items-center gap-3 mb-2">
                    ${logoHtml}
                    <div class="flex-1 min-w-0">
                        <div class="text-[9px] font-bold text-indigo-200 uppercase tracking-wider truncate">${safeStr(b.community_name)} · ${safeStr(b.business_name)}</div>
                        <div class="font-black text-sm leading-tight mt-0.5 line-clamp-2">${safeStr(b.banner_headline || b.promo_title)}</div>
                    </div>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-[10px] text-indigo-200">לחץ לחנות</span>
                    ${b.discount_pct > 0 ? `<span class="bg-white/20 text-white text-xs font-black px-2 py-0.5 rounded-full">${b.discount_pct}% הנחה</span>` : ''}
                </div>
            </a>`;
        }).join('');
    } catch(e) {
        console.error('Failed loading banners', e);
        document.getElementById('banners-loading').classList.add('hidden');
        document.getElementById('banners-empty').classList.remove('hidden');
    }
}

function safeStr(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadApprovedBanners();
</script>
</body>
</html>
