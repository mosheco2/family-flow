<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>חנות העסק</title>
    
    <link rel="icon" href="/logo.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Heebo', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .modern-input { width: 100%; padding: 1rem; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; transition: all 0.2s; outline: none; font-size: 1rem; color: #1e293b; }
        .modern-input:focus { background: white; border-color: #000; box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: none; } }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .product-card { transition: all 0.3s ease; border: 1px solid transparent; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border-color: #e5e7eb; }
        
        .cat-slider { display: flex; overflow-x: auto; gap: 0.5rem; padding: 0.5rem 1rem; scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none; border-bottom: 1px solid #f3f4f6; }
        .cat-slider::-webkit-scrollbar { display: none; }
        .cat-btn { flex: 0 0 auto; padding: 0.4rem 1.2rem; border-radius: 99px; font-size: 0.85rem; font-weight: 500; background: white; color: #4b5563; border: 1px solid #e5e7eb; transition: all 0.2s; }
        .cat-active { background: #000; color: white; border-color: #000; font-weight: 700; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 pb-32">

    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl hidden z-[999999] flex items-center gap-3 transition-all duration-300 w-max max-w-[90%] font-medium">
        <i id="toast-icon" class="text-lg"></i><span id="toast-message" class="text-sm"></span>
    </div>

    <div id="loading-screen" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-slate-800 mb-4"></i>
        <p class="text-slate-500 font-bold tracking-wide">טוען חנות...</p>
    </div>

    <div id="store-app" class="hidden max-w-xl mx-auto min-h-screen bg-white shadow-2xl relative sm:rounded-2xl sm:my-4 overflow-hidden">
        
        <header class="bg-white border-b border-slate-100 flex flex-col relative w-full pb-4">
            <div id="store-hero-banner" class="w-full h-40 sm:h-48 bg-slate-100 relative overflow-hidden shrink-0">
                <div class="absolute inset-0 bg-gradient-to-r from-slate-200 to-slate-100 flex items-center justify-center text-slate-300">
                    <i class="fa-solid fa-image text-5xl opacity-30"></i>
                </div>
            </div>
            
            <div class="relative px-6 pt-0 text-center sm:text-right flex flex-col sm:flex-row items-center sm:items-start gap-4 sm:gap-6 w-full max-w-4xl mx-auto">
                <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-2xl bg-white shadow-lg p-1.5 flex items-center justify-center relative overflow-hidden -mt-12 z-20 border border-slate-50 shrink-0">
                    <img id="store-logo" src="" class="w-full h-full object-cover rounded-xl hidden">
                    <div id="store-logo-placeholder" class="w-full h-full bg-slate-50 rounded-xl flex items-center justify-center text-slate-300">
                        <i class="fa-solid fa-store text-4xl"></i>
                    </div>
                </div>
                
                <div class="flex-1 flex flex-col items-center sm:items-start pt-2 z-20 w-full">
                    <h1 id="store-name" class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight mb-1">...</h1>
                    <p id="store-slogan" class="text-sm text-slate-500 font-medium mb-3 hidden"></p>
                    
                    <div id="store-contact-info" class="flex flex-wrap items-center justify-center sm:justify-start gap-2 text-xs font-bold hidden w-full">
                        <span id="header-hours" class="hidden bg-slate-50 text-slate-600 px-3 py-1.5 rounded-lg border border-slate-200 flex items-center gap-1.5 shadow-sm"><i class="fa-regular fa-clock text-slate-400"></i> <span id="header-hours-text" dir="ltr"></span></span>
                        <a id="header-wa" href="#" target="_blank" class="hidden bg-[#25D366]/10 text-[#25D366] hover:bg-[#25D366]/20 px-3 py-1.5 rounded-lg border border-[#25D366]/20 flex items-center gap-1.5 transition shadow-sm"><i class="fa-brands fa-whatsapp text-sm"></i> וואטסאפ</a>
                        <a id="header-phone" href="#" class="hidden bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-lg border border-blue-200 flex items-center gap-1.5 transition shadow-sm"><i class="fa-solid fa-phone text-xs"></i> חייג</a>
                    </div>

                    <div id="store-welcome" class="inline-block bg-slate-900 text-white text-xs font-bold px-3 py-1.5 rounded-lg hidden shadow-sm mt-3 w-max mx-auto sm:mx-0"><i class="fa-solid fa-star text-yellow-400 mr-1 text-[10px]"></i> <span id="store-welcome-text"></span></div>
                </div>
            </div>
            
            <div id="store-promotions-banner" class="w-full m-0 p-0 mt-4 border-t border-slate-100"></div>
        </header>

        <div class="glass-header sticky top-0 z-40">
            <div class="p-4 pb-2 flex items-center gap-2">
                <div class="relative flex-1">
                    <i class="fa-solid fa-search absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" onkeyup="handleSearch()" placeholder="חיפוש..." class="w-full bg-slate-100 border-none text-slate-700 text-sm rounded-xl py-3 pr-10 pl-4 outline-none focus:ring-2 focus:ring-slate-900 transition shadow-sm">
                </div>
                <button onclick="toggleViewMode()" id="view-mode-btn" class="w-12 h-12 shrink-0 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center hover:bg-slate-200 transition shadow-sm border border-slate-200" title="החלף תצוגה">
                    <i class="fa-solid fa-list text-lg"></i>
                </button>
            </div>
            <div class="relative w-full px-2 pb-2">
                <button id="scroll-right-btn" onclick="scrollCategories(1)" class="absolute right-0 top-1/2 -translate-y-1/2 z-10 w-7 h-7 flex items-center justify-center bg-white rounded-full shadow-md text-slate-600 hover:text-slate-900 transition hidden md:flex border border-slate-200">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>

                <div class="cat-slider hide-scrollbar px-6" id="categories-container"></div>

                <button id="scroll-left-btn" onclick="scrollCategories(-1)" class="absolute left-0 top-1/2 -translate-y-1/2 z-10 w-7 h-7 flex items-center justify-center bg-white rounded-full shadow-md text-slate-600 hover:text-slate-900 transition hidden md:flex border border-slate-200">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
            </div>
        </div>
        
        <div class="p-4 bg-slate-50 min-h-[50vh]" id="catalog-container"></div>
    </div>

    <div id="cart-footer" class="fixed bottom-0 sm:bottom-4 left-0 right-0 sm:left-1/2 sm:transform sm:-translate-x-1/2 sm:max-w-xl bg-white border-t border-slate-200 p-4 sm:rounded-2xl shadow-[0_-10px_40px_rgba(0,0,0,0.08)] z-40 flex justify-between items-center hidden slide-up">
        <div>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">סה"כ לסל</p>
            <div class="flex items-end gap-2">
                <span id="cart-total" class="font-black text-2xl text-slate-900 leading-none">₪0</span>
                <span id="cart-count" class="text-[10px] font-bold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md mb-1 border border-slate-200">0</span>
            </div>
        </div>
        <button onclick="openCheckoutModal()" class="bg-slate-900 text-white px-8 py-3.5 rounded-xl font-bold hover:bg-black transition active:scale-95 flex items-center gap-2 shadow-lg">
            לתשלום <i class="fa-solid fa-arrow-left text-sm"></i>
        </button>
    </div>

    <div id="product-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-[70] flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div id="product-modal-panel" class="bg-white w-full max-w-md rounded-t-[2rem] sm:rounded-2xl shadow-2xl flex flex-col max-h-[90vh] slide-up overflow-hidden transition-all duration-300">
            <div id="prod-modal-header-img" class="relative w-full h-48 sm:h-56 bg-slate-100 shrink-0 transition-all duration-300">
                <img id="prod-modal-image" src="" class="w-full h-full object-cover hidden">
                <div id="prod-modal-placeholder" class="w-full h-full flex items-center justify-center text-slate-300">
                    <i class="fa-solid fa-image text-5xl"></i>
                </div>
                <button onclick="closeProductModal()" class="absolute top-4 right-4 w-8 h-8 bg-black/50 text-white rounded-full flex items-center justify-center backdrop-blur-md hover:bg-black/70 transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="p-5 flex-1 overflow-y-auto modal-scroll flex flex-col relative">
                <button id="prod-modal-close-alt" onclick="closeProductModal()" class="absolute top-4 left-4 w-8 h-8 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center hover:bg-slate-200 transition hidden z-10"><i class="fa-solid fa-xmark"></i></button>
                <div class="flex justify-between items-start mb-2">
                    <h3 class="text-2xl font-black text-slate-900 leading-tight transition-all" id="prod-modal-name"></h3>
                    <span id="prod-modal-price" class="text-xl font-black text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-100 shrink-0 mr-3"></span>
                </div>
                <p class="text-sm text-slate-500 mb-4 leading-relaxed" id="prod-modal-desc"></p>
                <div id="prod-modal-long-desc" class="text-sm text-slate-700 bg-slate-50 p-4 rounded-xl mb-6 border border-slate-100 whitespace-pre-line hidden"></div>
                
                <div id="mod-options-container" class="space-y-4 mb-4"></div>
            </div>
            
            <div class="p-4 border-t border-slate-100 bg-white shrink-0">
                <div class="flex items-center gap-3">
                    <div class="flex items-center justify-between bg-slate-100 rounded-xl p-1 w-28 shrink-0">
                        <button onclick="updateModalQty(-1)" class="w-8 h-8 rounded-lg bg-white shadow-sm flex items-center justify-center text-slate-600"><i class="fa-solid fa-minus"></i></button>
                        <span id="prod-modal-qty" class="font-bold text-slate-900 text-sm">1</span>
                        <button onclick="updateModalQty(1)" class="w-8 h-8 rounded-lg bg-slate-900 text-white shadow-sm flex items-center justify-center"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <button id="btn-add-with-mod" class="flex-1 bg-slate-900 text-white py-3.5 rounded-xl font-bold shadow-lg hover:bg-black transition flex justify-center items-center gap-2 text-base">
                        <span id="prod-btn-text">הוסף לסל</span> <span id="mod-total-display" class="font-normal text-sm bg-white/20 px-2 py-0.5 rounded ml-1"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="checkout-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-[60] flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-[2rem] sm:rounded-2xl shadow-2xl flex flex-col max-h-[90vh] slide-up overflow-hidden">
            <div class="flex justify-between items-center p-5 border-b border-slate-100 shrink-0">
                <h3 class="text-2xl font-black text-slate-900">העגלה שלך</h3>
                <button onclick="closeCheckoutModal()" class="w-8 h-8 bg-slate-100 rounded-full text-slate-500 flex items-center justify-center hover:bg-slate-200 transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto modal-scroll p-5">
                <div id="checkout-items" class="space-y-3 mb-6"></div>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-bold text-slate-600">סיכום ביניים:</span>
                        <span id="checkout-total" class="text-xl font-black text-slate-900">₪0</span>
                    </div>
                    <p id="checkout-min-warning" class="text-[10px] font-bold text-red-500 text-right hidden mt-2 bg-red-50 p-1.5 rounded-lg border border-red-100"><i class="fa-solid fa-circle-exclamation"></i> מינימום להזמנה: ₪<span id="min-order-val"></span></p>
                </div>

                <form id="checkout-form" class="space-y-4">
                    <div class="flex bg-slate-100 p-1 rounded-xl">
                        <button type="button" id="btn-delivery-false" onclick="toggleDelivery(false)" class="flex-1 py-2 text-sm font-bold bg-white text-slate-800 rounded-lg shadow-sm transition">איסוף עצמי</button>
                        <button type="button" id="btn-delivery-true" onclick="toggleDelivery(true)" class="flex-1 py-2 text-sm font-bold text-slate-500 hover:text-slate-700 rounded-lg transition">משלוח עד הבית</button>
                    </div>
                    <input type="hidden" id="is-delivery" value="false">

                    <div class="grid grid-cols-2 gap-2">
                        <div class="flex flex-col gap-1">
                            <label class="text-[10px] font-bold text-slate-400 mr-1">שם מלא</label>
                            <input type="text" id="cust-name" required class="modern-input py-2.5 text-sm bg-white border-slate-200" placeholder="ישראל ישראלי">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-[10px] font-bold text-slate-400 mr-1">טלפון</label>
                            <input type="tel" id="cust-phone" required class="modern-input py-2.5 text-sm text-left dir-ltr bg-white border-slate-200" placeholder="050-0000000">
                        </div>
                    </div>
                    
                    <div id="delivery-fields" class="hidden space-y-3 p-4 bg-indigo-50/50 rounded-2xl border border-indigo-100 shadow-inner fade-in">
                        <h4 class="font-bold text-sm text-indigo-900 mb-1"><i class="fa-solid fa-motorcycle text-indigo-500 mr-1"></i> כתובת למשלוח</h4>
                        <input type="text" id="cust-city" class="modern-input py-2 text-sm bg-white border-indigo-100" placeholder="עיר / יישוב">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="cust-street" class="modern-input py-2 text-sm bg-white border-indigo-100" placeholder="רחוב">
                            <input type="text" id="cust-house" class="modern-input py-2 text-sm bg-white border-indigo-100" placeholder="מספר בית">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="cust-floor" class="modern-input py-2 text-sm bg-white border-indigo-100" placeholder="קומה">
                            <input type="text" id="cust-apt" class="modern-input py-2 text-sm bg-white border-indigo-100" placeholder="דירה">
                        </div>
                        <textarea id="cust-notes" class="modern-input py-2 text-sm bg-white border-indigo-100 h-16" placeholder="הערות לשליח..."></textarea>
                    </div>
                </form>
            </div>

            <div class="p-5 border-t border-slate-100 bg-white shrink-0">
                <button type="button" onclick="submitOrder(event)" id="btn-submit-order" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-xl text-lg hover:bg-black transition active:scale-95 flex justify-center items-center gap-2">
                    <span>סיום ושליחת הזמנה</span> <span id="final-submit-price" class="text-sm font-medium bg-white/20 px-2 py-0.5 rounded"></span> <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="success-screen" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center p-6 text-center hidden slide-up">
        <div class="w-24 h-24 bg-green-50 text-green-500 rounded-full flex items-center justify-center text-5xl mb-6 shadow-inner border border-green-100"><i class="fa-solid fa-check"></i></div>
        <h2 class="text-3xl font-black text-slate-900 mb-2">תודה רבה! 🎉</h2>
        <p class="text-slate-500 font-medium mb-8">ההזמנה התקבלה ותטופל בהקדם.</p>
        <div class="bg-slate-50 p-6 rounded-2xl w-full max-w-xs border border-slate-200 shadow-sm mb-8">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">מספר הזמנה</p>
            <p id="success-order-id" class="text-3xl font-black text-slate-900 font-mono tracking-wider">#0000</p>
        </div>
        <button onclick="window.location.reload()" class="text-slate-900 text-sm font-bold bg-slate-100 px-6 py-2.5 rounded-full hover:bg-slate-200 transition">חזרה לחנות</button>
    </div>

    <script>
        const API = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';
        let storeData = null;
        let cart = {}; 
        let currentCategory = 'all';
        let searchQuery = '';
        let currentModifierProduct = null;
        let currentModifierBasePrice = 0;
        
        let isCurrentProductPizza = false;
        let currentPizzaToppings = [];
        let pizzaState = {};
        let activePizzaTopping = null;
        
        let catalogViewMode = 'grid';

        const getEl = id => document.getElementById(id);
        const val = id => getEl(id) ? getEl(id).value : '';
        const safeStr = str => (str || '').toString().replace(/'/g, "\\'").replace(/"/g, "&quot;");
        const isTrue = val => val === true || val === 'true' || val === 1 || val === '1' || val === 't';

        function showToast(t, m) { 
            const el = getEl('toast'); 
            el.classList.remove('hidden'); 
            getEl('toast-message').innerText = m; 
            getEl('toast-icon').className = t === 'success' ? 'fa-solid fa-check text-green-400' : 'fa-solid fa-xmark text-red-400'; 
            setTimeout(() => el.classList.add('hidden'), 3000); 
        }

        const colorMap = {
            'pink': 'from-pink-500 to-rose-500',
            'blue': 'from-blue-500 to-cyan-500',
            'emerald': 'from-emerald-500 to-teal-500',
            'orange': 'from-orange-400 to-amber-500',
            'purple': 'from-purple-500 to-indigo-500',
            'slate': 'from-slate-700 to-slate-900'
        };

        async function initStore() {
            const urlParams = new URLSearchParams(window.location.search);
            const storeCode = urlParams.get('store');
            const communityId = urlParams.get('communityId');
            
            if (!storeCode) {
                getEl('loading-screen').classList.add('hidden');
                return document.body.innerHTML = "<h1 class='text-center mt-20 text-xl font-bold'>קישור שגוי</h1>";
            }

            try {
                let fetchUrl = `${API}/storefront/${storeCode}`;
                if (communityId) fetchUrl += `?communityId=${communityId}`;
                
                const res = await fetch(fetchUrl);
                const data = await res.json();
                
                const isActive = data.settings && isTrue(data.settings.is_active);
                if (!data.success || !isActive) {
                    getEl('loading-screen').classList.add('hidden');
                    return document.body.innerHTML = "<div class='text-center mt-32'><i class='fa-solid fa-store-slash text-5xl text-slate-300 mb-4'></i><h1 class='text-xl font-bold text-slate-700'>החנות סגורה כרגע</h1></div>";
                }

                if (data.communityData) {
                    const discount = parseFloat(data.communityData.discount_pct) || 0;
                    if (data.catalog && discount > 0) {
                        data.catalog.forEach(item => {
                            item.original_price = parseFloat(item.price);
                            item.price = (item.original_price * (1 - (discount / 100))).toFixed(2);
                            if (item.price.endsWith('.00')) item.price = item.price.replace('.00', '');
                            item.is_community_discount = true;
                        });
                    }
                    
                    const heroHeader = document.querySelector('header');
                    if (heroHeader) {
                        heroHeader.insertAdjacentHTML('afterbegin', `
                            <div class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white py-3 px-4 shadow-lg flex justify-between items-center w-full" dir="rtl">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm shadow-inner shrink-0"><i class="fa-solid fa-house-flag text-xl"></i></div>
                                    <div class="flex flex-col justify-center text-right">
                                        <p class="font-bold text-sm leading-tight tracking-wide">קהילת ${safeStr(data.communityData.name)}</p>
                                        <div class="text-[10px] opacity-90 font-medium bg-emerald-700/50 px-1.5 py-0.5 rounded inline-flex items-center gap-1 w-fit mt-0.5"><span>הנחת קהילה פעילה:</span><span class="font-black" dir="ltr">${discount}%</span></div>
                                    </div>
                                </div>
                            </div>
                        `);
                    }
                }

                storeData = data;
                let gId = data.groupId || (data.group && data.group.id) || (data.settings && data.settings.group_id);
                if (!gId && data.catalog && data.catalog.length > 0) gId = data.catalog[0].group_id;
                storeData.groupId = gId;
                
                try {
                    if (storeData.groupId) {
                        const promoRes = await fetch(`${API}/store/promotions/${storeData.groupId}`);
                        const promoData = await promoRes.json();
                        if (promoData.success && promoData.promotions) {
                            storeData.promotions = promoData.promotions.filter(p => isTrue(p.is_active));
                        }
                    }
                } catch(e) { console.warn("Failed loading promotions", e); }

                renderHeader();
                extractCategories();
                renderPromotionsBanner();
                renderCatalog();

                getEl('loading-screen').classList.add('hidden');
                getEl('store-app').classList.remove('hidden');
                
            } catch (err) {
                console.error("Critical store init error", err);
                getEl('loading-screen').classList.add('hidden');
                showToast('error', 'שגיאה בטעינת החנות');
            }
        }
        
        function renderPromotionsBanner() {
            const bannerContainer = getEl('store-promotions-banner');
            if (!bannerContainer) return;
            
            const bannerPromos = storeData.promotions ? storeData.promotions.filter(p => isTrue(p.show_in_banner)) : [];
            if (bannerPromos.length === 0) { bannerContainer.innerHTML = ''; return; }
            
            let promoHtml = `<div class="flex overflow-x-auto w-full modal-scroll snap-x snap-mandatory">`;
            bannerPromos.forEach(p => {
                let desc = p.promo_type === 'bogo' ? '1+1 מתנה!' : (p.promo_type === 'discount_pct' ? `${p.promo_value}% הנחה` : `ב-₪${p.promo_value} בלבד`);
                let targetArray = [];
                if(Array.isArray(p.target_ids)) targetArray = p.target_ids;
                else if(typeof p.target_ids === 'string') { try { targetArray = JSON.parse(p.target_ids); } catch(e){} }
                let targetDesc = p.target_type === 'all' ? 'על כל החנות' : `תקף על: ${(targetArray || []).join(', ')}`;
                
                const bgClass = colorMap[p.bg_color] || colorMap['pink'];

                promoHtml += `
                <div class="bg-gradient-to-r ${bgClass} text-white py-5 px-6 min-w-full w-full shrink-0 snap-center relative overflow-hidden flex flex-col justify-center text-right shadow-inner border-b border-black/10">
                    <i class="fa-solid fa-gift absolute -left-4 -bottom-6 text-9xl opacity-20 transform -rotate-12"></i>
                    <h4 class="font-black text-2xl relative z-10 leading-tight mb-2 drop-shadow-md">${safeStr(p.title)}</h4>
                    <div class="relative z-10 flex items-center gap-2">
                        <span class="text-sm font-bold bg-white/20 px-3 py-1 rounded-lg backdrop-blur-sm border border-white/30 shadow-sm">${desc}</span>
                        <span class="text-xs font-medium opacity-90">${targetDesc}</span>
                    </div>
                </div>`;
            });
            promoHtml += `</div>`;
            bannerContainer.innerHTML = promoHtml;
        }

        function renderHeader() {
            getEl('store-name').innerText = storeData.groupName; document.title = `${storeData.groupName} | חנות`;
            if(storeData.settings.logo_url) { getEl('store-logo').src = storeData.settings.logo_url; getEl('store-logo').classList.remove('hidden'); getEl('store-logo-placeholder').classList.add('hidden'); }
            if(storeData.settings.slogan) { getEl('store-slogan').innerText = storeData.settings.slogan; getEl('store-slogan').classList.remove('hidden'); }
            if(storeData.settings.welcome_message) { getEl('store-welcome-text').innerText = storeData.settings.welcome_message; getEl('store-welcome').classList.remove('hidden'); }
            
            if(storeData.settings.banner_url) {
                const bannerEl = getEl('store-hero-banner');
                if (bannerEl) {
                    bannerEl.innerHTML = `<img src="${storeData.settings.banner_url}" class="w-full h-full object-cover">`;
                }
            }
            
            let showContactRow = false;
            if(storeData.settings.open_time && storeData.settings.close_time) {
                getEl('header-hours-text').innerText = `${storeData.settings.open_time} - ${storeData.settings.close_time}`;
                getEl('header-hours').classList.remove('hidden');
                showContactRow = true;
            }
            if(storeData.settings.whatsapp_number) {
                getEl('header-wa').href = `https://wa.me/${storeData.settings.whatsapp_number.replace(/\D/g,'')}`;
                getEl('header-wa').classList.remove('hidden');
                showContactRow = true;
            }
            if(storeData.settings.phone) {
                getEl('header-phone').href = `tel:${storeData.settings.phone.replace(/\D/g,'')}`;
                getEl('header-phone').classList.remove('hidden');
                showContactRow = true;
            }
            if(showContactRow) getEl('store-contact-info').classList.remove('hidden');
        }

        function extractCategories() {
            const container = getEl('categories-container'); if (!storeData.catalog) return;
            const categories = new Set(); storeData.catalog.forEach(item => { if(item.category) categories.add(item.category.trim()); });
            
            let html = '';
            const tabPromos = storeData.promotions ? storeData.promotions.filter(p => isTrue(p.show_in_tab)) : [];
            if (tabPromos.length > 0) {
                html += `<button onclick="filterCategory('promotions')" id="cat-btn-promotions" class="cat-btn shadow-sm bg-pink-50 text-pink-700 border-pink-200 font-bold"><i class="fa-solid fa-gift mr-1"></i> מבצעים</button>`;
            }
            
            html += `<button onclick="filterCategory('all')" id="cat-btn-all" class="cat-btn cat-active">הכל</button>`;
            categories.forEach(cat => { html += `<button onclick="filterCategory('${safeStr(cat)}')" id="cat-btn-${safeStr(cat)}" class="cat-btn shadow-sm">${safeStr(cat)}</button>`; });
            container.innerHTML = html;
        }

        function filterCategory(cat) {
            currentCategory = cat; document.querySelectorAll('.cat-btn').forEach(btn => { btn.classList.remove('cat-active'); btn.classList.add('shadow-sm'); btn.classList.remove('bg-slate-900', 'text-white'); });
            const activeBtn = getEl(cat === 'all' ? 'cat-btn-all' : `cat-btn-${cat}`);
            if(activeBtn) { activeBtn.classList.add('cat-active'); activeBtn.classList.remove('shadow-sm'); }
            if(cat === 'promotions' && activeBtn) { activeBtn.classList.add('bg-slate-900', 'text-white'); activeBtn.classList.remove('bg-pink-50', 'text-pink-700', 'border-pink-200'); }
            renderCatalog();
        }

        function handleSearch() { searchQuery = val('search-input').toLowerCase(); renderCatalog(); }

        window.toggleViewMode = function() {
            catalogViewMode = catalogViewMode === 'grid' ? 'list' : 'grid';
            const btn = getEl('view-mode-btn');
            if (btn) {
                btn.innerHTML = catalogViewMode === 'grid' 
                    ? '<i class="fa-solid fa-list text-lg"></i>' 
                    : '<i class="fa-solid fa-border-all text-lg"></i>';
            }
            renderCatalog();
        };

        function renderCatalog() {
            const container = getEl('catalog-container');
            
            if (currentCategory === 'promotions') {
                const tabPromos = storeData.promotions ? storeData.promotions.filter(p => isTrue(p.show_in_tab)) : [];
                if (tabPromos.length === 0) {
                    container.innerHTML = '<p class="text-center text-slate-400 py-12">אין מבצעים זמינים כרגע.</p>';
                    return;
                }
                
                let html = '<div class="flex flex-col gap-4">';
                tabPromos.forEach(p => {
                    let desc = p.promo_type === 'bogo' ? '1+1 מתנה!' : (p.promo_type === 'discount_pct' ? `${p.promo_value}% הנחה` : `ב-₪${p.promo_value} בלבד`);
                    let targetArray = [];
                    if(Array.isArray(p.target_ids)) targetArray = p.target_ids;
                    else if(typeof p.target_ids === 'string') { try { targetArray = JSON.parse(p.target_ids); } catch(e){} }
                    let targetDesc = p.target_type === 'all' ? 'חל על כל מוצרי החנות' : `תקף על קטגוריה: ${(targetArray || []).join(', ')}`;
                    const bgClass = colorMap[p.bg_color] || colorMap['pink'];
                    
                    html += `
                    <div class="bg-gradient-to-r ${bgClass} text-white p-5 rounded-2xl shadow-md relative overflow-hidden flex flex-col justify-between border border-white/20 fade-in">
                        <i class="fa-solid fa-tags absolute -left-2 -top-2 text-7xl opacity-20 transform -rotate-12"></i>
                        <div>
                            <h4 class="font-bold text-xl relative z-10 leading-tight mb-2 drop-shadow-sm">${safeStr(p.title)}</h4>
                            <div class="relative z-10 flex flex-col items-start gap-2">
                                <span class="text-sm font-bold bg-white/20 px-3 py-1 rounded-lg backdrop-blur-sm border border-white/30 text-white shadow-sm">${desc}</span>
                                <span class="text-xs font-medium opacity-90">${targetDesc}</span>
                            </div>
                        </div>
                    </div>`;
                });
                container.innerHTML = html + '</div>';
                return;
            }

            if (!storeData.catalog || storeData.catalog.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 py-12">אין מוצרים זמינים.</p>';
                return;
            }

            let filtered = storeData.catalog;
            if (currentCategory !== 'all') filtered = filtered.filter(item => item.category === currentCategory);
            if (searchQuery.trim() !== '') filtered = filtered.filter(item => item.name.toLowerCase().includes(searchQuery));

            const activePromos = storeData.promotions ? storeData.promotions.filter(p => isTrue(p.is_active)) : [];

            let html = catalogViewMode === 'grid' ? '<div class="grid grid-cols-2 sm:grid-cols-3 gap-4">' : '<div class="flex flex-col gap-4">';

            filtered.forEach(item => {
                let badgeHtml = '';
                let appliedPromo = null;
                
                for (let promo of activePromos) {
                    if (promo.target_type === 'all') { appliedPromo = promo; break; }
                    if (promo.target_type === 'category') {
                        let targetArray = [];
                        if(Array.isArray(promo.target_ids)) targetArray = promo.target_ids;
                        else if(typeof promo.target_ids === 'string') { try { targetArray = JSON.parse(promo.target_ids); } catch(e){} }
                        if (targetArray.includes(item.category)) { appliedPromo = promo; break; }
                    }
                }

                if (appliedPromo) {
                    let promoText = appliedPromo.promo_type === 'bogo' ? '1+1 מתנה' : (appliedPromo.promo_type === 'discount_pct' ? `${appliedPromo.promo_value}% הנחה` : `ב-₪${appliedPromo.promo_value}`);
                    badgeHtml += `<div class="absolute top-2 left-2 bg-gradient-to-r from-pink-500 to-rose-500 text-white text-[10px] font-black px-2.5 py-1 rounded-full shadow-md z-10 border border-white/50 backdrop-blur-sm"><i class="fa-solid fa-gift mr-1 text-[9px]"></i> מבצע: ${promoText}</div>`;
                }

                if (item.badge_text) {
                    const colors = { 'red':'bg-red-500', 'green':'bg-green-500', 'blue':'bg-blue-500', 'yellow':'bg-yellow-500 text-yellow-900' };
                    const bgClass = colors[item.badge_color] || 'bg-red-500';
                    badgeHtml += `<div class="absolute top-2 right-2 ${bgClass} text-white text-[10px] font-black px-2.5 py-1 rounded-full shadow-md z-10 border border-white/50 backdrop-blur-sm">${safeStr(item.badge_text)}</div>`;
                }
                
                const imgClasses = catalogViewMode === 'grid' ? 'w-full h-32 sm:h-40 mb-3 relative shrink-0' : 'w-24 h-24 relative shrink-0';
                const imgInner = item.image_url ? `<img src="${item.image_url}" class="w-full h-full object-cover rounded-xl shadow-sm">` : `<div class="w-full h-full bg-slate-100 text-slate-300 rounded-xl flex items-center justify-center shadow-sm"><i class="fa-solid fa-image text-3xl"></i></div>`;
                const imgHtml = `<div class="${imgClasses}">${badgeHtml}${imgInner}</div>`;
                
                let priceHtml = '';
                const orig = parseFloat(item.original_price);
                const curr = parseFloat(item.price);
                
                if (orig && orig > curr) {
                    priceHtml = `
                        <div class="flex flex-col">
                            <span class="text-[9px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-bold w-fit mb-1 border border-emerald-200">מחיר קהילה ✨</span>
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-slate-400 line-through">₪${orig}</span>
                                <span class="font-black text-emerald-600 text-base">₪${curr}</span>
                            </div>
                        </div>`;
                } else {
                    priceHtml = `<span class="font-black text-slate-900 text-sm">₪${curr}</span>`;
                }

                const pType = item.product_type || 'retail';
                const btnText = pType === 'pizza_builder' ? 'הרכב פיצה' : (pType === 'service' ? 'הזמן שירות' : (pType === 'food' ? 'בחר מנה' : 'פרטים והוספה'));
                const actionHtml = `<button onclick="openProductModal(${item.id}); event.stopPropagation();" class="bg-slate-100 text-slate-800 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold transition w-full border border-slate-200 shadow-sm">${btnText}</button>`;

                if (catalogViewMode === 'grid') {
                    html += `<div onclick="openProductModal(${item.id})" class="bg-white rounded-2xl p-3 border border-slate-100 product-card shadow-sm flex flex-col fade-in cursor-pointer">${imgHtml}<h3 class="font-bold text-sm text-slate-900 leading-tight mb-1">${safeStr(item.name)}</h3><p class="text-[10px] text-slate-500 line-clamp-2 mb-3 flex-1">${safeStr(item.description || '')}</p><div class="mb-2">${priceHtml}</div>${actionHtml}</div>`;
                } else {
                    html += `<div onclick="openProductModal(${item.id})" class="bg-white p-3.5 rounded-2xl border border-slate-100 product-card shadow-sm flex gap-4 fade-in cursor-pointer">${imgHtml}<div class="flex-1 flex flex-col justify-between"><div><h3 class="font-bold text-slate-900 text-[15px] leading-tight">${safeStr(item.name)}</h3><p class="text-[11px] text-slate-500 mt-1 leading-snug line-clamp-2">${safeStr(item.description || '')}</p></div><div class="flex justify-between items-end mt-2"><div class="flex items-center">${priceHtml}</div><div class="w-24">${actionHtml}</div></div></div></div>`;
                }
            });
            container.innerHTML = html + '</div>';
        }

        function calculateModTotal() {
            let totalOptions = 0;
            
            if (isCurrentProductPizza) {
                currentPizzaToppings.forEach(t => {
                    if (pizzaState[t.name]) {
                        const activeQuarters = pizzaState[t.name].reduce((sum, val) => sum + Number(val || 0), 0);
                        totalOptions += (parseFloat(t.price) / 4) * activeQuarters;
                    }
                });
            } else {
                document.querySelectorAll('.mod-checkbox, .mod-radio').forEach(input => {
                    if (input.checked) totalOptions += parseFloat(input.dataset.price) || 0;
                });
            }
            
            const grandTotal = (currentModifierBasePrice + totalOptions) * currentModalQty;
            const displayEl = getEl('mod-total-display');
            if (displayEl) displayEl.innerText = `(₪${grandTotal.toFixed(2)})`;
        }

        function updateModalQty(delta) {
            currentModalQty += delta;
            if(currentModalQty < 1) currentModalQty = 1;
            getEl('prod-modal-qty').innerText = currentModalQty;
            calculateModTotal();
        }

        function openProductModal(itemId) {
            const item = storeData.catalog.find(i => i.id === itemId); if(!item) return;
            currentModifierProduct = item; 
            currentModifierBasePrice = parseFloat(item.price) || 0;
            currentModalQty = 1;
            
            getEl('prod-modal-name').innerText = item.name; 
            getEl('prod-modal-price').innerText = `₪${item.price}`;
            getEl('prod-modal-desc').innerText = item.description || '';
            getEl('prod-modal-qty').innerText = currentModalQty;

            const longDesc = getEl('prod-modal-long-desc');
            if (item.long_description) { longDesc.innerText = item.long_description; longDesc.classList.remove('hidden'); } 
            else { longDesc.classList.add('hidden'); }

            const imgPreview = getEl('prod-modal-image');
            const placeholder = getEl('prod-modal-placeholder');
            if (item.image_url) { imgPreview.src = item.image_url; imgPreview.classList.remove('hidden'); placeholder.classList.add('hidden'); } 
            else { imgPreview.classList.add('hidden'); placeholder.classList.remove('hidden'); }

            const pType = item.product_type || 'retail';
            getEl('prod-btn-text').innerText = pType === 'bundle' ? 'הוסף מארז לסל' : (pType === 'pizza_builder' ? 'הוסף מגש לסל' : 'הוסף לסל');

            let options = [];
            try { options = JSON.parse(item.options_text); } catch(e) { options = []; }
            
            let html = '';
            isCurrentProductPizza = false;

            const panel = getEl('product-modal-panel');
            const headerImg = getEl('prod-modal-header-img');
            const altClose = getEl('prod-modal-close-alt');
            
            if (pType === 'pizza_builder' && options.isPizza) {
                panel.classList.remove('max-w-md');
                panel.classList.add('max-w-lg'); 
                headerImg.classList.add('hidden'); 
                altClose.classList.remove('hidden'); 
                getEl('prod-modal-name').classList.add('pl-8'); 
            } else {
                panel.classList.add('max-w-md');
                panel.classList.remove('max-w-lg');
                headerImg.classList.remove('hidden');
                altClose.classList.add('hidden');
                getEl('prod-modal-name').classList.remove('pl-8');
            }

            if (pType === 'bundle' && options.isBundle) {
                options.steps.forEach((step, sIdx) => {
                    const stepQty = step.qty || 1;
                    html += `<div class="mb-6 bg-indigo-50/50 p-4 rounded-2xl border border-indigo-100 shadow-sm">
                                <h4 class="font-bold text-indigo-900 text-sm mb-3 flex justify-between">
                                    <span>${safeStr(step.name)}</span>
                                    <span class="text-[10px] bg-white px-2 py-0.5 rounded-full border border-indigo-200">בחר/י ${stepQty}</span>
                                </h4>
                                <div class="grid grid-cols-1 gap-2">`;
                    
                    let itemsInStep = [];
                    if (step.selectionType === 'category') {
                        itemsInStep = storeData.catalog.filter(p => p.category === step.category && p.product_type !== 'bundle' && p.product_type !== 'pizza_builder');
                    } else {
                        itemsInStep = storeData.catalog.filter(p => (step.items || []).includes(p.id));
                    }

                    itemsInStep.forEach(subItem => {
                        html += `
                        <label class="flex items-center justify-between p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:border-indigo-500 transition group relative overflow-hidden">
                            <div class="flex items-center gap-3">
                                <input type="${stepQty === 1 ? 'radio' : 'checkbox'}" name="bundle_step_${sIdx}" value="${safeStr(subItem.name)}" data-id="${subItem.id}" class="bundle-input w-5 h-5 accent-indigo-600" onchange="checkBundleSelection(${sIdx}, ${stepQty}, this)">
                                <div class="flex flex-col">
                                    <span class="text-sm font-bold text-slate-700">${safeStr(subItem.name)}</span>
                                    <span class="text-[10px] text-slate-400">${safeStr(subItem.description || '')}</span>
                                </div>
                            </div>
                        </label>`;
                    });
                    html += `</div></div>`;
                });
            } 
            else if (pType === 'pizza_builder' && options.isPizza) {
                isCurrentProductPizza = true;
                currentPizzaToppings = options.toppings || [];
                pizzaState = {};
                currentPizzaToppings.forEach(t => pizzaState[t.name] = [0, 0, 0, 0]);
                activePizzaTopping = currentPizzaToppings.length > 0 ? currentPizzaToppings[0].name : null;
                
                html = `<div id="pizza-builder-wrapper"></div>`;
            }
            else {
                const mods = Array.isArray(options) ? options : [];
                mods.forEach((optGroup, idx) => {
                    const isSingle = optGroup.type === 'single';
                    html += `<div class="mb-4 bg-slate-50 p-4 rounded-xl border border-slate-100"><h4 class="font-bold text-slate-800 text-sm mb-3">${safeStr(optGroup.name)}</h4><div class="space-y-2">`;
                    optGroup.options.forEach((valOpt, vIdx) => {
                        const priceBadge = valOpt.price > 0 ? `<span class="text-xs font-bold text-emerald-600">+₪${valOpt.price}</span>` : '';
                        html += `
                        <label class="flex items-center justify-between p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:border-slate-900 transition group">
                            <div class="flex items-center gap-3">
                                <input type="${isSingle ? 'radio' : 'checkbox'}" name="mod_group_${idx}" value="${safeStr(valOpt.name)}" data-price="${valOpt.price}" class="${isSingle ? 'mod-radio' : 'mod-checkbox'} w-5 h-5 accent-slate-900" onchange="calculateModTotal()">
                                <span class="text-sm font-medium text-slate-700">${safeStr(valOpt.name)}</span>
                            </div>
                            ${priceBadge}
                        </label>`;
                    });
                    html += `</div></div>`;
                });
            }

            getEl('mod-options-container').innerHTML = html;
            
            if (isCurrentProductPizza) {
                window.renderPizzaBuilderUI();
            }

            calculateModTotal();
            
            getEl('btn-add-with-mod').onclick = () => {
                let selections = [];
                let totalPrice = currentModifierBasePrice;

                if (pType === 'bundle' && options.isBundle) {
                    let isValid = true;
                    options.steps.forEach((step, sIdx) => {
                        const checked = document.querySelectorAll(`input[name="bundle_step_${sIdx}"]:checked`);
                        if (checked.length !== step.qty) {
                            showToast('error', `בשלב "${step.name}" חובה לבחור בדיוק ${step.qty} פריטים`);
                            isValid = false;
                        }
                        checked.forEach(c => selections.push(c.value));
                    });
                    if (!isValid) return;
                } else if (isCurrentProductPizza) {
                    currentPizzaToppings.forEach(t => {
                        const activeQuarters = pizzaState[t.name].reduce((sum, val) => sum + Number(val || 0), 0);
                        if (activeQuarters > 0) {
                            totalPrice += (parseFloat(t.price) / 4) * activeQuarters;
                            
                            let activeQ1 = [];
                            let activeQ2 = [];
                            pizzaState[t.name].forEach((val, idx) => {
                                if (val === 1) activeQ1.push(idx + 1);
                                if (val === 2) activeQ2.push(idx + 1);
                            });
                            
                            let parts = [];
                            if (activeQ1.length > 0) {
                                if (activeQ1.length === 4) parts.push('מגש שלם');
                                else parts.push(`ברבעים ${activeQ1.join(', ')}`);
                            }
                            if (activeQ2.length > 0) {
                                if (activeQ2.length === 4) parts.push('כפול על הכל');
                                else parts.push(`כפול ברבעים ${activeQ2.join(', ')}`);
                            }
                            
                            selections.push(`${t.name} (${parts.join(' | ')})`);
                        }
                    });
                } else {
                    const mods = Array.isArray(options) ? options : [];
                    mods.forEach((g, i) => {
                        const checked = document.querySelectorAll(`input[name="mod_group_${i}"]:checked`);
                        checked.forEach(c => {
                            selections.push(c.value);
                            totalPrice += parseFloat(c.dataset.price) || 0;
                        });
                    });
                }
                
                const finalName = selections.length > 0 ? `${item.name} (${selections.join(', ')})` : item.name;
                updateCart(`${item.id}_${selections.join('-')}`, currentModalQty, finalName, totalPrice, item.id);
                closeProductModal(); 
                showToast('success', 'התווסף לסל! 🛒');
            };
            
            getEl('product-modal').classList.remove('hidden');
        }

        window.checkBundleSelection = function(stepIdx, max, input) {
            const checked = document.querySelectorAll(`input[name="bundle_step_${stepIdx}"]:checked`);
            if (checked.length > max) {
                input.checked = false;
                showToast('info', `ניתן לבחור עד ${max} פריטים בשלב זה`);
            }
        };

        window.renderPizzaBuilderUI = function() {
            const wrapper = getEl('pizza-builder-wrapper');
            if(!wrapper) return;
            
            const getFill = (qIdx) => {
                if(!activePizzaTopping || !pizzaState[activePizzaTopping]) return 'transparent';
                const val = pizzaState[activePizzaTopping][qIdx];
                if (val === 2) return '#ef4444'; 
                if (val === 1) return '#fca5a5'; 
                return 'transparent';
            };

            const getX2Text = (qIdx, x, y) => {
                if(!activePizzaTopping || !pizzaState[activePizzaTopping]) return '';
                if(pizzaState[activePizzaTopping][qIdx] === 2) {
                    return `<text x="${x}" y="${y}" font-size="10" font-weight="900" fill="#ffffff" class="pointer-events-none" text-anchor="middle">X2</text>`;
                }
                return '';
            };
            
            let toppingsHtml = currentPizzaToppings.map(t => `
                <button type="button" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap shadow-sm transition border ${t.name === activePizzaTopping ? 'bg-red-600 text-white border-red-700' : 'bg-white text-slate-700 border-slate-200 hover:bg-red-50'}" onclick="window.selectPizzaTopping('${safeStr(t.name)}')">
                    ${safeStr(t.name)} (+₪${t.price})
                </button>
            `).join('');

            let summaryArr = [];
            currentPizzaToppings.forEach(t => {
                const activeQuarters = pizzaState[t.name].reduce((sum, val) => sum + Number(val || 0), 0);
                if (activeQuarters > 0) {
                    let activeQ1 = [];
                    let activeQ2 = [];
                    pizzaState[t.name].forEach((val, idx) => {
                        if (val === 1) activeQ1.push(idx + 1);
                        if (val === 2) activeQ2.push(idx + 1);
                    });
                    
                    let parts = [];
                    if (activeQ1.length > 0) {
                        if (activeQ1.length === 4) parts.push('מגש שלם');
                        else parts.push(`רבעים ${activeQ1.join(', ')}`);
                    }
                    if (activeQ2.length > 0) {
                        if (activeQ2.length === 4) parts.push('כפול על הכל');
                        else parts.push(`כפול רבעים ${activeQ2.join(', ')}`);
                    }
                    
                    summaryArr.push(`<span class="bg-red-100 text-red-700 px-2 py-1 rounded-md text-[10px] font-bold m-1 inline-block">${t.name} - ${parts.join(' | ')}</span>`);
                }
            });
            const summaryHtml = summaryArr.length > 0 ? summaryArr.join('') : '<p class="text-[10px] text-slate-400">פיצה חלקה (ללא תוספות)</p>';

            wrapper.innerHTML = `
            <div class="bg-red-50/50 rounded-2xl p-4 border border-red-100 shadow-sm mb-4 fade-in">
                <h4 class="font-bold text-red-900 text-center mb-1 text-sm"><i class="fa-solid fa-pizza-slice text-red-500 mr-1"></i> הרכבת מגש פיצה</h4>
                <p class="text-[10px] text-red-600 text-center mb-4">בחרו תוספת מהסרגל, ולחצו על חלקי הפיצה. <br><span class="font-bold">לחיצה כפולה תשים כמות כפולה (X2).</span></p>
                
                <div class="flex overflow-x-auto gap-2 mb-6 pb-2 modal-scroll hide-scrollbar" style="scroll-snap-type: x mandatory;">
                    ${toppingsHtml}
                </div>

                <div class="relative w-52 h-52 mx-auto mb-6">
                    <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-lg">
                        <circle cx="50" cy="50" r="48" fill="#fef08a" stroke="#f59e0b" stroke-width="2"/>
                        <path d="M 50 50 L 50 2 A 48 48 0 0 1 98 50 Z" fill="${getFill(0)}" class="cursor-pointer transition hover:fill-red-200" onclick="window.togglePizzaSlice(0)" />
                        <path d="M 50 50 L 98 50 A 48 48 0 0 1 50 98 Z" fill="${getFill(1)}" class="cursor-pointer transition hover:fill-red-200" onclick="window.togglePizzaSlice(1)" />
                        <path d="M 50 50 L 50 98 A 48 48 0 0 1 2 50 Z" fill="${getFill(2)}" class="cursor-pointer transition hover:fill-red-200" onclick="window.togglePizzaSlice(2)" />
                        <path d="M 50 50 L 2 50 A 48 48 0 0 1 50 2 Z" fill="${getFill(3)}" class="cursor-pointer transition hover:fill-red-200" onclick="window.togglePizzaSlice(3)" />
                        
                        <line x1="50" y1="2" x2="50" y2="98" stroke="#f59e0b" stroke-width="2" class="pointer-events-none"/>
                        <line x1="2" y1="50" x2="98" y2="50" stroke="#f59e0b" stroke-width="2" class="pointer-events-none"/>
                        
                        <text x="75" y="25" font-size="14" font-weight="900" fill="#b45309" class="pointer-events-none drop-shadow-sm" text-anchor="middle" dominant-baseline="middle">1</text>
                        <text x="75" y="75" font-size="14" font-weight="900" fill="#b45309" class="pointer-events-none drop-shadow-sm" text-anchor="middle" dominant-baseline="middle">2</text>
                        <text x="25" y="75" font-size="14" font-weight="900" fill="#b45309" class="pointer-events-none drop-shadow-sm" text-anchor="middle" dominant-baseline="middle">3</text>
                        <text x="25" y="25" font-size="14" font-weight="900" fill="#b45309" class="pointer-events-none drop-shadow-sm" text-anchor="middle" dominant-baseline="middle">4</text>
                        
                        ${getX2Text(0, 75, 40)}
                        ${getX2Text(1, 75, 90)}
                        ${getX2Text(2, 25, 90)}
                        ${getX2Text(3, 25, 40)}
                    </svg>
                    <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                        <div class="bg-white/90 backdrop-blur-md px-3 py-1 rounded-full text-red-900 text-[11px] font-black shadow-md border border-red-200">
                            ${activePizzaTopping ? 'פעיל: ' + activePizzaTopping : 'בחרו תוספת'}
                        </div>
                    </div>
                </div>

                <div class="flex gap-2 justify-center mb-5 flex-wrap">
                    <button type="button" onclick="window.fillPizza('whole')" class="bg-white border border-red-200 text-red-700 text-[10px] font-bold px-3 py-1.5 rounded-lg shadow-sm hover:bg-red-50 transition">מגש שלם</button>
                    <button type="button" onclick="window.fillPizza('right')" class="bg-white border border-red-200 text-red-700 text-[10px] font-bold px-3 py-1.5 rounded-lg shadow-sm hover:bg-red-50 transition">חצי ימין (1+2)</button>
                    <button type="button" onclick="window.fillPizza('left')" class="bg-white border border-red-200 text-red-700 text-[10px] font-bold px-3 py-1.5 rounded-lg shadow-sm hover:bg-red-50 transition">חצי שמאל (3+4)</button>
                    <button type="button" onclick="window.fillPizza('clear')" class="bg-white border border-slate-200 text-slate-500 text-[10px] font-bold px-3 py-1.5 rounded-lg shadow-sm hover:bg-slate-50 transition">נקה הכל</button>
                </div>

                <div class="bg-white p-3 rounded-xl border border-red-100 min-h-[50px]">
                    <p class="text-[9px] font-bold text-slate-400 mb-1">סיכום בחירה למטבח:</p>
                    ${summaryHtml}
                </div>
            </div>`;
        };

        window.selectPizzaTopping = function(name) {
            activePizzaTopping = name;
            window.renderPizzaBuilderUI();
        };

        window.togglePizzaSlice = function(qIdx) {
            if (!activePizzaTopping) return showToast('info', 'יש לבחור תוספת מתוך הרשימה מעלה!');
            let currentVal = Number(pizzaState[activePizzaTopping][qIdx] || 0);
            
            if (currentVal === 0) pizzaState[activePizzaTopping][qIdx] = 1;
            else if (currentVal === 1) pizzaState[activePizzaTopping][qIdx] = 2;
            else pizzaState[activePizzaTopping][qIdx] = 0;
            
            window.renderPizzaBuilderUI();
            calculateModTotal();
        };

        window.fillPizza = function(action) {
            if (!activePizzaTopping && action !== 'clear') return showToast('info', 'יש לבחור תוספת מתוך הרשימה מעלה!');
            if (action === 'clear') {
                currentPizzaToppings.forEach(t => pizzaState[t.name] = [0, 0, 0, 0]);
            } else if (action === 'whole') {
                pizzaState[activePizzaTopping] = [1, 1, 1, 1];
            } else if (action === 'right') {
                pizzaState[activePizzaTopping][0] = 1;
                pizzaState[activePizzaTopping][1] = 1;
            } else if (action === 'left') {
                pizzaState[activePizzaTopping][2] = 1;
                pizzaState[activePizzaTopping][3] = 1;
            }
            window.renderPizzaBuilderUI();
            calculateModTotal();
        };

        function closeProductModal() { getEl('product-modal').classList.add('hidden'); }
        
        function updateCart(cartKey, delta, name, price, originalCatalogId = null) {
            const catId = originalCatalogId || cartKey; 
            if (!cart[cartKey]) cart[cartKey] = { catalogId: catId, name, price, qty: 0 };
            
            cart[cartKey].qty += delta;
            if (cart[cartKey].qty <= 0) delete cart[cartKey];

            renderCatalog(); updateCartFooter();
        }

        function calculateCartDetails() {
            let baseTotal = 0; let totalQty = 0;
            let itemsForPromo = [];
            
            Object.values(cart).forEach(item => {
                baseTotal += (item.qty * item.price);
                totalQty += item.qty;
                const catalogItem = storeData.catalog.find(c => String(c.id) === String(item.catalogId));
                itemsForPromo.push({ ...item, category: catalogItem ? catalogItem.category : '' });
            });

            let finalTotal = baseTotal;
            let discountAmount = 0;

            if (storeData.promotions && storeData.promotions.length > 0) {
                storeData.promotions.forEach(promo => {
                    let relevantItems = itemsForPromo;
                    if (promo.target_type === 'category') {
                        let cats = [];
                        if(Array.isArray(promo.target_ids)) cats = promo.target_ids;
                        else if(typeof promo.target_ids === 'string') { try { cats = JSON.parse(promo.target_ids); } catch(e){} }
                        if(cats.length > 0) relevantItems = itemsForPromo.filter(i => cats.includes(i.category));
                    }

                    if (relevantItems.length > 0) {
                        let promoItemsTotal = relevantItems.reduce((sum, i) => sum + (i.qty * i.price), 0);
                        let promoItemsQty = relevantItems.reduce((sum, i) => sum + i.qty, 0);

                        if (promo.promo_type === 'discount_pct') {
                            discountAmount += promoItemsTotal * (parseFloat(promo.promo_value) / 100);
                        } else if (promo.promo_type === 'fixed_price') {
                            const fixedP = parseFloat(promo.promo_value);
                            relevantItems.forEach(ri => {
                                if (ri.price > fixedP) discountAmount += (ri.price - fixedP) * ri.qty;
                            });
                        } else if (promo.promo_type === 'bogo') {
                            let freeItems = Math.floor(promoItemsQty / 2);
                            let expandedItems = [];
                            relevantItems.forEach(i => { for(let j=0; j<i.qty; j++) expandedItems.push(i.price); });
                            expandedItems.sort((a,b) => a - b);
                            for(let i=0; i<freeItems; i++) discountAmount += expandedItems[i];
                        }
                    }
                });
            }

            if (discountAmount > baseTotal) discountAmount = baseTotal;
            finalTotal = baseTotal - discountAmount;
            return { baseTotal, finalTotal, discountAmount, totalQty };
        }

        function updateCartFooter() {
            const calc = calculateCartDetails();
            const footer = getEl('cart-footer');
            if (calc.totalQty > 0) { 
                getEl('cart-count').innerText = calc.totalQty; 
                getEl('cart-total').innerText = `₪${calc.finalTotal.toFixed(2)}`; 
                footer.classList.remove('hidden'); 
            } else footer.classList.add('hidden');
        }

        window.toggleDelivery = function(isDel) {
            getEl('is-delivery').value = isDel;
            const btnDel = getEl('btn-delivery-true');
            const btnPick = getEl('btn-delivery-false');
            const fields = getEl('delivery-fields');
            
            if (isDel) {
                btnDel.className = 'flex-1 py-2 text-sm font-bold bg-white text-indigo-700 rounded-lg shadow-sm transition border border-indigo-200';
                btnPick.className = 'flex-1 py-2 text-sm font-bold text-slate-500 hover:text-slate-700 rounded-lg transition border border-transparent';
                fields.classList.remove('hidden');
                getEl('cust-city').required = true;
                getEl('cust-street').required = true;
                getEl('cust-house').required = true;
            } else {
                btnPick.className = 'flex-1 py-2 text-sm font-bold bg-white text-slate-800 rounded-lg shadow-sm transition border border-slate-200';
                btnDel.className = 'flex-1 py-2 text-sm font-bold text-slate-500 hover:text-slate-700 rounded-lg transition border border-transparent';
                fields.classList.add('hidden');
                getEl('cust-city').required = false;
                getEl('cust-street').required = false;
                getEl('cust-house').required = false;
            }
            openCheckoutModal(); // חישוב מחדש של הסה"כ עם דמי משלוח
        };

        function openCheckoutModal() {
            const calc = calculateCartDetails();
            let itemsHtml = '';
            Object.values(cart).forEach((item, index) => {
                const itemTotal = item.qty * item.price;
                itemsHtml += `<div class="flex justify-between items-center py-3 border-b border-slate-50 last:border-0 bg-slate-50/50 px-3 rounded-xl mb-2"><div class="flex items-center gap-3"><span class="bg-white text-slate-900 font-black w-7 h-7 flex items-center justify-center rounded-md border border-slate-200 shadow-sm text-xs">${item.qty}</span><div class="flex flex-col"><span class="font-bold text-slate-800 text-sm">${safeStr(item.name.split(' (')[0])}</span>${item.name.includes('(') ? `<span class="text-[10px] text-slate-500">${safeStr(item.name.substring(item.name.indexOf('(')))}</span>` : ''}</div></div><div class="flex items-center gap-3"><span class="font-bold text-slate-900 text-sm">₪${itemTotal.toFixed(2)}</span><button onclick="updateCart('${Object.keys(cart)[index]}', -${item.qty}, '', 0)" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash-can text-xs"></i></button></div></div>`;
            });
            
            // תוספת דמי משלוח
            let delFee = 0;
            const isDelivery = getEl('is-delivery').value === 'true';
            if (isDelivery) {
                // שולף מהגדרות החנות (או 30 ש"ח דיפולט אם לא הוגדר)
                delFee = parseFloat(storeData.settings?.delivery_fee) || 30; 
                itemsHtml += `<div class="flex justify-between items-center py-3 mt-2 bg-indigo-50/50 px-3 rounded-xl mb-2 border border-indigo-100"><div class="flex items-center gap-3"><div class="w-7 h-7 flex items-center justify-center text-indigo-500"><i class="fa-solid fa-motorcycle"></i></div><span class="font-bold text-indigo-800 text-sm">דמי משלוח</span></div><div class="flex items-center gap-3"><span class="font-bold text-slate-900 text-sm">₪${delFee.toFixed(2)}</span></div></div>`;
            }
            
            getEl('checkout-items').innerHTML = itemsHtml; 
            
            const totalWithDelivery = calc.finalTotal + delFee;

            if (calc.discountAmount > 0) {
                getEl('checkout-total').innerHTML = `<span class="text-sm text-slate-400 line-through mr-2 font-normal">₪${(calc.baseTotal + delFee).toFixed(2)}</span>₪${totalWithDelivery.toFixed(2)}`;
                const oldMsg = getEl('checkout-discount-msg'); if(oldMsg) oldMsg.remove();
                getEl('checkout-total').parentElement.insertAdjacentHTML('afterend', `<div id="checkout-discount-msg" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-100 text-left w-max mr-auto mt-1 mb-3">חסכת ₪${calc.discountAmount.toFixed(2)} במבצעים!</div>`);
            } else {
                getEl('checkout-total').innerText = `₪${totalWithDelivery.toFixed(2)}`;
                const oldMsg = getEl('checkout-discount-msg'); if(oldMsg) oldMsg.remove();
            }
            
            getEl('final-submit-price').innerText = `(₪${totalWithDelivery.toFixed(2)})`;

            const minOrder = parseFloat(storeData.settings.min_order) || 0; 
            const btnSubmit = getEl('btn-submit-order'); 
            const warning = getEl('checkout-min-warning');
            
            // המינימום חל רק על מוצרים, ללא דמי המשלוח
            if (minOrder > 0 && calc.finalTotal < minOrder) { 
                getEl('min-order-val').innerText = minOrder; 
                warning.classList.remove('hidden'); 
                btnSubmit.disabled = true; 
                btnSubmit.classList.add('opacity-50', 'cursor-not-allowed'); 
            } else { 
                warning.classList.add('hidden'); 
                btnSubmit.disabled = false; 
                btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed'); 
            }
            
            getEl('checkout-modal').classList.remove('hidden');
        }

        function closeCheckoutModal() { getEl('checkout-modal').classList.add('hidden'); }

        async function submitOrder(e) {
            e.preventDefault(); 
            const btn = getEl('btn-submit-order'); 
            btn.disabled = true; 
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> מעבד...';

            const calc = calculateCartDetails();
            const items = [];
            Object.values(cart).forEach(i => { items.push({ catalogId: i.catalogId, name: i.name, quantity: i.qty, price: i.price }); });

            const isDelivery = getEl('is-delivery').value === 'true';
            const delFee = isDelivery ? (parseFloat(storeData.settings?.delivery_fee) || 30) : 0;
            const finalTotalWithDelivery = calc.finalTotal + delFee;

            let deliveryData = null;
            if (isDelivery) {
                deliveryData = {
                    city: val('cust-city'),
                    street: val('cust-street'),
                    house: val('cust-house'),
                    floor: val('cust-floor'),
                    apt: val('cust-apt'),
                    notes: val('cust-notes')
                };
            }

            try {
                const res = await fetch(`${API}/store/orders`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ 
                        groupId: storeData.groupId, 
                        customerName: val('cust-name'), 
                        customerPhone: val('cust-phone'), 
                        items: items, 
                        totalAmount: finalTotalWithDelivery,
                        isDelivery: isDelivery,
                        deliveryFee: delFee,
                        deliveryDetails: deliveryData
                    }) 
                });
                
                const data = await res.json();
                
                if (data.success) { 
                    confetti({ particleCount: 200, spread: 90, origin: { y: 0.5 }, colors: ['#000', '#4f46e5', '#10b981'] }); 
                    getEl('checkout-modal').classList.add('hidden'); 
                    getEl('cart-footer').classList.add('hidden'); 
                    getEl('success-order-id').innerText = `#${data.orderId}`; 
                    getEl('success-screen').classList.remove('hidden'); 
                    cart = {}; 
                } 
                else { showToast('error', data.error || 'אירעה שגיאה'); }
            } catch(err) { 
                showToast('error', 'שגיאת תקשורת'); 
            } finally { 
                btn.disabled = false; 
                btn.innerHTML = `<span>שליחת הזמנה</span> <span class="text-sm font-medium bg-white/20 px-2 py-0.5 rounded ml-1">(₪${finalTotalWithDelivery.toFixed(2)})</span> <i class="fa-solid fa-paper-plane"></i>`; 
            }
        }

        function scrollCategories(direction) {
            const container = document.getElementById('categories-container');
            if (container) {
                const scrollAmount = 200; 
                container.scrollBy({
                    left: direction * scrollAmount,
                    behavior: 'smooth'
                });
            }
        }

        function updateScrollButtonsVisibility() {
            const container = document.getElementById('categories-container');
            const rightBtn = document.getElementById('scroll-right-btn');
            const leftBtn = document.getElementById('scroll-left-btn');
            
            if (!container || !rightBtn || !leftBtn) return;

            const isAtStart = container.scrollLeft === 0;
            const maxScroll = container.scrollWidth - container.clientWidth;
            const isAtEnd = Math.abs(container.scrollLeft) >= (maxScroll - 5);

            rightBtn.style.opacity = isAtStart ? '0.3' : '1';
            rightBtn.style.pointerEvents = isAtStart ? 'none' : 'auto';
            
            leftBtn.style.opacity = isAtEnd ? '0.3' : '1';
            leftBtn.style.pointerEvents = isAtEnd ? 'none' : 'auto';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('categories-container');
            if (container) {
                container.addEventListener('scroll', updateScrollButtonsVisibility);
                setTimeout(updateScrollButtonsVisibility, 800); 
            }
        });

        initStore();
    </script>
</body>
</html>
