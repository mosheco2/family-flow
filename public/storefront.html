<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>חנות העסק | הזמנה אונליין</title>
    
    <link rel="icon" href="/logo.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Rubik', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .modern-input { width: 100%; padding: 1rem; background: #f8fafc; border-radius: 1rem; border: 1px solid #e2e8f0; transition: all 0.2s; outline: none; font-size: 1rem; color: #1e293b; }
        .modern-input:focus { background: white; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.5); }
        .modal-scroll { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f1f5f9; }
        
        /* Category Slider */
        .cat-slider { display: flex; overflow-x: auto; gap: 0.5rem; scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none; padding-bottom: 5px; }
        .cat-slider::-webkit-scrollbar { display: none; }
        .cat-btn { flex: 0 0 auto; padding: 0.4rem 1rem; border-radius: 99px; font-size: 0.85rem; font-weight: bold; background: #f1f5f9; color: #64748b; transition: all 0.2s; border: 1px solid transparent; }
        .cat-active { background: #4f46e5; color: white; border-color: #4f46e5; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); }

        /* Loader */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800 pb-32">

    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-full shadow-2xl hidden z-[999999] flex items-center gap-3 transition-all duration-300 w-max max-w-[90%]">
        <i id="toast-icon" class="text-lg"></i><span id="toast-message" class="font-medium text-sm"></span>
    </div>

    <div id="loading-screen" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="text-slate-500 font-bold animate-pulse">מכינים את החנות...</p>
    </div>

    <div id="error-screen" class="fixed inset-0 bg-white z-[90] flex flex-col items-center justify-center p-6 text-center hidden">
        <div class="w-24 h-24 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center text-4xl mb-4"><i class="fa-solid fa-store-slash"></i></div>
        <h2 id="error-title" class="text-2xl font-black text-slate-800 mb-2">אופס!</h2>
        <p id="error-message" class="text-slate-500 font-medium leading-relaxed"></p>
    </div>

    <div id="store-app" class="hidden max-w-xl mx-auto min-h-screen bg-slate-50 shadow-2xl relative sm:rounded-3xl sm:mt-4 sm:border border-slate-200">
        
        <header class="bg-white p-6 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-12 bg-gradient-to-r from-indigo-50 to-purple-50"></div>
            
            <div class="relative z-10 flex flex-col items-center">
                <img id="store-logo" src="" class="w-20 h-20 object-cover rounded-full border-4 border-white shadow-md mb-3 hidden bg-white">
                <div id="store-logo-placeholder" class="w-20 h-20 rounded-full border-4 border-white shadow-md mb-3 bg-indigo-100 text-indigo-400 flex items-center justify-center text-3xl"><i class="fa-solid fa-store"></i></div>
                
                <h1 id="store-name" class="text-2xl font-black text-slate-800 tracking-tight">...</h1>
                <p id="store-slogan" class="text-sm text-indigo-600 font-bold mt-1 hidden"></p>
                <p id="store-welcome" class="text-xs text-slate-500 mt-2 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100 hidden"></p>
            </div>
        </header>

        <div class="glass-header sticky top-0 z-40 p-4 shadow-sm border-b border-slate-200">
            <div class="relative mb-3">
                <i class="fa-solid fa-search absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-input" onkeyup="handleSearch()" placeholder="חיפוש מוצר..." class="w-full bg-slate-100 border border-slate-200 text-slate-700 text-sm rounded-xl py-2.5 pr-10 pl-4 outline-none focus:border-indigo-500 transition">
            </div>
            
            <div class="cat-slider" id="categories-container">
                <button onclick="filterCategory('all')" id="cat-btn-all" class="cat-btn cat-active">הכל</button>
                </div>
        </div>

        <div class="p-4" id="catalog-container">
            </div>

    </div>

    <div id="cart-footer" class="fixed bottom-0 sm:bottom-4 left-0 right-0 sm:left-1/2 sm:transform sm:-translate-x-1/2 sm:max-w-xl bg-white border-t sm:border border-slate-200 p-4 sm:rounded-2xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)] z-50 flex justify-between items-center hidden slide-up">
        <div>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">סה"כ לתשלום</p>
            <div class="flex items-end gap-2">
                <span id="cart-total" class="font-black text-2xl text-slate-800 leading-none">₪0</span>
                <span id="cart-count" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md mb-1">0 פריטים</span>
            </div>
        </div>
        <button onclick="openCheckoutModal()" class="bg-indigo-600 text-white px-8 py-3.5 rounded-xl font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition hover:scale-105 active:scale-95 flex items-center gap-2">
            המשך להזמנה <i class="fa-solid fa-arrow-left text-sm"></i>
        </button>
    </div>

    <div id="checkout-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-[60] flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl flex flex-col max-h-[90vh] slide-up">
            <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                <h3 class="text-2xl font-black text-slate-800">סיכום הזמנה 🛒</h3>
                <button onclick="closeCheckoutModal()" class="w-8 h-8 bg-slate-100 rounded-full text-slate-500 flex items-center justify-center hover:bg-slate-200 transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto modal-scroll mb-4 pr-2" id="checkout-items">
                </div>

            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 mb-6 shrink-0">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-sm font-bold text-slate-500">סה"כ לתשלום:</span>
                    <span id="checkout-total" class="text-2xl font-black text-indigo-600">₪0</span>
                </div>
                <p id="checkout-min-warning" class="text-[10px] font-bold text-red-500 text-right hidden mt-2 bg-red-50 p-1.5 rounded-lg"><i class="fa-solid fa-circle-exclamation"></i> המינימום להזמנה בחנות זו הוא ₪<span id="min-order-val"></span></p>
            </div>

            <form onsubmit="submitOrder(event)" class="space-y-3 shrink-0" id="checkout-form">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1 ml-1">שם מלא:</label>
                    <input type="text" id="cust-name" required class="modern-input py-3 text-sm" placeholder="איך קוראים לכם?">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1 ml-1">מספר טלפון:</label>
                    <input type="tel" id="cust-phone" required class="modern-input py-3 text-sm text-left dir-ltr" placeholder="050-0000000">
                </div>
                <button type="submit" id="btn-submit-order" class="w-full bg-slate-800 text-white py-4 rounded-xl font-bold shadow-xl mt-4 text-lg hover:bg-slate-700 transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> שלח הזמנה לעסק
                </button>
            </form>
        </div>
    </div>

    <div id="success-screen" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center p-6 text-center hidden slide-up">
        <div class="w-24 h-24 bg-green-50 text-green-500 rounded-full flex items-center justify-center text-5xl mb-6 shadow-inner border border-green-100"><i class="fa-solid fa-check"></i></div>
        <h2 class="text-3xl font-black text-slate-800 mb-2">הזמנתך התקבלה! 🎉</h2>
        <p class="text-slate-500 font-medium mb-8">בעל העסק קיבל את ההזמנה וייצור איתך קשר בהקדם להמשך טיפול ותשלום.</p>
        <div class="bg-slate-50 p-6 rounded-2xl w-full max-w-xs border border-slate-100 shadow-sm mb-8">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">מספר הזמנה</p>
            <p id="success-order-id" class="text-3xl font-black text-indigo-600 font-mono tracking-wider">#0000</p>
        </div>
        <button onclick="window.location.reload()" class="text-slate-400 text-sm font-bold underline hover:text-slate-600">חזור לחנות</button>
    </div>

    <script>
        const API = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';
        let storeData = null;
        let cart = {}; // { catalogId: { item, qty } }
        let currentCategory = 'all';
        let searchQuery = '';

        const getEl = id => document.getElementById(id);
        const safeStr = str => (str || '').toString().replace(/'/g, "\\'").replace(/"/g, "&quot;");

        function showToast(t, m) { 
            const el = getEl('toast'); const icon = getEl('toast-icon'); 
            el.classList.remove('hidden'); 
            getEl('toast-message').innerText = m; 
            icon.className = t === 'success' ? 'fa-solid fa-check text-green-400' : 'fa-solid fa-xmark text-red-400'; 
            setTimeout(() => el.classList.add('hidden'), 3000); 
        }

        function showError(title, msg) {
            getEl('loading-screen').classList.add('hidden');
            getEl('error-title').innerText = title;
            getEl('error-message').innerText = msg;
            getEl('error-screen').classList.remove('hidden');
        }

        async function initStore() {
            const urlParams = new URLSearchParams(window.location.search);
            const storeCode = urlParams.get('store');
            
            if (!storeCode) {
                showError('קישור שגוי', 'לא נמצא קוד חנות בקישור. ודאו שהעתקתם את הקישור המלא.');
                return;
            }

            try {
                const res = await fetch(`${API}/storefront/${storeCode}`);
                const data = await res.json();

                if (!data.success) {
                    showError('החנות לא קיימת', 'בדקו שוב את הקישור שנשלח אליכם.');
                    return;
                }

                if (!data.settings.is_active) {
                    showError('החנות סגורה כרגע', 'בעל העסק השהה זמנית את הפעילות בחנות. נסו שוב מאוחר יותר.');
                    return;
                }

                storeData = data;
                renderHeader();
                extractCategories();
                renderCatalog();
                getEl('loading-screen').classList.add('hidden');
                getEl('store-app').classList.remove('hidden');

            } catch (err) {
                showError('תקלת תקשורת', 'לא הצלחנו להתחבר לשרת. נסו לרענן את העמוד.');
            }
        }

        function renderHeader() {
            getEl('store-name').innerText = storeData.groupName;
            document.title = `${storeData.groupName} | חנות`;
            
            // לוגו
            if(storeData.settings.logo_url) {
                getEl('store-logo').src = storeData.settings.logo_url;
                getEl('store-logo').classList.remove('hidden');
                getEl('store-logo-placeholder').classList.add('hidden');
            }

            // סלוגן
            if(storeData.settings.slogan) {
                getEl('store-slogan').innerText = storeData.settings.slogan;
                getEl('store-slogan').classList.remove('hidden');
            }

            // הודעת פתיחה
            if(storeData.settings.welcome_message) {
                getEl('store-welcome').innerText = storeData.settings.welcome_message;
                getEl('store-welcome').classList.remove('hidden');
            }
        }

        function extractCategories() {
            const container = getEl('categories-container');
            if (!storeData.catalog || storeData.catalog.length === 0) return;

            const categories = new Set();
            storeData.catalog.forEach(item => {
                if(item.category) categories.add(item.category.trim());
            });

            let html = `<button onclick="filterCategory('all')" id="cat-btn-all" class="cat-btn cat-active">הכל</button>`;
            categories.forEach(cat => {
                html += `<button onclick="filterCategory('${safeStr(cat)}')" id="cat-btn-${safeStr(cat)}" class="cat-btn">${safeStr(cat)}</button>`;
            });
            container.innerHTML = html;
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('cat-active'));
            const activeBtn = getEl(cat === 'all' ? 'cat-btn-all' : `cat-btn-${cat}`);
            if(activeBtn) activeBtn.classList.add('cat-active');
            renderCatalog();
        }

        function handleSearch() {
            searchQuery = getEl('search-input').value.toLowerCase();
            renderCatalog();
        }

        function renderCatalog() {
            const container = getEl('catalog-container');
            if (!storeData.catalog || storeData.catalog.length === 0) {
                container.innerHTML = '<div class="text-center py-12"><i class="fa-solid fa-box-open text-4xl text-slate-300 mb-3"></i><p class="text-slate-500 font-medium">אין מוצרים זמינים כרגע בחנות.</p></div>';
                return;
            }

            // סינון לפי קטגוריה וחיפוש
            let filtered = storeData.catalog;
            if (currentCategory !== 'all') {
                filtered = filtered.filter(item => item.category === currentCategory);
            }
            if (searchQuery.trim() !== '') {
                filtered = filtered.filter(item => item.name.toLowerCase().includes(searchQuery) || (item.description && item.description.toLowerCase().includes(searchQuery)));
            }

            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 py-8">לא נמצאו מוצרים תואמים.</p>';
                return;
            }

            const storeType = storeData.settings.store_type || 'retail';
            let html = '';

            if (storeType === 'retail') {
                // תצוגת חנות קמעונאית (Grid)
                html = '<div class="grid grid-cols-2 gap-3">';
                filtered.forEach(item => {
                    const imgHtml = item.image_url ? `<img src="${item.image_url}" class="w-full h-32 object-cover rounded-xl mb-2 shadow-sm border border-slate-100">` : `<div class="w-full h-32 bg-slate-100 text-slate-300 rounded-xl mb-2 flex items-center justify-center shadow-sm border border-slate-200"><i class="fa-solid fa-image text-3xl"></i></div>`;
                    const descHtml = item.description ? `<p class="text-[10px] text-slate-500 line-clamp-2 mb-2 flex-1">${safeStr(item.description)}</p>` : '<div class="flex-1"></div>';
                    const currentQty = cart[item.id] ? cart[item.id].qty : 0;
                    
                    let actionHtml = `<button onclick="updateCart(${item.id}, 1, '${safeStr(item.name)}', ${item.price})" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 shrink-0 shadow-sm"><i class="fa-solid fa-plus"></i> הוסף</button>`;
                    if (currentQty > 0) {
                        actionHtml = `
                        <div class="flex items-center gap-2 bg-indigo-50 rounded-lg p-1 border border-indigo-100 shrink-0">
                            <button onclick="updateCart(${item.id}, -1, '${safeStr(item.name)}', ${item.price})" class="w-6 h-6 rounded bg-white text-slate-600 shadow-sm flex items-center justify-center"><i class="fa-solid fa-minus text-[10px]"></i></button>
                            <span class="font-black text-indigo-600 text-xs w-3 text-center" id="qty-val-${item.id}">${currentQty}</span>
                            <button onclick="updateCart(${item.id}, 1, '${safeStr(item.name)}', ${item.price})" class="w-6 h-6 rounded bg-indigo-600 text-white shadow-sm flex items-center justify-center"><i class="fa-solid fa-plus text-[10px]"></i></button>
                        </div>`;
                    }

                    html += `
                    <div class="bg-white rounded-2xl p-2.5 border border-slate-200 shadow-sm flex flex-col fade-in">
                        ${imgHtml}
                        <h3 class="font-bold text-sm text-slate-800 leading-tight mb-1">${safeStr(item.name)}</h3>
                        ${descHtml}
                        <div class="flex justify-between items-end mt-2 pt-2 border-t border-slate-50" id="action-container-${item.id}">
                            <span class="font-black text-slate-800 text-sm">₪${item.price}</span>
                            ${actionHtml}
                        </div>
                    </div>`;
                });
                html += '</div>';
            } else {
                // תצוגת מסעדה / מזון (List)
                html = '<div class="flex flex-col gap-3">';
                filtered.forEach(item => {
                    const imgHtml = item.image_url ? `<img src="${item.image_url}" class="w-20 h-20 sm:w-24 sm:h-24 object-cover rounded-xl shadow-sm border border-slate-100 flex-shrink-0">` : `<div class="w-20 h-20 sm:w-24 sm:h-24 bg-slate-100 text-slate-300 rounded-xl flex items-center justify-center shadow-sm border border-slate-200 flex-shrink-0"><i class="fa-solid fa-utensils text-2xl"></i></div>`;
                    const descHtml = item.description ? `<p class="text-[11px] text-slate-500 mt-1 leading-snug line-clamp-2">${safeStr(item.description)}</p>` : '';
                    const currentQty = cart[item.id] ? cart[item.id].qty : 0;

                    let actionHtml = `<button onclick="updateCart(${item.id}, 1, '${safeStr(item.name)}', ${item.price})" class="bg-slate-100 text-slate-700 hover:bg-slate-200 w-8 h-8 rounded-full text-xs font-bold transition flex items-center justify-center shadow-sm"><i class="fa-solid fa-plus"></i></button>`;
                    if (currentQty > 0) {
                        actionHtml = `
                        <div class="flex items-center gap-3 bg-slate-100 rounded-full p-1 border border-slate-200">
                            <button onclick="updateCart(${item.id}, -1, '${safeStr(item.name)}', ${item.price})" class="w-7 h-7 rounded-full bg-white text-slate-600 shadow-sm flex items-center justify-center"><i class="fa-solid fa-minus text-[10px]"></i></button>
                            <span class="font-black text-indigo-600 text-sm w-3 text-center" id="qty-val-${item.id}">${currentQty}</span>
                            <button onclick="updateCart(${item.id}, 1, '${safeStr(item.name)}', ${item.price})" class="w-7 h-7 rounded-full bg-indigo-600 text-white shadow-sm flex items-center justify-center"><i class="fa-solid fa-plus text-[10px]"></i></button>
                        </div>`;
                    }

                    html += `
                    <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex gap-3 fade-in">
                        ${imgHtml}
                        <div class="flex-1 flex flex-col justify-between py-0.5">
                            <div>
                                <h3 class="font-bold text-slate-800 text-sm leading-tight">${safeStr(item.name)}</h3>
                                ${descHtml}
                            </div>
                            <div class="flex justify-between items-end mt-2" id="action-container-${item.id}">
                                <span class="font-black text-slate-800 text-base">₪${item.price}</span>
                                ${actionHtml}
                            </div>
                        </div>
                    </div>`;
                });
                html += '</div>';
            }

            container.innerHTML = html;
        }

        function updateCart(catalogId, delta, name, price) {
            if (!cart[catalogId]) cart[catalogId] = { catalogId, name, price, qty: 0 };
            
            cart[catalogId].qty += delta;
            
            if (cart[catalogId].qty <= 0) {
                cart[catalogId].qty = 0;
                delete cart[catalogId];
            }

            // עדכון ה-UI ללא צורך לרנדר מחדש את כל הקטלוג (לשמירה על אנימציה חלקה)
            renderCatalog(); // הפתרון הנקי ביותר במקרה הזה כדי לעדכן כפתורים בין פלוס למונה
            updateCartFooter();
        }

        function updateCartFooter() {
            let totalQty = 0;
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                totalQty += item.qty;
                totalPrice += (item.qty * item.price);
            });

            const footer = getEl('cart-footer');
            if (totalQty > 0) {
                getEl('cart-count').innerText = `${totalQty} פריטים`;
                getEl('cart-total').innerText = `₪${totalPrice.toFixed(2)}`;
                footer.classList.remove('hidden');
            } else {
                footer.classList.add('hidden');
            }
        }

        function openCheckoutModal() {
            let total = 0;
            let itemsHtml = '';
            
            Object.values(cart).forEach(item => {
                const itemTotal = item.qty * item.price;
                total += itemTotal;
                itemsHtml += `
                <div class="flex justify-between items-center py-3 border-b border-slate-100 last:border-0">
                    <div class="flex items-center gap-3">
                        <span class="bg-indigo-50 text-indigo-600 font-bold px-2 py-1 rounded-md text-xs border border-indigo-100">x${item.qty}</span>
                        <span class="font-medium text-slate-700 text-sm">${safeStr(item.name)}</span>
                    </div>
                    <span class="font-bold text-slate-800 text-sm">₪${itemTotal.toFixed(2)}</span>
                </div>`;
            });

            getEl('checkout-items').innerHTML = itemsHtml;
            getEl('checkout-total').innerText = `₪${total.toFixed(2)}`;

            const minOrder = parseFloat(storeData.settings.min_order) || 0;
            const btnSubmit = getEl('btn-submit-order');
            const warning = getEl('checkout-min-warning');
            
            if (minOrder > 0 && total < minOrder) {
                getEl('min-order-val').innerText = minOrder;
                warning.classList.remove('hidden');
                btnSubmit.disabled = true;
                btnSubmit.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                warning.classList.add('hidden');
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            getEl('checkout-modal').classList.remove('hidden');
        }

        function closeCheckoutModal() {
            getEl('checkout-modal').classList.add('hidden');
        }

        async function submitOrder(e) {
            e.preventDefault();
            
            const custName = val('cust-name');
            const custPhone = val('cust-phone');
            if(!custName || !custPhone) return showToast('error', 'יש להזין שם וטלפון ליצירת קשר');

            const btn = getEl('btn-submit-order');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> שולח הזמנה לעסק...';

            // הכנת נתוני ההזמנה
            let totalAmount = 0;
            const items = [];
            Object.values(cart).forEach(i => {
                totalAmount += (i.qty * i.price);
                items.push({ catalogId: i.catalogId, name: i.name, quantity: i.qty, price: i.price });
            });

            try {
                const res = await fetch(`${API}/store/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        groupId: storeData.groupId,
                        customerName: custName,
                        customerPhone: custPhone,
                        items: items,
                        totalAmount: totalAmount
                    })
                });

                const data = await res.json();
                
                if (data.success) {
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                    getEl('checkout-modal').classList.add('hidden');
                    getEl('cart-footer').classList.add('hidden');
                    getEl('success-order-id').innerText = `#${data.orderId}`;
                    getEl('success-screen').classList.remove('hidden');
                    cart = {}; // איפוס העגלה
                } else {
                    showToast('error', data.error || 'אירעה שגיאה בשליחת ההזמנה');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> שלח הזמנה לעסק';
                }

            } catch(err) {
                showToast('error', 'שגיאת תקשורת מול השרת');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> שלח הזמנה לעסק';
            }
        }

        // Start App
        initStore();
    </script>
</body>
</html>
