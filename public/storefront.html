<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>חנות העסק</title>
    
    <link rel="icon" href="/logo.png" type="image/png">
    <meta property="og:title" content="חנות | Oneflow Life">
    <meta property="og:description" content="הזמינו מהחנות שלנו">
    <meta property="og:image" content="/logo.png">
    <meta property="og:type" content="website">
    <script>
      (async () => {
        try {
          const r = await fetch('/api/system/public-config');
          const d = await r.json();
          if (d.globalAiLogo) {
            document.querySelector("link[rel~='icon']").href = d.globalAiLogo;
            document.querySelector("meta[property='og:image']").content = d.globalAiLogo;
          }
        } catch(e) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        .hide-arrows::-webkit-outer-spin-button, .hide-arrows::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .hide-arrows { -moz-appearance: textfield; }
        body { font-family: 'Heebo', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .modern-input { width: 100%; padding: 1rem; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; transition: all 0.2s; outline: none; font-size: 1rem; color: #1e293b; }
        .modern-input:focus { background: white; border-color: #000; box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: none; } }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .product-card { transition: all 0.3s ease; border: 1px solid transparent; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border-color: #e5e7eb; }
        
        .cat-slider { display: flex; overflow-x: auto; gap: 0.5rem; padding: 0.5rem 1rem; scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none; border-bottom: 1px solid #f3f4f6; }
        .cat-slider::-webkit-scrollbar { display: none; }
        .cat-btn { flex: 0 0 auto; padding: 0.4rem 1.2rem; border-radius: 99px; font-size: 0.85rem; font-weight: 500; background: white; color: #4b5563; border: 1px solid #e5e7eb; transition: all 0.2s; }
        .cat-active { background: #000; color: white; border-color: #000; font-weight: 700; }
        
        /* Sidebar & Menu Styles */
        #side-menu { transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #side-menu.open { transform: translateX(0); }
        .side-link-active { background: #f8fafc; border-right: 4px solid #000; font-weight: 900; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 pb-32">

    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl hidden z-[999999] flex items-center gap-3 transition-all duration-300 w-max max-w-[90%] font-medium">
        <i id="toast-icon" class="text-lg"></i><span id="toast-message" class="text-sm"></span>
    </div>

    <div id="loading-screen" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-slate-800 mb-4"></i>
        <p class="text-slate-500 font-bold tracking-wide">טוען חנות...</p>
    </div>

    <div id="store-app" class="hidden max-w-xl mx-auto min-h-screen bg-white shadow-2xl relative sm:rounded-2xl sm:my-4 overflow-hidden">
        
    <div id="menu-overlay" class="fixed inset-0 bg-slate-900/50 z-[100] hidden opacity-0 transition-opacity duration-300" onclick="window.toggleSideMenu(false)"></div>
    <div id="side-menu" class="fixed top-0 right-0 bottom-0 w-72 bg-white z-[101] shadow-2xl flex flex-col overflow-hidden">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50 shrink-0">
            <h3 class="font-black text-xl text-slate-800">קטגוריות</h3>
            <button onclick="window.toggleSideMenu(false)" class="w-10 h-10 flex items-center justify-center rounded-full bg-white shadow-sm border border-slate-200 text-slate-500 hover:bg-slate-100 transition"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto py-2 modal-scroll" id="side-categories-list"></div>
    </div>

    <header class="bg-white border-b border-slate-100 flex flex-col relative w-full pb-0">
        <div id="store-hero-banner" class="w-full h-40 sm:h-48 bg-slate-100 relative overflow-hidden shrink-0">
            <div class="absolute inset-0 bg-gradient-to-r from-slate-200 to-slate-100 flex items-center justify-center text-slate-300">
                <i class="fa-solid fa-image text-5xl opacity-30"></i>
            </div>
        </div>
        
        <div class="relative px-6 pt-0 text-center sm:text-right flex flex-col sm:flex-row items-center sm:items-start gap-4 sm:gap-6 w-full max-w-4xl mx-auto pb-4">
            <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-2xl bg-white shadow-lg p-1.5 flex items-center justify-center relative overflow-hidden -mt-12 z-20 border border-slate-50 shrink-0">
                <img id="store-logo" src="" class="w-full h-full object-cover rounded-xl hidden">
                <div id="store-logo-placeholder" class="w-full h-full bg-slate-50 rounded-xl flex items-center justify-center text-slate-300">
                    <i class="fa-solid fa-store text-4xl"></i>
                </div>
            </div>
            
            <div class="flex-1 flex flex-col items-center sm:items-start pt-2 z-20 w-full">
                <h1 id="store-name" class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight mb-1">...</h1>
                <p id="store-slogan" class="text-sm text-slate-500 font-medium mb-3 hidden"></p>
                
                <div id="store-contact-info" class="flex flex-wrap items-center justify-center sm:justify-start gap-2 text-xs font-bold hidden w-full">
                    <span id="header-hours" class="hidden bg-slate-50 text-slate-600 px-3 py-1.5 rounded-lg border border-slate-200 flex items-center gap-1.5 shadow-sm"><i class="fa-regular fa-clock text-slate-400"></i> <span id="header-hours-text" dir="ltr"></span></span>
                    <button onclick="window.openContactModal()" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-1.5 rounded-lg border border-indigo-200 flex items-center gap-1.5 transition shadow-sm"><i class="fa-regular fa-envelope text-xs"></i> צור קשר</button>
                    <a id="header-wa" href="#" target="_blank" class="hidden bg-[#25D366]/10 text-[#25D366] hover:bg-[#25D366]/20 px-3 py-1.5 rounded-lg border border-[#25D366]/20 flex items-center gap-1.5 transition shadow-sm"><i class="fa-brands fa-whatsapp text-sm"></i> וואטסאפ</a>
                    <a id="header-phone" href="#" class="hidden bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-lg border border-blue-200 flex items-center gap-1.5 transition shadow-sm"><i class="fa-solid fa-phone text-xs"></i> חייג</a>
                    <button id="btn-book-appointment" onclick="window.openBookingModal()" class="hidden bg-gradient-to-r from-cyan-500 to-blue-500 text-white px-4 py-1.5 rounded-lg border-transparent flex items-center gap-1.5 shadow-md hover:shadow-lg transition transform hover:-translate-y-0.5"><i class="fa-regular fa-calendar-check"></i> קביעת תור/אירוע</button>
                    <button id="btn-book-table" onclick="window.openTableReservationModal()" class="hidden bg-gradient-to-r from-orange-500 to-red-500 text-white px-4 py-1.5 rounded-lg border-transparent flex items-center gap-1.5 shadow-md hover:shadow-lg transition transform hover:-translate-y-0.5"><i class="fa-solid fa-utensils"></i> הזמן שולחן</button>
                </div>

                <div id="store-welcome" class="inline-block bg-slate-900 text-white text-xs font-bold px-3 py-1.5 rounded-lg hidden shadow-sm mt-3 w-max mx-auto sm:mx-0"><i class="fa-solid fa-star text-yellow-400 mr-1 text-[10px]"></i> <span id="store-welcome-text"></span></div>
            </div>
        </div>
        
        <div id="store-promotions-banner" class="w-full m-0 p-0 border-t border-slate-100"></div>
    </header>

    <div id="complex-banner-container" class="w-full max-w-4xl mx-auto px-4 pt-4 pb-1 hidden"></div>

    <div class="glass-header sticky top-0 z-40 shadow-sm border-b border-slate-100 mt-2">
        <div class="p-3 flex flex-col gap-2">
            <div class="flex items-center justify-between gap-3">
                <button onclick="window.toggleSideMenu(true)" class="w-10 h-10 shrink-0 bg-slate-900 text-white rounded-xl flex items-center justify-center hover:bg-black transition shadow-md" title="תפריט קטגוריות">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div id="store-breadcrumbs" class="flex-1 flex items-center gap-2 text-[11px] font-bold text-slate-500 bg-slate-50 px-3 py-2.5 rounded-xl border border-slate-200">
                    <span class="hover:text-slate-900 cursor-pointer transition flex items-center gap-1" onclick="window.filterCategory('all')"><i class="fa-solid fa-house"></i> החנות</span>
                    <i class="fa-solid fa-chevron-left text-[8px] opacity-40"></i>
                    <span id="breadcrumb-current" class="text-slate-900 truncate">כל המוצרים</span>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <div class="relative flex-1">
                    <i class="fa-solid fa-search absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" onkeyup="window.handleSearch()" placeholder="חיפוש מוצר..." class="w-full bg-white border border-slate-200 text-slate-700 text-sm rounded-xl py-2.5 pr-9 pl-4 outline-none focus:border-slate-400 transition shadow-sm">
                </div>
                <button onclick="window.toggleViewMode()" id="view-mode-btn" class="w-10 h-10 shrink-0 bg-white text-slate-600 rounded-xl flex items-center justify-center hover:bg-slate-50 transition shadow-sm border border-slate-200" title="החלף תצוגה">
                    <i class="fa-solid fa-list"></i>
                </button>
            </div>
        </div>

        <div class="relative w-full px-2 pb-2 group border-t border-slate-100 pt-2">
            <button id="scroll-right-btn" onclick="window.scrollCategories(1)" class="absolute right-0 top-1/2 -translate-y-1/2 z-10 w-7 h-7 flex items-center justify-center bg-white/90 backdrop-blur rounded-full shadow-md text-slate-800 hover:scale-110 transition border border-slate-200">
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>

            <div class="cat-slider hide-scrollbar px-6" id="categories-container"></div>

            <button id="scroll-left-btn" onclick="window.scrollCategories(-1)" class="absolute left-0 top-1/2 -translate-y-1/2 z-10 w-7 h-7 flex items-center justify-center bg-white/90 backdrop-blur rounded-full shadow-md text-slate-800 hover:scale-110 transition border border-slate-200">
                <i class="fa-solid fa-chevron-left text-[10px]"></i>
            </button>
        </div>
    </div>
    
    <div class="p-4 bg-slate-50 min-h-[50vh]" id="catalog-container"></div>
