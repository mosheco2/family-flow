<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <link rel="icon" href="/api/public/logo" type="image/png">
    <link rel="shortcut icon" href="/api/public/logo" type="image/png">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>מעקב משלוח</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; }
  .status-line { position: relative; padding-right: 28px; }
  .status-line::before { content:''; position:absolute; right:10px; top:24px; bottom:-8px; width:2px; background:#e2e8f0; }
  .status-line:last-child::before { display:none; }
  .status-dot { position:absolute; right:0; top:6px; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; }
</style>
</head>
<body>
<div id="root" class="min-h-screen flex flex-col items-center justify-start py-6 px-4">
  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">📦</div>
      <h1 class="text-xl font-black text-slate-800">מעקב משלוח</h1>
      <p class="text-sm text-slate-500" id="order-num"></p>
    </div>

    <!-- Loading -->
    <div id="loading" class="bg-white rounded-3xl shadow-sm p-8 text-center text-slate-400 text-sm">
      <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-3 block text-orange-400"></i>
      טוען פרטי משלוח...
    </div>

    <!-- Error -->
    <div id="error" class="hidden bg-white rounded-3xl shadow-sm p-8 text-center">
      <div class="text-4xl mb-3">😕</div>
      <p class="font-bold text-slate-700">לא נמצא משלוח</p>
      <p class="text-sm text-slate-400 mt-1">הלינק אינו תקין או שפג תוקפו</p>
    </div>

    <!-- Main card -->
    <div id="main" class="hidden space-y-4">
      <!-- Status hero -->
      <div id="status-hero" class="rounded-3xl p-6 text-center text-white shadow-lg">
        <div class="text-5xl mb-3" id="status-icon">📦</div>
        <div class="text-xl font-black" id="status-label">טוען...</div>
        <div class="text-sm opacity-80 mt-1" id="status-sub"></div>
      </div>

      <!-- Details card -->
      <div class="bg-white rounded-3xl shadow-sm p-5 space-y-3">
        <div class="flex items-start gap-3 border-b border-slate-100 pb-3">
          <span class="text-lg">📍</span>
          <div>
            <div class="text-xs text-slate-400 font-medium">כתובת מסירה</div>
            <div class="font-bold text-slate-800 text-sm" id="delivery-address">—</div>
          </div>
        </div>
        <div class="flex items-start gap-3 border-b border-slate-100 pb-3" id="window-row">
          <span class="text-lg">🕐</span>
          <div>
            <div class="text-xs text-slate-400 font-medium">חלון זמן מתוכנן</div>
            <div class="font-bold text-slate-800 text-sm" id="time-window">—</div>
          </div>
        </div>
        <div class="flex items-start gap-3" id="driver-row">
          <span class="text-lg">🚗</span>
          <div>
            <div class="text-xs text-slate-400 font-medium">שליח</div>
            <div class="font-bold text-slate-800 text-sm" id="driver-name">—</div>
          </div>
        </div>
      </div>

      <!-- Failed attempt warning -->
      <div id="failed-warning" class="hidden bg-red-50 border border-red-200 rounded-2xl p-4 flex gap-3">
        <span class="text-2xl">📵</span>
        <div>
          <div class="font-bold text-red-700 text-sm">לא הצלחנו להגיע אליך</div>
          <div class="text-xs text-red-600 mt-0.5" id="failed-count"></div>
          <div class="mt-2 space-y-2">
            <button onclick="approveLeaveDoor()" class="w-full py-2 bg-orange-500 text-white rounded-xl text-sm font-bold">
              ✅ אשר השארה בדלת
            </button>
          </div>
        </div>
      </div>

      <!-- Progress timeline -->
      <div class="bg-white rounded-3xl shadow-sm p-5">
        <div class="font-bold text-slate-700 text-sm mb-4">מעקב התקדמות</div>
        <div id="timeline" class="space-y-1"></div>
      </div>

      <!-- Refresh -->
      <p class="text-center text-xs text-slate-400">
        מתעדכן אוטומטית כל 30 שניות
        <button onclick="loadTracking()" class="text-orange-500 underline mr-1">רענן עכשיו</button>
      </p>
    </div>
  </div>
</div>

<script>
const token = location.pathname.split('/').pop();
const API = '/api/logistics/track/' + token;

const STATUS_META = {
  new:           { label:'נוצרה הזמנה',     icon:'📋', color:'bg-slate-500',   sub:'הבקשה התקבלה במערכת' },
  pending_quote: { label:'ממתין להצעת מחיר',icon:'💬', color:'bg-slate-400',   sub:'נשלחת אליך הצעת מחיר בקרוב' },
  quote_sent:    { label:'הצעה נשלחה',       icon:'📄', color:'bg-blue-400',    sub:'בבקשה אשר את ההצעה' },
  confirmed:     { label:'אושר',             icon:'✅', color:'bg-blue-600',    sub:'ההזמנה אושרה' },
  assigned:      { label:'שויך לשליח',       icon:'🚗', color:'bg-indigo-500',  sub:'השליח מתכונן לאיסוף' },
  picked_up:     { label:'נאסף',             icon:'📦', color:'bg-violet-500',  sub:'החבילה נאספה ובדרך אליך' },
  in_transit:    { label:'בדרך אליך',        icon:'🚚', color:'bg-violet-600',  sub:'השליח בדרך לכתובת שלך' },
  arrived:       { label:'הגיע לכתובת',      icon:'📍', color:'bg-amber-500',   sub:'השליח ממתין בחוץ' },
  delivered:     { label:'נמסר בהצלחה',      icon:'🎉', color:'bg-emerald-600', sub:'החבילה הגיעה!' },
  partial:       { label:'נמסר חלקית',       icon:'⚠️', color:'bg-amber-600',   sub:'חלק מהחבילות נמסרו' },
  failed_attempt:{ label:'לא הצלחנו להגיע', icon:'📵', color:'bg-red-500',     sub:'ניסינו ליצור קשר — לא ענית' },
  returned:      { label:'הוחזר למוצא',      icon:'↩️', color:'bg-slate-600',   sub:'החבילה הוחזרה לנקודת המוצא' },
  cancelled:     { label:'בוטל',             icon:'❌', color:'bg-rose-500',    sub:'ההזמנה בוטלה' }
};

const FLOW_ORDER = ['new','confirmed','assigned','picked_up','in_transit','arrived','delivered'];

let currentData = null;

async function loadTracking() {
  try {
    const r = await fetch(API);
    if (!r.ok) { showError(); return; }
    currentData = await r.json();
    renderTracking(currentData);
  } catch(e) { showError(); }
}

function showError() {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error').classList.remove('hidden');
}

function renderTracking(d) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');

  document.getElementById('order-num').textContent = d.order_number ? `הזמנה #${d.order_number}` : '';

  const meta = STATUS_META[d.status] || { label: d.status, icon:'📦', color:'bg-slate-500', sub:'' };
  const hero = document.getElementById('status-hero');
  hero.className = `rounded-3xl p-6 text-center text-white shadow-lg ${meta.color}`;
  document.getElementById('status-icon').textContent = meta.icon;
  document.getElementById('status-label').textContent = meta.label;
  document.getElementById('status-sub').textContent = meta.sub;

  document.getElementById('delivery-address').textContent = d.delivery_address || '—';

  if (d.scheduled_date || d.scheduled_time_window) {
    const date = d.scheduled_date ? new Date(d.scheduled_date).toLocaleDateString('he-IL') : '';
    const window = d.scheduled_time_window || '';
    document.getElementById('time-window').textContent = [date, window].filter(Boolean).join(' | ');
  } else {
    document.getElementById('window-row').classList.add('hidden');
  }

  if (d.driver_name) {
    document.getElementById('driver-name').textContent = d.driver_name + (d.driver_phone ? ` · ${d.driver_phone}` : '');
  } else {
    document.getElementById('driver-row').classList.add('hidden');
  }

  // Failed attempt warning
  if (d.status === 'failed_attempt' && d.failed_attempts_count > 0) {
    document.getElementById('failed-warning').classList.remove('hidden');
    document.getElementById('failed-count').textContent = `ניסיון ${d.failed_attempts_count} מתוך 3`;
  }

  // Timeline
  const timeline = document.getElementById('timeline');
  const currentIdx = FLOW_ORDER.indexOf(d.status);
  const html = FLOW_ORDER.map((st, i) => {
    const m = STATUS_META[st];
    const done = i <= currentIdx;
    const active = i === currentIdx;
    return `<div class="status-line mb-4">
      <div class="status-dot ${done ? (active ? 'bg-orange-500' : 'bg-emerald-500') : 'bg-slate-200'} text-white">
        ${done ? (active ? '●' : '✓') : ''}
      </div>
      <div class="${done ? 'text-slate-800' : 'text-slate-400'} text-sm ${active ? 'font-black' : 'font-medium'}">
        ${m.icon} ${m.label}
      </div>
    </div>`;
  }).join('');
  timeline.innerHTML = html;
}

async function approveLeaveDoor() {
  // POST leave-at-door approval — sends token back
  try {
    await fetch(`/api/logistics/track/${token}/leave-at-door`, { method:'POST' });
    alert('תודה! אישרת השארת החבילה בדלת. השליח יחזור בהקדם.');
  } catch(e) {}
}

loadTracking();
setInterval(loadTracking, 30000);
</script>
</body>
</html>
