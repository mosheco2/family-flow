<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>חנות מסעדה</title>
<link rel="icon" href="/api/public/logo" type="image/png">
<script>
(async () => {
  try {
    const r = await fetch('/api/system/public-config');
    const d = await r.json();
    if (d.globalAiLogo) {
      document.querySelector("link[rel~='icon']").href = d.globalAiLogo;
    }
  } catch(e) {}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --accent: #e63946;
    --accent-dark: #c0392b;
    --bg-hero: #111;
    --text-hero: #fff;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Heebo', sans-serif; background: #f5f0eb; color: #1a1a1a; -webkit-tap-highlight-color: transparent; margin: 0; }

  /* ===== TOP BAR ===== */
  #top-bar { background: #1a1a1a; color: #fff; font-size: 12px; text-align: center; padding: 7px 16px; }
  #top-bar span { opacity: .75; }
  #top-bar .sep { opacity: .35; margin: 0 8px; }

  /* ===== STICKY HEADER ===== */
  #main-header { position: sticky; top: 0; z-index: 200; background: #fff; border-bottom: 1px solid #eee; }
  #header-row1 { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
  #header-logo { width: 40px; height: 40px; border-radius: 10px; object-fit: contain; background: #f0f0f0; }
  #header-logo-placeholder { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 18px; flex-shrink: 0; }
  #header-name { font-weight: 900; font-size: 16px; flex: 1; }
  #header-status { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; margin-left: 4px; }
  #header-branch-btn { font-size: 12px; color: #555; border: 1px solid #ddd; border-radius: 8px; padding: 4px 10px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }

  #header-row2 { display: flex; align-items: center; gap: 8px; padding: 0 16px 10px; }
  #delivery-toggle { display: flex; background: #f5f5f5; border-radius: 10px; overflow: hidden; border: 1px solid #e8e8e8; flex-shrink: 0; }
  .dtog-btn { padding: 7px 16px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; background: transparent; color: #888; transition: all .2s; }
  .dtog-btn.active { background: #1a1a1a; color: #fff; border-radius: 8px; }
  #header-search { flex: 1; background: #f5f5f5; border: 1px solid #e8e8e8; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-family: 'Heebo', sans-serif; outline: none; }
  #cart-btn { position: relative; width: 40px; height: 40px; border-radius: 10px; background: #1a1a1a; border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  #cart-count-badge { position: absolute; top: -5px; left: -5px; background: var(--accent); color: #fff; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; font-weight: 900; display: none; align-items: center; justify-content: center; }

  /* ===== HERO ===== */
  #hero { background: linear-gradient(135deg, var(--bg-hero) 0%, #2d0a0a 100%); color: #fff; padding: 28px 20px 24px; position: relative; overflow: hidden; }
  #hero-inner { display: flex; align-items: center; gap: 16px; position: relative; z-index: 2; }
  #hero-content { flex: 1; min-width: 0; }
  #hero-img-wrap { flex-shrink: 0; width: 150px; height: 150px; border-radius: 16px; overflow: hidden; display: none; box-shadow: 0 8px 32px rgba(0,0,0,.5); background-size: cover; background-position: center; background-color: #333; }
  #hero-img-wrap.is-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; background: transparent; box-shadow: none; border-radius: 0; }
  #hero-img-wrap.is-grid img { width: 100%; height: 73px; object-fit: cover; border-radius: 10px; display: block; }
  @media(max-width:400px){ #hero-img-wrap { width: 120px; height: 120px; } #hero-img-wrap.is-grid img { height: 58px; } }
  #hero h1 { font-size: 32px; font-weight: 900; line-height: 1.1; margin: 0 0 12px; }
  #hero h1 .accent { color: var(--accent); }
  #hero-sub { font-size: 14px; color: rgba(255,255,255,.7); margin: 0 0 20px; line-height: 1.5; }
  #hero-ctas { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
  .hero-cta-primary { background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 13px 22px; font-weight: 900; font-size: 15px; font-family: 'Heebo', sans-serif; cursor: pointer; }
  .hero-cta-secondary { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.4); border-radius: 12px; padding: 13px 18px; font-weight: 700; font-size: 14px; font-family: 'Heebo', sans-serif; cursor: pointer; }
  #hero-stats { display: flex; gap: 20px; }
  .hero-stat { text-align: center; }
  .hero-stat .val { font-size: 20px; font-weight: 900; display: block; }
  .hero-stat .lbl { font-size: 11px; color: rgba(255,255,255,.55); }
  #hero-bg-deco { position: absolute; top: 0; right: -60px; width: 280px; height: 100%; opacity: .06; font-size: 200px; display: flex; align-items: center; justify-content: center; pointer-events: none; }

  /* ===== INFO BAR ===== */
  #info-bar { background: #fff; display: flex; gap: 0; border-bottom: 1px solid #eee; overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none; }
  #info-bar::-webkit-scrollbar { display: none; }
  .info-chip { display: flex; align-items: center; gap: 6px; padding: 10px 16px; font-size: 12px; font-weight: 600; white-space: nowrap; color: #555; border-left: 1px solid #f0f0f0; flex-shrink: 0; }
  .info-chip i { color: var(--accent); font-size: 13px; }

  /* ===== PROMO CAROUSEL ===== */
  #promo-section { padding: 16px 16px 0; }
  #promo-row { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 4px; }
  #promo-row::-webkit-scrollbar { display: none; }
  .promo-card { flex: 0 0 240px; border-radius: 16px; padding: 16px; color: #fff; position: relative; overflow: hidden; }
  .promo-card.red { background: var(--accent); }
  .promo-card.dark { background: #1a1a1a; }
  .promo-card.light { background: #f5f0eb; color: #1a1a1a; border: 1px solid #e8e0d5; }
  .promo-card h3 { font-size: 18px; font-weight: 900; margin: 0 0 6px; }
  .promo-card p { font-size: 12px; opacity: .8; margin: 0 0 12px; }
  .promo-btn { background: rgba(255,255,255,.2); border: 1.5px solid rgba(255,255,255,.4); color: #fff; border-radius: 10px; padding: 7px 14px; font-size: 12px; font-weight: 700; font-family: 'Heebo', sans-serif; cursor: pointer; }
  .promo-card.light .promo-btn { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }

  /* ===== CAT NAV ===== */
  #cat-nav-wrap { position: sticky; top: 100px; z-index: 100; background: #fff; border-bottom: 2px solid #f0ebe4; }
  #cat-nav { display: flex; overflow-x: auto; gap: 4px; padding: 10px 12px; scrollbar-width: none; -ms-overflow-style: none; }
  #cat-nav::-webkit-scrollbar { display: none; }
  .cat-pill { flex: 0 0 auto; padding: 6px 16px; border-radius: 99px; font-size: 13px; font-weight: 700; border: none; background: #f5f0eb; color: #555; cursor: pointer; transition: all .2s; white-space: nowrap; font-family: 'Heebo', sans-serif; }
  .cat-pill.active { background: #1a1a1a; color: #fff; }

  /* ===== SECTION TITLES ===== */
  .sec-wrap { padding: 20px 16px 0; }
  .sec-title { font-size: 22px; font-weight: 900; margin: 0 0 4px; }
  .sec-sub { font-size: 13px; color: #888; margin: 0 0 14px; }

  /* ===== PRODUCT GRID ===== */
  #catalog-container { padding: 0 16px 16px; }
  .cat-section { margin-bottom: 8px; }
  .cat-section-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #aaa; text-transform: uppercase; padding: 16px 0 8px; border-top: 1px solid #eee; margin-top: 8px; }
  .cat-section-label:first-child { border-top: none; margin-top: 0; }

  .product-card { background: #fff; border-radius: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); cursor: pointer; transition: transform .15s; border: 1px solid transparent; }
  .product-card:active { transform: scale(.98); }
  .product-card.selected-outline { border-color: var(--accent); }
  .product-img { width: 88px; height: 88px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: #f0ebe4; }
  .product-img-placeholder { width: 88px; height: 88px; border-radius: 12px; flex-shrink: 0; background: #f0ebe4; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .product-info { flex: 1; min-width: 0; }
  .product-name { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
  .product-desc { font-size: 12px; color: #888; margin: 0 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .product-footer { display: flex; align-items: center; justify-content: space-between; }
  .product-price { font-size: 16px; font-weight: 900; }
  .product-orig { font-size: 12px; color: #bbb; text-decoration: line-through; margin-right: 4px; }
  .product-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: #fff; margin-right: 4px; }
  .add-btn { width: 34px; height: 34px; border-radius: 10px; background: #1a1a1a; color: #fff; border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Heebo', sans-serif; transition: background .15s; }
  .add-btn:hover { background: var(--accent); }
  .qty-ctrl { display: flex; align-items: center; gap: 8px; }
  .qty-ctrl button { width: 28px; height: 28px; border-radius: 8px; border: 1.5px solid #ddd; background: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: 'Heebo', sans-serif; }
  .qty-ctrl .qty-val { font-size: 15px; font-weight: 700; min-width: 20px; text-align: center; }

  /* ===== REVIEWS ===== */
  #reviews-section { padding: 24px 16px 8px; }
  #reviews-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  #reviews-avg { font-size: 38px; font-weight: 900; }
  #reviews-stars { color: var(--accent); font-size: 18px; letter-spacing: 2px; }
  #reviews-count { font-size: 13px; color: #888; }
  #reviews-row { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 8px; }
  #reviews-row::-webkit-scrollbar { display: none; }
  .review-card { flex: 0 0 240px; background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 1px 6px rgba(0,0,0,.07); }
  .review-stars { color: var(--accent); font-size: 13px; margin-bottom: 6px; }
  .review-text { font-size: 13px; color: #444; line-height: 1.5; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .review-author { font-size: 11px; font-weight: 700; color: #aaa; }

  /* ===== ZONES ===== */
  #zones-section { padding: 16px 16px; }
  .zone-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0ebe4; font-size: 13px; }
  .zone-name { font-weight: 600; }
  .zone-fee { font-weight: 700; }
  .zone-free { color: #22c55e; }

  /* ===== HOURS ===== */
  #hours-section { padding: 16px 16px; background: #fff; margin: 8px 16px; border-radius: 16px; }
  .hours-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #f5f5f5; }
  .hours-row:last-child { border-bottom: none; }
  .hours-day { color: #888; }
  .hours-active { background: #f5f5f5; border-radius: 8px; padding: 2px 8px; }

  /* ===== FOOTER ===== */
  #store-footer { background: #1a1a1a; color: #fff; padding: 28px 20px 100px; margin-top: 24px; }
  .footer-name { font-size: 18px; font-weight: 900; margin-bottom: 4px; }
  .footer-addr { font-size: 12px; color: rgba(255,255,255,.5); margin-bottom: 20px; }
  .footer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .footer-col h5 { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.4); letter-spacing: .06em; margin: 0 0 10px; text-transform: uppercase; }
  .footer-col a, .footer-col span { display: block; font-size: 13px; color: rgba(255,255,255,.7); text-decoration: none; margin-bottom: 6px; cursor: pointer; }
  .footer-col a:hover, .footer-col span:hover { color: #fff; }
  #app-links { display: flex; gap: 10px; flex-wrap: wrap; }
  .app-link-btn { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); color: #fff; border-radius: 10px; padding: 8px 14px; font-size: 12px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px; cursor: pointer; }

  /* ===== CART FOOTER ===== */
  #cart-footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px; background: #fff; border-top: 1px solid #eee; z-index: 300; display: none; box-shadow: 0 -4px 20px rgba(0,0,0,.1); }
  #cart-footer-inner { max-width: 600px; margin: 0 auto; }
  #cart-open-btn { width: 100%; background: #1a1a1a; color: #fff; border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 900; font-family: 'Heebo', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }

  /* ===== MODALS ===== */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 400; display: flex; align-items: flex-end; justify-content: center; }
  .modal-sheet { background: #fff; border-radius: 24px 24px 0 0; width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .modal-header { position: sticky; top: 0; background: #fff; padding: 16px 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; z-index: 1; border-radius: 24px 24px 0 0; }
  .modal-close { width: 36px; height: 36px; border-radius: 50%; background: #f5f5f5; border: none; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .modal-body { padding: 16px 20px 32px; }
  .modern-input { width: 100%; padding: 13px 14px; background: #f8f8f8; border-radius: 12px; border: 1.5px solid #eee; font-size: 14px; font-family: 'Heebo', sans-serif; outline: none; color: #1a1a1a; transition: border-color .2s; }
  .modern-input:focus { border-color: var(--accent); background: #fff; }
  label.form-label { font-size: 13px; font-weight: 700; display: block; margin: 14px 0 5px; }
  .submit-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 900; font-family: 'Heebo', sans-serif; cursor: pointer; margin-top: 20px; }

  /* toast */
  #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 9999; display: none; white-space: nowrap; max-width: 90vw; }


  /* loading */
  #loading-screen { position: fixed; inset: 0; background: #fff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .spinner { width: 36px; height: 36px; border: 3px solid #eee; border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (min-width: 640px) {
    #store-wrap { max-width: 600px; margin: 16px auto; border-radius: 24px; overflow: hidden; box-shadow: 0 8px 48px rgba(0,0,0,.12); }
  }
</style>
</head>
<body>

<div id="toast"></div>
<div id="loading-screen">
  <div class="spinner"></div>
  <p style="font-size:14px;color:#888;font-weight:700;">טוען חנות...</p>
</div>

<div id="store-wrap" style="display:none;">

  <!-- TOP BAR -->
  <div id="top-bar" style="display:none;">
    <span id="tb-free-delivery" style="display:none;"></span>
    <span class="sep" id="tb-sep1" style="display:none;">·</span>
  </div>

  <!-- STICKY HEADER -->
  <div id="main-header">
    <div id="header-row1">
      <div id="header-logo-placeholder" style="display:none;"></div>
      <img id="header-logo" src="" alt="לוגו" style="display:none;">
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span id="header-status"></span>
          <span id="header-name"></span>
        </div>
        <div id="header-addr" style="font-size:11px;color:#aaa;"></div>
      </div>
      <button id="header-branch-btn" style="display:none;" onclick="scrollToSection('zones-section')">
        <i class="fa-solid fa-location-dot" style="margin-left:4px;"></i>
        <span id="header-branch-label">בחר סניף</span>
      </button>
    </div>
    <div id="header-row2">
      <div id="delivery-toggle">
        <button class="dtog-btn active" id="dtog-delivery" onclick="setDeliveryMode(true)">משלוח</button>
        <button class="dtog-btn" id="dtog-pickup" onclick="setDeliveryMode(false)">איסוף</button>
      </div>
      <input type="search" id="header-search" placeholder="🔍 חיפוש מנה, רכיב או קומבו..." oninput="filterCatalog(this.value)">
      <button id="cart-btn" onclick="openCartModal()">
        <i class="fa-solid fa-bag-shopping"></i>
        <span id="cart-count-badge"></span>
      </button>
    </div>
  </div>

  <!-- HERO -->
  <div id="hero">
    <div id="hero-bg-deco">🍕</div>
    <div id="hero-inner">
      <div id="hero-content">
        <h1 id="hero-headline">מזמינים ב-3 לחיצות.<br><span class="accent" id="hero-eta-text">35 דק'</span> ואוכלים.</h1>
        <p id="hero-sub-text" class="hero-sub"></p>
        <div id="hero-ctas">
          <button class="hero-cta-primary" onclick="document.getElementById('catalog-container').scrollIntoView({behavior:'smooth'})">להזמנה עכשיו</button>
          <button class="hero-cta-secondary" id="hero-repeat-btn" style="display:none;" onclick="repeatLastOrder()">חזרה להזמנה האחרונה</button>
          <button class="hero-cta-secondary" id="btn-table-booking" style="display:none;" onclick="openBookingModal('table')">🪑 הזמן שולחן</button>
          <button class="hero-cta-secondary" id="btn-event-booking" style="display:none;" onclick="openBookingModal('event')">🎉 הזמנת אירוע</button>
        </div>
        <div id="hero-stats">
          <div class="hero-stat">
            <span class="val" id="stat-eta">35 דק'</span>
            <span class="lbl">זמן משלוח</span>
          </div>
          <div class="hero-stat" id="stat-reviews-wrap" style="display:none;">
            <span class="val" id="stat-rating">4.8</span>
            <span class="lbl">דירוג</span>
          </div>
          <div class="hero-stat" id="stat-free-wrap" style="display:none;">
            <span class="val" id="stat-free-val">120₪</span>
            <span class="lbl">משלוח חינם מעל</span>
          </div>
        </div>
      </div>
      <div id="hero-img-wrap"></div>
    </div>
  </div>

  <!-- INFO BAR -->
  <div id="info-bar">
    <div class="info-chip"><i class="fa-solid fa-clock"></i><span id="info-hours">–</span></div>
    <div class="info-chip"><i class="fa-solid fa-phone"></i><a id="info-phone" href="#" style="color:inherit;text-decoration:none;">–</a></div>
    <div class="info-chip" id="info-wa-wrap" style="display:none;"><i class="fa-brands fa-whatsapp" style="color:#22c55e;"></i><a id="info-wa" href="#" style="color:inherit;text-decoration:none;">וואטסאפ</a></div>
    <div class="info-chip"><i class="fa-solid fa-truck-fast"></i><span id="info-delivery">–</span></div>
    <div class="info-chip"><i class="fa-solid fa-motorcycle"></i><span id="info-pickup">–</span></div>
  </div>

  <!-- PROMOTIONS -->
  <div id="promo-section" style="display:none;">
    <div id="promo-row"></div>
  </div>

  <!-- CATALOG -->
  <div class="sec-wrap">
    <div id="cat-nav-wrap">
      <div id="cat-nav"></div>
    </div>
  </div>
  <div id="catalog-container"></div>

  <!-- REVIEWS -->
  <div id="reviews-section" style="display:none;">
    <div class="sec-wrap" style="padding-bottom:0;">
      <div id="reviews-header">
        <div>
          <div class="sec-title">מה אומרים</div>
          <div id="reviews-stars"></div>
        </div>
        <div style="text-align:center;">
          <div id="reviews-avg"></div>
          <div id="reviews-count" class="sec-sub" style="margin:0;"></div>
        </div>
      </div>
    </div>
    <div style="padding:0 16px 16px;">
      <div id="reviews-row"></div>
    </div>
  </div>

  <!-- ZONES -->
  <div id="zones-section" style="display:none;">
    <div class="sec-wrap">
      <div class="sec-title">אזורי חלוקה</div>
      <div id="zones-list"></div>
    </div>
  </div>

  <!-- HOURS -->
  <div id="hours-wrap" style="display:none;padding:16px;">
    <div style="background:#fff;border-radius:16px;padding:16px;">
      <div class="sec-title" style="margin-bottom:12px;">שעות פתיחה</div>
      <div id="hours-content"></div>

<div id="success-screen" style="display:none;position:fixed;inset:0;background:#fff;z-index:9000;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;">
  <div style="font-size:60px;margin-bottom:16px;">🎉</div>

  <p id="success-msg" style="font-size:14px;color:#888;margin:0 0 28px;"></p>
  <button onclick="closeSuccess()" style="background:#1a1a1a;color:#fff;border:none;border-radius:14px;padding:14px 32px;font-size:16px;font-weight:900;cursor:pointer;font-family:'Heebo',sans-serif;">המשך לדפדוף</button>

<script>
// ===== GLOBALS =====
const API = '/api';
let storeData = null;
let catalog = [];
let cart = [];
let isDelivery = true;
let currentCategory = 'all';
let _pmItem = null;
let _pmQty = 1;
let _pmOptions = {};

// ===== INIT =====
async function initStore() {
  const path = window.location.pathname.replace(/^\//, '') || '';
  const params = new URLSearchParams(window.location.search);
  const code = params.get('store') || params.get('groupId') || path || '';
  if (!code) { showError('לא צוינה חנות'); return; }

  try {
    const r = await fetch(`${API}/storefront/${encodeURIComponent(code)}`);
    const data = await r.json();
    if (!data.success) { showError(data.error || 'חנות לא נמצאה'); return; }

    storeData = data;
    catalog = data.catalog || [];
    document.title = data.groupName || 'חנות';

    applyAccentColor(data.settings.accent_color || '#e63946');
    renderHeader(data);
    renderHero(data);
    renderInfoBar(data);
    renderCategories();
    renderCatalog();

    // async extras
    loadPromotions(data.groupId);
    loadReviews(data.groupId);

    // last order
    const lastOrder = getLastOrder();
    if (lastOrder) document.getElementById('hero-repeat-btn').style.display = '';

    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('store-wrap').style.display = '';
  } catch(e) {
    showError('שגיאה בטעינת החנות');
    console.error(e);
  }
}

function applyAccentColor(color) {
  document.documentElement.style.setProperty('--accent', color);
  const darkMatch = color.match(/^#([0-9a-f]{6})$/i);
  if (darkMatch) {
    const r = parseInt(darkMatch[1].slice(0,2),16);
    const g = parseInt(darkMatch[1].slice(2,4),16);
    const b = parseInt(darkMatch[1].slice(4,6),16);
    document.documentElement.style.setProperty('--accent-dark', `rgb(${Math.max(0,r-30)},${Math.max(0,g-30)},${Math.max(0,b-30)})`);
  }
}

function renderHeader(data) {
  const s = data.settings || {};
  document.getElementById('header-name').textContent = data.groupName || '';
  document.getElementById('footer-name').textContent = data.groupName || '';

  const isOpen = isStoreOpen(s);
  const statusEl = document.getElementById('header-status');
  statusEl.style.background = isOpen ? '#22c55e' : '#ef4444';
  statusEl.title = isOpen ? 'פתוח' : 'סגור';

  const _ph = document.getElementById('header-logo-placeholder');
  const _logoImg = document.getElementById('header-logo');
  if (s.logo_url) {
    _ph.style.display = 'none';
    _logoImg.src = s.logo_url;
    _logoImg.style.display = 'block';
    _logoImg.onerror = () => { _logoImg.style.display='none'; _ph.style.display='flex'; _ph.textContent=(s.store_name||data.groupName||'S')[0].toUpperCase(); };
  } else {
    _ph.style.display = 'flex';
    _ph.textContent = (s.store_name || data.groupName || 'S')[0].toUpperCase();
  }

  if (s.phone) {
    document.getElementById('info-phone').textContent = s.phone;
    document.getElementById('info-phone').href = `tel:${s.phone}`;
    document.getElementById('footer-phone-text').textContent = s.phone;
    document.getElementById('footer-phone-link').href = `tel:${s.phone}`;
  }

  if (s.whatsapp_number) {
    document.getElementById('info-wa-wrap').style.display = 'flex';
    document.getElementById('info-wa').href = `https://wa.me/972${s.whatsapp_number.replace(/^0/,'')}`;
  }

  // free delivery top bar
  if (s.free_delivery_above > 0) {
    const fd = document.getElementById('tb-free-delivery');
    fd.style.display = '';
    fd.textContent = `משלוח חינם מעל ${s.free_delivery_above}₪`;
    document.getElementById('tb-sep1').style.display = '';
  }

  // app links footer
  if (s.app_store_url || s.play_store_url) {
    const appLinks = document.getElementById('app-links');
    appLinks.style.display = 'flex';
    if (s.app_store_url) appLinks.innerHTML += `<a class="app-link-btn" href="${escHtml(s.app_store_url)}" target="_blank"><i class="fa-brands fa-apple"></i> App Store</a>`;
    if (s.play_store_url) appLinks.innerHTML += `<a class="app-link-btn" href="${escHtml(s.play_store_url)}" target="_blank"><i class="fa-brands fa-google-play"></i> Google Play</a>`;
  }
}

function renderHero(data) {
  const s = data.settings || {};
  const etaMin = (s.delivery_eta_min != null && s.delivery_eta_min !== '') ? parseInt(s.delivery_eta_min) : 35;

  if (etaMin > 0) {
    document.getElementById('hero-eta-text').textContent = `${etaMin} דק'`;
    document.getElementById('stat-eta').textContent = `${etaMin} דק'`;
  } else {
    const etaStat = document.getElementById('stat-eta')?.closest('.hero-stat');
    if (etaStat) etaStat.style.display = 'none';
    document.getElementById('hero-eta-text').textContent = '';
  }

  if (s.welcome_message) document.getElementById('hero-headline').innerHTML = s.welcome_message.replace(/\n/g,'<br>');
  if (s.slogan) document.getElementById('hero-sub-text').textContent = s.slogan;

  if (s.enable_table_booking) document.getElementById('btn-table-booking').style.display = '';
  if (s.enable_event_booking) document.getElementById('btn-event-booking').style.display = '';

  const _bannerUrl = s.banner_url && s.banner_url !== 'DELETE' && s.banner_url !== 'null' ? s.banner_url : '';
  const hw = document.getElementById('hero-img-wrap');

  if (_bannerUrl) {
    // static banner image
    hw.style.backgroundImage = `url("${_bannerUrl}")`;
    hw.style.backgroundSize = 'cover';
    hw.style.backgroundPosition = 'center';
    hw.style.display = 'block';
    document.getElementById('hero-bg-deco').style.display = 'none';
  } else {
    // try to show product images grid
    const imgItems = (data.catalog || []).filter(p => p.has_image);
    if (imgItems.length >= 2) {
      hw.classList.add('is-grid');
      hw.style.display = 'grid';
      hw.innerHTML = imgItems.slice(0, 4).map(p =>
        `<img src="/api/store/item-image/${p.id}" alt="${escHtml(p.name)}" loading="lazy" onerror="this.parentNode.removeChild(this)">`
      ).join('');
      document.getElementById('hero-bg-deco').style.display = 'none';
    } else {
      // fallback: decorative emoji
      const decos = { pizza: '🍕', burger: '🍔', sushi: '🍣', cafe: '☕', default: '🍽️' };
      const _name = (data.groupName || '').toLowerCase();
      const deco = _name.includes('פיצ') ? decos.pizza : _name.includes('בורגר') ? decos.burger : _name.includes('סושי') ? decos.sushi : _name.includes('קפה') ? decos.cafe : decos.default;
      const bgDeco = document.getElementById('hero-bg-deco');
      bgDeco.textContent = deco;
      bgDeco.style.display = '';
    }
  }

  if (s.free_delivery_above > 0) {
    document.getElementById('stat-free-wrap').style.display = '';
    document.getElementById('stat-free-val').textContent = `${s.free_delivery_above}₪`;
  }
}

function renderInfoBar(data) {
  const s = data.settings || {};
  const hours = s.open_time && s.close_time ? `${s.open_time}–${s.close_time}` : 'שעות לא הוגדרו';
  document.getElementById('info-hours').textContent = hours;
  const _dEta = (s.delivery_eta_min != null && parseInt(s.delivery_eta_min) > 0) ? parseInt(s.delivery_eta_min) : null;
  const _pEta = (s.pickup_eta_min != null && parseInt(s.pickup_eta_min) > 0) ? parseInt(s.pickup_eta_min) : null;
  const infoDelEl = document.getElementById('info-delivery');
  const infoPicEl = document.getElementById('info-pickup');
  if (_dEta) { infoDelEl.textContent = `משלוח ${_dEta} דק'`; } else { infoDelEl.closest('.info-chip').style.display = 'none'; }
  if (_pEta) { infoPicEl.textContent = `איסוף ${_pEta} דק'`; } else { infoPicEl.closest('.info-chip').style.display = 'none'; }

  // zones
  const zones = data.radiusZones || [];
  if (zones.length) {
    document.getElementById('zones-section').style.display = '';
    const list = document.getElementById('zones-list');
    list.innerHTML = zones.map(z => `
      <div class="zone-row">
        <span class="zone-name">${escHtml(z.zone_name || `עד ${z.radius_km} ק"מ`)}</span>
        <span class="zone-fee ${parseFloat(z.delivery_fee) === 0 ? 'zone-free' : ''}">${parseFloat(z.delivery_fee) === 0 ? 'חינם' : z.delivery_fee + '₪'}</span>
      </div>
    `).join('');
  }

  // hours section
  if (s.open_time && s.close_time) {
    document.getElementById('hours-wrap').style.display = '';
    document.getElementById('hours-content').innerHTML = `
      <div class="hours-row"><span class="hours-day">ראשון – חמישי</span><span class="hours-active">${s.open_time}–${s.close_time}</span></div>
    `;
  }
}

function renderCategories() {
  const cats = ['all', ...new Set(catalog.map(p => p.category).filter(Boolean))];
  const nav = document.getElementById('cat-nav');
  nav.innerHTML = cats.map(c => `
    <button class="cat-pill ${c === 'all' ? 'active' : ''}" onclick="filterByCategory('${escHtml(c)}')">${c === 'all' ? 'הכל' : escHtml(c)}</button>
  `).join('');
}

function renderCatalog(searchTerm = '') {
  const container = document.getElementById('catalog-container');
  let items = catalog;
  if (searchTerm) items = items.filter(p => (p.name + ' ' + p.description).includes(searchTerm));
  if (currentCategory !== 'all') items = items.filter(p => p.category === currentCategory);

  if (!items.length) {
    container.innerHTML = `<div style="text-align:center;padding:40px;color:#aaa;font-size:14px;">לא נמצאו מוצרים</div>`;
    return;
  }

  // group by category
  const groups = {};
  items.forEach(p => {
    const cat = p.category || 'כללי';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(p);
  });

  container.innerHTML = Object.entries(groups).map(([cat, prods]) => `
    <div class="cat-section">
      <div class="cat-section-label">${escHtml(cat)}</div>
      ${prods.map(p => productCardHtml(p)).join('')}
    </div>
  `).join('');
}

function productCardHtml(p) {
  const inCart = cart.find(c => c.id === p.id);
  const badge = p.badge_text ? `<span class="product-badge" style="${p.badge_color ? 'background:'+escHtml(p.badge_color) : ''}">${escHtml(p.badge_text)}</span>` : '';
  const orig = p.original_price && p.original_price > p.price ? `<span class="product-orig">${p.original_price}₪</span>` : '';
  const imgEl = p.has_image
    ? `<img class="product-img" src="${API}/store/item-image/${p.id}" alt="${escHtml(p.name)}" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="product-img-placeholder">🍽️</div>`;

  const addControl = inCart
    ? `<div class="qty-ctrl">
        <button onclick="event.stopPropagation();changeQty(${p.id},-1)">−</button>
        <span class="qty-val">${inCart.qty}</span>
        <button onclick="event.stopPropagation();changeQty(${p.id},1)">+</button>
       </div>`
    : `<button class="add-btn" onclick="event.stopPropagation();quickAdd(${p.id})">+</button>`;

  return `
    <div class="product-card" onclick="openProduct(${p.id})">
      ${imgEl}
      <div class="product-info">
        <div class="product-name">${badge}${escHtml(p.name)}</div>
        ${p.description ? `<div class="product-desc">${escHtml(p.description)}</div>` : ''}
        <div class="product-footer">
          <div>${orig}<span class="product-price">${p.price}₪</span></div>
          ${addControl}
        </div>
      </div>
    </div>`;
}

function filterByCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.cat-pill').forEach(btn => btn.classList.toggle('active', btn.textContent.trim() === (cat === 'all' ? 'הכל' : cat)));
  renderCatalog();
}

function filterCatalog(term) { renderCatalog(term); }

// ===== PROMOTIONS =====
async function loadPromotions(groupId) {
  try {
    const r = await fetch(`${API}/store/promotions/${groupId}`);
    const data = await r.json();
    const promos = (data.promotions || data || []).filter(p => p.is_active && p.show_in_banner);
    if (!promos.length) return;
    document.getElementById('promo-section').style.display = '';
    const row = document.getElementById('promo-row');
    const themes = ['red', 'dark', 'light'];
    row.innerHTML = promos.map((p, i) => {
      const theme = themes[i % themes.length];
      const disc = p.promo_type === 'discount_pct' ? `${p.promo_value}% הנחה` : p.promo_type === 'discount_fixed' ? `${p.promo_value}₪ הנחה` : p.promo_type === 'bogo' ? 'קנה 1 קבל 1' : '';
      return `<div class="promo-card ${theme}">
        <h3>${disc}</h3>
        <p>${escHtml(p.title || '')}</p>
        <button class="promo-btn" onclick="copyPromo('${escHtml(p.promo_code||'')}')">
          ${p.promo_code ? `קוד: ${escHtml(p.promo_code)}` : 'פרטים'}
        </button>
      </div>`;
    }).join('');
  } catch(e) {}
}

function copyPromo(code) {
  if (!code) return;
  navigator.clipboard?.writeText(code).catch(()=>{});
  showToast(`קוד ${code} הועתק!`);
}

// ===== REVIEWS =====
async function loadReviews(groupId) {
  try {
    const r = await fetch(`${API}/store/public-reviews/${groupId}`);
    const data = await r.json();
    if (!data.success || !data.reviews || !data.reviews.length) return;

    document.getElementById('reviews-section').style.display = '';
    document.getElementById('reviews-avg').textContent = data.avg_rating;
    document.getElementById('reviews-stars').textContent = '★'.repeat(Math.round(data.avg_rating)) + '☆'.repeat(5 - Math.round(data.avg_rating));
    document.getElementById('reviews-count').textContent = `${data.total} ביקורות`;

    // show in hero stats
    document.getElementById('stat-reviews-wrap').style.display = '';
    document.getElementById('stat-rating').textContent = data.avg_rating;

    const row = document.getElementById('reviews-row');
    row.innerHTML = data.reviews.map(rv => `
      <div class="review-card">
        <div class="review-stars">${'★'.repeat(rv.customer_rating)}${'☆'.repeat(5 - rv.customer_rating)}</div>
        <div class="review-text">${escHtml(rv.customer_rating_notes || '')}</div>
        <div class="review-author">${escHtml(rv.display_name || 'לקוח')}</div>
      </div>
    `).join('');
  } catch(e) {}
}

// ===== CART =====
function quickAdd(id) {
  const p = catalog.find(x => x.id === id);
  if (!p) return;
  if (p.options_text && p.options_text !== '[]' && p.options_text !== 'null') {
    openProduct(id); return;
  }
  const existing = cart.find(c => c.id === id);
  if (existing) { existing.qty++; }
  else { cart.push({ id, catalogId: id, name: p.name, price: p.price, qty: 1 }); }
  renderCatalog();
  updateCartUI();
  showToast(`${p.name} נוסף לעגלה`);
}

function changeQty(id, delta) {
  const idx = cart.findIndex(c => c.id === id);
  if (idx === -1) return;
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  renderCatalog();
  updateCartUI();
}

function updateCartUI() {
  const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
  const count = cart.reduce((s, c) => s + c.qty, 0);
  const badge = document.getElementById('cart-count-badge');
  badge.textContent = count;
  badge.style.display = count ? 'flex' : 'none';

  const footer = document.getElementById('cart-footer');
  footer.style.display = count ? '' : 'none';
  document.getElementById('cart-footer-total').textContent = `${total.toFixed(0)}₪`;
  document.getElementById('cart-footer-label').textContent = `${count} פריטים`;
}

function openCartModal() {
  const modal = document.getElementById('cart-modal');
  modal.style.display = 'flex';
  renderCartModal();
}
function closeCartModal(e) {
  if (!e || e.target === document.getElementById('cart-modal')) document.getElementById('cart-modal').style.display = 'none';
}

// ===== BOOKING =====
let _bookingType = 'table';
function openBookingModal(type) {
  _bookingType = type || 'table';
  const title = document.getElementById('booking-modal-title');
  const guestsWrap = document.getElementById('book-guests-wrap');
  if (type === 'event') {
    title.textContent = '🎉 הזמנת אירוע / קייטרינג';
    if (guestsWrap) guestsWrap.style.display = 'none';
  } else {
    title.textContent = '🪑 הזמנת שולחן';
    if (guestsWrap) guestsWrap.style.display = '';
  }
  document.getElementById('booking-modal').style.display = 'flex';
}
function closeBookingModal() { document.getElementById('booking-modal').style.display = 'none'; }
async function submitBookingReq() {
  const name = document.getElementById('book-name').value.trim();
  const phone = document.getElementById('book-phone').value.trim();
  const date = document.getElementById('book-date').value;
  const time = document.getElementById('book-time').value;
  const notes = document.getElementById('book-notes').value.trim();
  const guests = document.getElementById('book-guests')?.value || '';
  if (!name || !phone || !date) { showToast('נא למלא שם, טלפון ותאריך'); return; }
  const payload = {
    groupId: storeData.groupId,
    title: name,
    eventDate: date,
    startTime: time || '12:00',
    notes: (_bookingType === 'table' ? `סועדים: ${guests}\n` : '') + notes,
    customerPhone: phone,
    status: 'pending',
    serviceId: null
  };
  try {
    const r = await fetch(`${API}/calendar/events`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const d = await r.json();
    if (d.success) {
      closeBookingModal();
      showToast('הבקשה נשלחה! נציג ייצור קשר בהקדם.');
    } else { showToast(d.error || 'שגיאה בשליחה'); }
  } catch(e) { showToast('שגיאת רשת'); }
}
function showToast(msg) {
  let t = document.getElementById('_toast');
  if (!t) { t = document.createElement('div'); t.id='_toast'; t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;z-index:9999;white-space:nowrap;'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity='1';
  setTimeout(() => { t.style.opacity='0'; }, 3000);
}

function renderCartModal() {
  const list = document.getElementById('cart-items-list');
  const s = storeData?.settings || {};
  const empty = document.getElementById('cart-empty-msg');
  const summary = document.getElementById('cart-summary');
  const checkoutBtn = document.getElementById('cart-checkout-btn');

  if (!cart.length) {
    list.innerHTML = '';
    empty.style.display = '';
    summary.style.display = 'none';
    checkoutBtn.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  summary.style.display = '';
  checkoutBtn.style.display = '';

  list.innerHTML = cart.map(c => `
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f5f5f5;">
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:700;">${escHtml(c.name)}</div>
        ${c.note ? `<div style="font-size:11px;color:#aaa;">${escHtml(c.note)}</div>` : ''}
        <div style="font-size:13px;color:#888;">${(c.price * c.qty).toFixed(0)}₪</div>
      </div>
      <div class="qty-ctrl">
        <button onclick="changeQtyCart(${c.id},-1)">−</button>
        <span class="qty-val">${c.qty}</span>
        <button onclick="changeQtyCart(${c.id},1)">+</button>
      </div>
    </div>
  `).join('');

  const subtotal = cart.reduce((s, c) => s + c.price * c.qty, 0);
  const fee = isDelivery ? (parseFloat(s.delivery_fee) || 0) : 0;
  document.getElementById('cs-subtotal').textContent = `${subtotal.toFixed(0)}₪`;
  const drEl = document.getElementById('cs-delivery-row');
  if (isDelivery && fee > 0) {
    drEl.style.display = 'flex';
    document.getElementById('cs-delivery').textContent = `${fee}₪`;
  } else {
    drEl.style.display = 'none';
  }
  document.getElementById('cs-total').textContent = `${(subtotal + fee).toFixed(0)}₪`;
}

function changeQtyCart(id, delta) {
  const idx = cart.findIndex(c => c.id === id);
  if (idx === -1) return;
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  renderCatalog();
  updateCartUI();
  renderCartModal();
}

// ===== PRODUCT MODAL =====
function openProduct(id) {
  const p = catalog.find(x => x.id === id);
  if (!p) return;
  _pmItem = p;
  _pmQty = 1;
  _pmOptions = {};

  document.getElementById('pm-name').textContent = p.name;
  const descParts = [p.description, p.long_description].filter(Boolean).join('\n');
  document.getElementById('pm-desc').textContent = descParts;
  document.getElementById('pm-qty').textContent = 1;
  document.getElementById('pm-total-price').textContent = `${p.price}₪`;

  if (p.has_image) {
    const img = document.getElementById('pm-img');
    img.src = `${API}/store/item-image/${p.id}`;
    img.style.display = '';
  } else {
    document.getElementById('pm-img').style.display = 'none';
  }

  // options
  const optEl = document.getElementById('pm-options');
  try {
    const opts = JSON.parse(p.options_text || '[]');
    if (Array.isArray(opts) && opts.length) {
      optEl.innerHTML = opts.map((g, gi) => `
        <div style="margin-bottom:14px;">
          <div style="font-size:13px;font-weight:700;margin-bottom:8px;">${escHtml(g.name || g.title || '')}</div>
          ${(g.options || g.items || []).map((o, oi) => `
            <label style="display:flex;align-items:center;gap:8px;padding:8px;border:1.5px solid #eee;border-radius:10px;margin-bottom:6px;cursor:pointer;">
              <input type="${g.type === 'multi' ? 'checkbox' : 'radio'}" name="opt_${gi}" value="${oi}" onchange="updatePmOption(${gi},${oi},this)">
              <span style="flex:1;font-size:13px;">${escHtml(typeof o === 'string' ? o : (o.name || ''))}</span>
              ${typeof o === 'object' && o.price ? `<span style="font-size:13px;font-weight:700;">+${o.price}₪</span>` : ''}
            </label>
          `).join('')}
        </div>
      `).join('');
    } else { optEl.innerHTML = ''; }
  } catch(e) { optEl.innerHTML = ''; }

  document.getElementById('product-modal').style.display = 'flex';
}

function updatePmOption(gi, oi, el) {
  if (!_pmOptions[gi]) _pmOptions[gi] = [];
  if (el.type === 'radio') { _pmOptions[gi] = [oi]; }
  else {
    if (el.checked) { if (!_pmOptions[gi].includes(oi)) _pmOptions[gi].push(oi); }
    else { _pmOptions[gi] = _pmOptions[gi].filter(x => x !== oi); }
  }
  updatePmPrice();
}

function updatePmPrice() {
  if (!_pmItem) return;
  let extra = 0;
  try {
    const opts = JSON.parse(_pmItem.options_text || '[]');
    Object.entries(_pmOptions).forEach(([gi, selected]) => {
      const g = opts[gi];
      if (!g) return;
      const items = g.options || g.items || [];
      selected.forEach(oi => {
        const o = items[oi];
        if (o && typeof o === 'object' && o.price) extra += parseFloat(o.price) || 0;
      });
    });
  } catch(e) {}
  document.getElementById('pm-total-price').textContent = `${((_pmItem.price + extra) * _pmQty).toFixed(0)}₪`;
}

function pmQty(delta) {
  _pmQty = Math.max(1, _pmQty + delta);
  document.getElementById('pm-qty').textContent = _pmQty;
  updatePmPrice();
}

function addToCartFromModal() {
  if (!_pmItem) return;
  let extra = 0;
  let noteArr = [];
  try {
    const opts = JSON.parse(_pmItem.options_text || '[]');
    Object.entries(_pmOptions).forEach(([gi, selected]) => {
      const g = opts[gi];
      if (!g) return;
      const items = g.options || g.items || [];
      selected.forEach(oi => {
        const o = items[oi];
        const nm = typeof o === 'string' ? o : (o?.name || '');
        if (nm) noteArr.push(nm);
        if (o && typeof o === 'object' && o.price) extra += parseFloat(o.price) || 0;
      });
    });
  } catch(e) {}

  const finalPrice = _pmItem.price + extra;
  const note = noteArr.join(', ');
  const existing = cart.find(c => c.id === _pmItem.id && c.note === note);
  if (existing) { existing.qty += _pmQty; }
  else { cart.push({ id: _pmItem.id, catalogId: _pmItem.id, name: _pmItem.name, price: finalPrice, qty: _pmQty, note }); }

  closeProductModal();
  renderCatalog();
  updateCartUI();
  showToast(`${_pmItem.name} נוסף לעגלה`);
}

function closeProductModal(e) {
  if (!e || e.target === document.getElementById('product-modal')) document.getElementById('product-modal').style.display = 'none';
}

// ===== CHECKOUT =====
function openCheckout() {
  document.getElementById('cart-modal').style.display = 'none';
  const s = storeData?.settings || {};
  const subtotal = cart.reduce((a, c) => a + c.price * c.qty, 0);
  const min = parseFloat(s.min_order) || 0;
  const warn = document.getElementById('co-min-warning');
  if (min > 0 && subtotal < min) {
    warn.style.display = '';
    warn.textContent = `מינימום הזמנה ${min}₪. חסר עוד ${(min - subtotal).toFixed(0)}₪.`;
    document.getElementById('co-submit-btn').disabled = true;
  } else {
    warn.style.display = 'none';
    document.getElementById('co-submit-btn').disabled = false;
  }
  document.getElementById('co-delivery-block').style.display = isDelivery ? '' : 'none';
  document.getElementById('checkout-modal').style.display = 'flex';
}

function closeCheckout(e) {
  if (!e || e.target === document.getElementById('checkout-modal')) document.getElementById('checkout-modal').style.display = 'none';
}

async function submitOrder() {
  const btn = document.getElementById('co-submit-btn');
  const name = document.getElementById('co-name').value.trim();
  const phone = document.getElementById('co-phone').value.trim();
  const address = document.getElementById('co-address').value.trim();
  const notes = document.getElementById('co-notes').value.trim();

  if (!name) { showToast('אנא הכנס שם'); return; }
  if (!phone || phone.length < 9) { showToast('אנא הכנס מספר טלפון'); return; }
  if (isDelivery && !address) { showToast('אנא הכנס כתובת למשלוח'); return; }

  const s = storeData?.settings || {};
  const subtotal = cart.reduce((a, c) => a + c.price * c.qty, 0);
  const deliveryFee = isDelivery ? (parseFloat(s.delivery_fee) || 0) : 0;

  btn.disabled = true; btn.textContent = 'שולח...';
  try {
    const r = await fetch(`${API}/store/orders`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        groupId: storeData.groupId,
        customerName: name,
        customerPhone: phone,
        items: cart,
        totalAmount: subtotal + deliveryFee,
        isDelivery,
        deliveryFee,
        deliveryDetails: isDelivery ? { address } : null,
        notes,
        orderSource: 'restaurant-template'
      })
    });
    const data = await r.json();
    if (data.success || data.orderId) {
      saveLastOrder({ name, phone, items: cart });
      cart = [];
      renderCatalog();
      updateCartUI();
      document.getElementById('checkout-modal').style.display = 'none';
      document.getElementById('success-msg').textContent = `תודה ${name}! ההזמנה שלך התקבלה ותגיע תוך כ-${s.delivery_eta_min || 35} דק'.`;
      document.getElementById('success-screen').style.display = 'flex';
    } else {
      showToast(data.error || 'שגיאה בשליחת ההזמנה');
    }
  } catch(e) { showToast('שגיאת תקשורת'); }
  finally { btn.disabled = false; btn.textContent = 'אישור הזמנה'; }
}

function closeSuccess() {
  document.getElementById('success-screen').style.display = 'none';
}

// ===== DELIVERY MODE =====
function setDeliveryMode(deliver) {
  isDelivery = deliver;
  document.getElementById('dtog-delivery').classList.toggle('active', deliver);
  document.getElementById('dtog-pickup').classList.toggle('active', !deliver);
  renderCartModal();
}

// ===== HELPERS =====
function isStoreOpen(s) {
  if (!s.open_time || !s.close_time) return true;
  const now = new Date();
  const [oh, om] = s.open_time.split(':').map(Number);
  const [ch, cm] = s.close_time.split(':').map(Number);
  const cur = now.getHours() * 60 + now.getMinutes();
  const open = oh * 60 + om;
  const close = ch * 60 + cm;
  return close > open ? cur >= open && cur <= close : cur >= open || cur <= close;
}

function scrollToSection(id) {
  document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
}

function setView(v) {
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 3000);
}

function showError(msg) {
  document.getElementById('loading-screen').innerHTML = `<div style="text-align:center;padding:32px;"><div style="font-size:48px;margin-bottom:16px;">😕</div><h2>${msg}</h2></div>`;
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function saveLastOrder(o) { try { localStorage.setItem('_last_restaurant_order', JSON.stringify(o)); } catch(e) {} }
function getLastOrder() { try { return JSON.parse(localStorage.getItem('_last_restaurant_order')); } catch(e) { return null; } }
function repeatLastOrder() {
  const last = getLastOrder();
  if (!last) return;
  // scroll to catalog
  document.getElementById('catalog-container').scrollIntoView({ behavior: 'smooth' });
  showToast('מגלל לתפריט — בחר מחדש');
}

// ===== START =====
initStore();
