<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>קול העם</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--card:#fff;--border:#e2e8f0;
  --primary:#4f46e5;--primary-dark:#3730a3;--primary-light:#ede9fe;
  --success:#10b981;--warn:#f59e0b;--danger:#ef4444;
  --text:#1e293b;--muted:#64748b;--muted2:#94a3b8;
  --header:#fff;--radius:0.75rem;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}

/* ── Header ── */
#kh-header{background:var(--header);border-bottom:1px solid var(--border);padding:0 1rem;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.kh-logo{font-size:1.1rem;font-weight:900;color:var(--primary);display:flex;align-items:center;gap:.4rem}
.kh-logo span{font-size:.75rem;color:var(--muted);font-weight:500}
.kh-header-actions{display:flex;gap:.5rem;align-items:center}
.kh-btn-icon{width:36px;height:36px;border:none;background:var(--primary-light);color:var(--primary);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;transition:.15s}
.kh-btn-icon:hover{background:var(--primary);color:#fff}
.kh-btn-icon:active{transform:scale(0.92);opacity:.8}

/* ── Scope Toggle ── */
#scope-bar{background:var(--header);border-bottom:1px solid var(--border);padding:.5rem 1rem;display:flex;gap:.5rem;align-items:center;flex-shrink:0}
.scope-btn{padding:.3rem .85rem;border-radius:999px;border:1px solid var(--border);background:none;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s}
.scope-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
#cat-scroll{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;flex:1}
#cat-scroll::-webkit-scrollbar{display:none}
.cat-chip{padding:.25rem .7rem;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:.15s;flex-shrink:0}
.cat-chip.active{background:var(--primary-light);color:var(--primary);border-color:var(--primary)}

/* ── Scrollable content area ── */
#kh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ── Views ── */
.view{display:none;height:100%}
.view.active{display:block}

/* ── Feed ── */
#view-feed{padding:.75rem}
.feed-grid{display:flex;flex-direction:column;gap:.6rem}
.feed-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.15s;display:flex;gap:.75rem;padding:.75rem}
.feed-card:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(79,70,229,.1)}
.feed-card-img{width:80px;height:70px;border-radius:.5rem;object-fit:cover;flex-shrink:0;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.feed-card-body{flex:1;min-width:0}
.feed-card-meta{display:flex;gap:.4rem;align-items:center;margin-bottom:.25rem;flex-wrap:wrap}
.type-badge{padding:.1rem .45rem;border-radius:.25rem;font-size:.62rem;font-weight:800;letter-spacing:.01em}
.type-ARTICLE{background:#dbeafe;color:#1d4ed8}
.type-QA_QUESTION{background:#fef3c7;color:#92400e}
.type-SUCCESS_STORY{background:#d1fae5;color:#065f46}
.type-WIKI_GUIDE{background:#ede9fe;color:#5b21b6}
.feed-card-title{font-size:.9rem;font-weight:800;color:var(--text);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed-card-sub{font-size:.75rem;color:var(--muted);margin-top:.2rem;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.feed-card-footer{display:flex;gap:.5rem;align-items:center;margin-top:.4rem}
.feed-card-footer span{font-size:.68rem;color:var(--muted2)}
.pin-badge{background:#fef3c7;color:#92400e;font-size:.6rem;font-weight:800;padding:.1rem .35rem;border-radius:.25rem}

/* ── Single content view ── */
#view-content{overflow-y:auto;padding:0}
.content-back{display:flex;align-items:center;gap:.5rem;cursor:pointer;color:var(--primary);font-size:.85rem;font-weight:700;margin-bottom:1rem}
.content-cover{width:100%;max-height:220px;object-fit:cover;border-radius:var(--radius);margin-bottom:1rem}
.content-category-label{font-size:.72rem;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.4rem}
.content-title{font-size:1.5rem;font-weight:900;line-height:1.25;margin-bottom:.5rem}
.content-subtitle{font-size:1rem;color:var(--muted);margin-bottom:.75rem;line-height:1.5}
.content-byline{display:flex;gap:.75rem;font-size:.75rem;color:var(--muted2);margin-bottom:.5rem;flex-wrap:wrap;align-items:center}
.content-byline strong{color:var(--muted)}
.content-html{font-size:.95rem;line-height:1.8;color:var(--text)}
.content-html h1,.content-html h2,.content-html h3{font-weight:800;margin:1.2rem 0 .5rem;line-height:1.3}
.content-html h1{font-size:1.4rem}.content-html h2{font-size:1.2rem}.content-html h3{font-size:1rem}
.content-html p{margin-bottom:.8rem}
.content-html ul,.content-html ol{margin:.5rem 0 .8rem 1.2rem}
.content-html li{margin-bottom:.25rem}
.content-html strong{font-weight:800}
.content-html em{font-style:italic}
.content-tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem;padding-top:.75rem;border-top:1px solid var(--border)}
.tag-chip{padding:.25rem .6rem;background:var(--primary-light);color:var(--primary);border-radius:999px;font-size:.72rem;font-weight:700}
.series-nav{display:flex;justify-content:space-between;gap:.5rem;margin-top:1.25rem;padding-top:.75rem;border-top:1px solid var(--border)}
.series-nav-btn{flex:1;padding:.5rem .75rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);font-size:.8rem;font-weight:700;color:var(--primary);cursor:pointer;text-align:center;transition:.15s}
.series-nav-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ── Editor ── */
#view-editor{overflow-y:auto;padding:1rem}
.editor-back{display:flex;align-items:center;gap:.5rem;cursor:pointer;color:var(--primary);font-size:.85rem;font-weight:700;margin-bottom:1rem}
.field-group{margin-bottom:.85rem}
.field-label{font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:.3rem;display:block}
.field-input{width:100%;padding:.55rem .75rem;border:1.5px solid var(--border);border-radius:.5rem;font-size:.9rem;font-family:inherit;color:var(--text);background:var(--card);transition:.15s;outline:none}
.field-input:focus{border-color:var(--primary)}
.field-select{width:100%;padding:.55rem .75rem;border:1.5px solid var(--border);border-radius:.5rem;font-size:.9rem;font-family:inherit;background:var(--card);cursor:pointer;outline:none}
.field-select:focus{border-color:var(--primary)}
.type-cards{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.3rem}
.type-card{border:2px solid var(--border);border-radius:.6rem;padding:.6rem .5rem;cursor:pointer;text-align:center;transition:.15s}
.type-card.selected{border-color:var(--primary);background:var(--primary-light)}
.type-card .tc-icon{font-size:1.3rem;margin-bottom:.2rem}
.type-card .tc-label{font-size:.72rem;font-weight:800;color:var(--text)}
.type-card .tc-desc{font-size:.62rem;color:var(--muted);margin-top:.1rem}
.scope-toggle-row{display:flex;gap:.5rem;margin-top:.3rem}
.scope-toggle-btn{flex:1;padding:.45rem;border-radius:.5rem;border:1.5px solid var(--border);background:none;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--muted);transition:.15s}
.scope-toggle-btn.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.scope-info{font-size:.72rem;color:var(--muted);margin-top:.35rem;padding:.4rem .6rem;background:#f8fafc;border-radius:.4rem;border-right:3px solid var(--primary-light)}

/* ── Rich Text Editor ── */
.rte-toolbar{display:flex;gap:4px;padding:.4rem;border:1.5px solid var(--border);border-bottom:none;border-radius:.5rem .5rem 0 0;background:#f8fafc;flex-wrap:wrap}
.rte-btn{width:28px;height:28px;border:1px solid transparent;border-radius:.3rem;background:none;cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.1s}
.rte-btn:hover{background:var(--border);color:var(--text)}
.rte-btn.active{background:var(--primary-light);color:var(--primary);border-color:var(--primary)}
.rte-divider{width:1px;height:20px;background:var(--border);margin:0 2px}
#rte-body{min-height:200px;padding:.75rem;border:1.5px solid var(--border);border-radius:0 0 .5rem .5rem;font-size:.9rem;line-height:1.8;outline:none;background:var(--card);direction:rtl}
#rte-body:focus{border-color:var(--primary)}
#rte-body:empty::before{content:attr(data-placeholder);color:var(--muted2)}

/* ── Tags input ── */
.tags-input-wrap{border:1.5px solid var(--border);border-radius:.5rem;padding:.4rem .5rem;display:flex;flex-wrap:wrap;gap:.3rem;min-height:42px;cursor:text;background:var(--card)}
.tags-input-wrap:focus-within{border-color:var(--primary)}
.tags-input-wrap input{border:none;outline:none;font-size:.85rem;font-family:inherit;min-width:80px;flex:1;background:transparent}
.tag-rm{padding:.15rem .45rem;background:var(--primary-light);color:var(--primary);border-radius:999px;font-size:.7rem;font-weight:700;display:flex;align-items:center;gap:.2rem;cursor:pointer}
.tag-rm button{background:none;border:none;cursor:pointer;color:var(--primary);font-size:.7rem;padding:0;line-height:1}
.tags-suggestions{position:absolute;z-index:50;background:var(--card);border:1px solid var(--border);border-radius:.5rem;box-shadow:0 4px 12px rgba(0,0,0,.1);max-height:160px;overflow-y:auto}
.tags-suggestion-item{padding:.4rem .75rem;font-size:.82rem;cursor:pointer;transition:.1s}
.tags-suggestion-item:hover{background:var(--primary-light);color:var(--primary)}

/* ── Buttons ── */
.kh-btn{padding:.6rem 1.25rem;border-radius:.5rem;border:none;font-size:.85rem;font-weight:700;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:.4rem}
.kh-btn-primary{background:var(--primary);color:#fff}
.kh-btn-primary:hover{background:var(--primary-dark)}
.kh-btn-outline{background:none;border:1.5px solid var(--border);color:var(--muted)}
.kh-btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.kh-btn-success{background:var(--success);color:#fff}
.kh-btn-danger{background:var(--danger);color:#fff}
.kh-btn-sm{padding:.35rem .75rem;font-size:.76rem}
.editor-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem;padding-top:.75rem;border-top:1px solid var(--border)}

/* ── My Drafts / My Content ── */
#view-my-drafts,#view-my-content{overflow-y:auto;padding:.75rem}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.section-title{font-size:1rem;font-weight:900}
.content-list-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem;margin-bottom:.5rem;display:flex;gap:.75rem;align-items:flex-start}
.content-list-item-body{flex:1;min-width:0}
.content-list-item-title{font-size:.9rem;font-weight:800;margin-bottom:.2rem}
.content-list-item-meta{font-size:.72rem;color:var(--muted2)}
.status-badge{display:inline-flex;align-items:center;gap:.25rem;padding:.15rem .5rem;border-radius:.3rem;font-size:.65rem;font-weight:800}
.s-DRAFT{background:#f1f5f9;color:#475569}
.s-PENDING_ZM{background:#fef3c7;color:#92400e}
.s-PENDING_SA{background:#ede9fe;color:#5b21b6}
.s-PUBLISHED_LOCAL{background:#d1fae5;color:#065f46}
.s-PUBLISHED_GLOBAL{background:#dbeafe;color:#1d4ed8}
.s-REJECTED{background:#fee2e2;color:#991b1b}
.rejection-note{font-size:.75rem;color:var(--danger);background:#fee2e2;padding:.35rem .5rem;border-radius:.35rem;margin-top:.3rem;line-height:1.4}
.item-actions{display:flex;gap:.35rem;flex-shrink:0;flex-wrap:wrap}

/* ── ZM / SA panels ── */
#view-zm-queue,#view-sa-queue{overflow-y:auto;padding:.75rem}
.queue-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem;margin-bottom:.5rem}
.queue-card-header{display:flex;gap:.5rem;align-items:flex-start;margin-bottom:.5rem}
.queue-card-img{width:56px;height:50px;border-radius:.4rem;object-fit:cover;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.queue-card-title{font-size:.9rem;font-weight:800;margin-bottom:.2rem}
.queue-card-meta{font-size:.72rem;color:var(--muted2)}
.reject-form{margin-top:.5rem;display:none}
.reject-form.open{display:block}
.reject-textarea{width:100%;padding:.45rem .6rem;border:1.5px solid var(--border);border-radius:.4rem;font-size:.82rem;font-family:inherit;resize:none;outline:none;height:70px}
.reject-textarea:focus{border-color:var(--danger)}

/* ── Image upload ── */
.img-upload-area{border:2px dashed var(--border);border-radius:.5rem;padding:1.2rem;text-align:center;cursor:pointer;transition:.15s;color:var(--muted2);font-size:.82rem}
.img-upload-area:hover{border-color:var(--primary);color:var(--primary)}
.img-preview{width:100%;max-height:160px;object-fit:cover;border-radius:.5rem;margin-top:.4rem}

/* ── Toast ── */
#kh-toast{position:fixed;bottom:1rem;right:50%;transform:translateX(50%);background:#1e293b;color:#fff;padding:.6rem 1.2rem;border-radius:999px;font-size:.82rem;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:9999;white-space:nowrap}
#kh-toast.show{opacity:1}

/* ── Empty state ── */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted2)}
.empty-state .ei{font-size:2.5rem;margin-bottom:.5rem}
.empty-state p{font-size:.85rem}

/* ── Loading ── */
.kh-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:2rem auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Confirm modal ── */
#kh-confirm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9998;align-items:center;justify-content:center;padding:1rem}
#kh-confirm.show{display:flex}
.kh-confirm-box{background:var(--card);border-radius:var(--radius);padding:1.25rem;max-width:340px;width:100%}
.kh-confirm-box h3{font-size:.95rem;font-weight:800;margin-bottom:.5rem}
.kh-confirm-box p{font-size:.82rem;color:var(--muted);margin-bottom:1rem;line-height:1.5}
.kh-confirm-box .actions{display:flex;gap:.5rem;justify-content:flex-end}

/* ── Phase 2: Engagement bar ── */
.engagement-bar{display:flex;gap:.4rem;flex-wrap:wrap;margin:.75rem 0;padding:.6rem;background:var(--bg);border-radius:.6rem;border:1px solid var(--border)}
.eng-btn{padding:.35rem .7rem;border-radius:.4rem;border:1.5px solid var(--border);background:var(--card);font-size:.82rem;font-weight:700;cursor:pointer;color:var(--muted);transition:.15s;display:inline-flex;align-items:center;gap:.25rem}
.eng-btn:hover{border-color:var(--primary);color:var(--primary)}
.eng-btn.eng-active{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
.eng-btn.eng-dislike.eng-active{background:#fee2e2;border-color:var(--danger);color:var(--danger)}

/* ── Feed sort bar ── */
.feed-sort-bar{display:flex;gap:.5rem;margin-bottom:.75rem}
.feed-sort-btn{padding:.35rem .85rem;border-radius:999px;border:1.5px solid var(--border);background:var(--card);font-size:.8rem;font-weight:700;cursor:pointer;color:var(--muted);transition:.15s}
.feed-sort-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* ── Trending strips ── */
.kh-strip{margin-bottom:1rem}
.kh-strip-title{font-size:.85rem;font-weight:900;margin-bottom:.4rem;color:var(--text)}
.kh-strip-scroll{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.4rem;-webkit-overflow-scrolling:touch}
.kh-strip-scroll::-webkit-scrollbar{height:3px}
.kh-strip-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.kh-strip-card{flex:0 0 120px;background:var(--card);border:1px solid var(--border);border-radius:.6rem;overflow:hidden;cursor:pointer;transition:.15s}
.kh-strip-card:hover{border-color:var(--primary)}
.kh-strip-img{width:120px;height:72px;object-fit:cover;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.kh-strip-title-sm{font-size:.72rem;font-weight:700;padding:.3rem .4rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kh-strip-meta{font-size:.65rem;color:var(--muted2);padding:.2rem .4rem .3rem}

/* ── Comments ── */
.comments-section{padding-top:1rem;border-top:1px solid var(--border);margin-top:1rem}
.comments-title{font-size:.95rem;font-weight:900;margin-bottom:.75rem}
.comment-add-form{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.75rem}
.comment-input{padding:.45rem .6rem;border:1.5px solid var(--border);border-radius:.4rem;font-size:.85rem;font-family:inherit;resize:none;outline:none;width:100%;background:var(--card);color:var(--text)}
.comment-input:focus{border-color:var(--primary)}
.comments-sort-bar{display:flex;gap:.3rem;margin-bottom:.75rem;flex-wrap:wrap}
.csort-btn{padding:.3rem .65rem;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:.74rem;font-weight:700;cursor:pointer;color:var(--muted);transition:.12s}
.csort-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.comment-item{padding:.6rem 0;border-bottom:1px solid var(--border)}
.comment-header{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-bottom:.25rem}
.comment-time{font-size:.68rem;color:var(--muted2)}
.comment-body{font-size:.85rem;line-height:1.6;color:var(--text);white-space:pre-wrap}
.comment-actions{display:flex;gap:.3rem;margin-top:.35rem;flex-wrap:wrap}
.cact-btn{padding:.2rem .5rem;border-radius:.3rem;border:1px solid var(--border);background:none;font-size:.72rem;font-weight:700;cursor:pointer;color:var(--muted);transition:.12s}
.cact-btn:hover{color:var(--primary)}
.cact-btn.eng-active{color:var(--primary);border-color:var(--primary)}
.cact-solution{color:var(--success);border-color:var(--success)}
.cact-danger{color:var(--danger);border-color:var(--danger)}
.cact-report{color:var(--muted2)}
.reply-form{margin-top:.4rem;display:flex;flex-direction:column;gap:.3rem}
.reply-form.hidden{display:none}
.comment-solution{border-right:3px solid var(--success);padding-right:.5rem;background:#f0fdf4;border-radius:.35rem;margin:.3rem 0}
.solution-badge{display:inline-block;background:#d1fae5;color:#065f46;font-size:.7rem;font-weight:800;padding:.15rem .5rem;border-radius:.3rem;margin-bottom:.25rem}
.mgmt-badge{background:#ede9fe;color:#5b21b6;font-size:.68rem;font-weight:700;padding:.1rem .4rem;border-radius:.25rem}
.solution-votes{font-size:.72rem;color:var(--muted2);margin-top:.2rem}

/* ── Report modal ── */
#kh-report-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9998;align-items:center;justify-content:center;padding:1rem}
#kh-report-modal.show{display:flex}
.kh-report-box{background:var(--card);border-radius:var(--radius);padding:1.25rem;max-width:340px;width:100%;max-height:90vh;overflow-y:auto}
.kh-report-box h3{font-size:.95rem;font-weight:800;margin-bottom:.75rem}
.report-reason-opt{display:flex;align-items:center;gap:.5rem;padding:.35rem 0;font-size:.84rem;cursor:pointer}
.report-reason-opt input{accent-color:var(--primary)}
#report-notes{width:100%;padding:.45rem .6rem;border:1.5px solid var(--border);border-radius:.4rem;font-size:.82rem;font-family:inherit;margin-top:.6rem;resize:none;height:60px;outline:none;background:var(--bg);color:var(--text)}
#report-notes:focus{border-color:var(--primary)}

/* ── Reports panel (ZM queue) ── */
.report-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem;margin-bottom:.5rem}
.report-header{display:flex;justify-content:space-between;margin-bottom:.35rem}
.report-reason-badge{font-size:.7rem;font-weight:800;background:#fee2e2;color:#991b1b;padding:.15rem .5rem;border-radius:.3rem}
.report-date{font-size:.68rem;color:var(--muted2)}
.report-target{font-size:.82rem;font-weight:600;margin-bottom:.25rem}
.report-reporter{font-size:.72rem;color:var(--muted2);margin-bottom:.4rem}
.report-actions{display:flex;gap:.35rem;flex-wrap:wrap}

/* ── Cover upload preview ── */
#cover-preview-wrap{margin-top:.5rem}

/* ── Responsive ── */
@media(min-width:600px){
  .feed-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  .feed-card{flex-direction:column;padding:0;overflow:hidden}
  .feed-card-img{width:100%;height:140px;border-radius:0}
  .feed-card-body{padding:.6rem}
  .feed-card-footer{margin-top:.4rem}
}
/* ── Phase 4: Search, Tags, Collections, Print ── */
.kh-search-wrap{display:flex;align-items:center;gap:.4rem;padding:.4rem .75rem;background:var(--header);border-bottom:1px solid var(--border)}
.kh-search-input{flex:1;border:1px solid var(--border);border-radius:.4rem;padding:.35rem .6rem;font-size:.85rem;background:var(--bg);color:var(--text);outline:none}
.kh-search-input:focus{border-color:var(--primary)}
.search-filters{display:flex;flex-wrap:wrap;gap:.4rem;padding:.5rem .75rem;border-bottom:1px solid var(--border)}
.search-filter-btn{padding:.25rem .5rem;border:1px solid var(--border);border-radius:.3rem;font-size:.72rem;cursor:pointer;background:var(--bg);color:var(--muted)}
.search-filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.search-result-count{font-size:.75rem;color:var(--muted);padding:.25rem .75rem}
.tag-cloud{display:flex;flex-wrap:wrap;gap:.4rem;padding:.75rem}
.tag-chip-link{padding:.25rem .55rem;background:var(--primary-light);color:var(--primary);border-radius:999px;font-size:.75rem;cursor:pointer;font-weight:600}
.tag-chip-link:hover{background:var(--primary);color:#fff}
.collection-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem;cursor:pointer}
.collection-card-title{font-weight:700;font-size:.92rem}
.collection-card-meta{font-size:.72rem;color:var(--muted);margin-top:.2rem}
.collection-toggle{display:flex;align-items:center;gap:.4rem;font-size:.78rem;cursor:pointer}
.version-row{display:flex;gap:.5rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--border);font-size:.8rem}
.version-num{background:var(--primary-light);color:var(--primary);padding:.1rem .4rem;border-radius:.3rem;font-weight:700}
/* AI Copilot */
.ai-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem;margin-top:.75rem}
.ai-panel-title{font-weight:700;font-size:.88rem;margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}
.ai-action-btns{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.5rem}
.ai-action-btn{padding:.25rem .55rem;border:1px solid var(--primary);border-radius:.3rem;font-size:.72rem;cursor:pointer;background:var(--primary-light);color:var(--primary)}
.ai-action-btn.selected{background:var(--primary);color:#fff}
.ai-result-section{margin-top:.5rem;border-top:1px solid var(--border);padding-top:.5rem}
.ai-result-label{font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:.25rem}
.ai-correction-item{display:flex;align-items:flex-start;gap:.4rem;padding:.3rem 0;border-bottom:1px solid var(--border);font-size:.8rem}
.ai-correction-orig{color:var(--danger);text-decoration:line-through}
.ai-correction-sugg{color:var(--success)}
.ai-safety-flag{background:#fee2e2;border:1px solid var(--danger);border-radius:.4rem;padding:.5rem .75rem;font-size:.82rem;color:#991b1b;margin-top:.5rem}
.ai-suggestion-chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--primary-light);color:var(--primary);padding:.2rem .5rem;border-radius:.3rem;font-size:.78rem;cursor:pointer;margin:.15rem}
.ai-suggestion-chip:hover{background:var(--primary);color:#fff}
/* Modal overlay generic */
.kh-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center}
.kh-modal-overlay.show{display:flex}
.kh-modal-box{background:var(--card);border-radius:var(--radius);padding:1.25rem;width:min(92vw,400px);max-height:80vh;overflow-y:auto;display:flex;flex-direction:column;gap:.6rem}
.kh-modal-title{font-weight:700;font-size:1rem}
/* Print */
@media print{
  #kh-header,#scope-bar,.engagement-bar,.comments-section,.content-back,.feed-sort-bar,.kh-strip,.kh-footer-bar,#kh-print-btn{display:none!important}
  .kh-body-wrap,.view{overflow:visible!important;height:auto!important}
  body{font-size:12pt}
  .content-title{font-size:18pt}
}
/* ── Phase 3: Author profile ── */
.author-hero{display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 1rem;gap:.75rem;text-align:center}
.author-avatar-lg{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--primary)}
.author-avatar-placeholder{width:80px;height:80px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:2rem;border:3px solid var(--primary)}
.badge-tag{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:999px;font-size:.7rem;font-weight:600}
.badge-LOCAL_LEADER{background:#fef3c7;color:#92400e}
.badge-GLOBAL_LEADER{background:#dbeafe;color:#1e40af}
.badge-LEGACY{background:#f3f4f6;color:#6b7280}
.badge-DEFAULT{display:none}
.author-stats{display:flex;gap:1.5rem;justify-content:center}
.author-stat{text-align:center}
.author-stat strong{display:block;font-size:1.1rem;font-weight:700}
.author-stat span{font-size:.75rem;color:var(--muted)}
.follow-btn{min-width:100px}
.follow-btn.following{background:var(--primary-light);color:var(--primary);border:1px solid var(--primary)}
.achievement-grid{display:flex;flex-wrap:wrap;gap:.5rem;padding:.5rem 0}
.ach-chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--primary-light);color:var(--primary);padding:.3rem .65rem;border-radius:999px;font-size:.72rem;font-weight:600}
.editor-pick-badge{position:absolute;top:.5rem;right:.5rem;background:#f59e0b;color:#fff;padding:.15rem .45rem;border-radius:.3rem;font-size:.65rem;font-weight:700;z-index:2}
.feed-card-wrap{position:relative}
.leaderboard-item{display:flex;align-items:center;gap:.75rem;padding:.65rem .75rem;border-bottom:1px solid var(--border)}
.lb-rank{font-weight:700;color:var(--muted);min-width:1.5rem;text-align:center}
.lb-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.lb-info{flex:1}
.lb-name{font-weight:600;font-size:.88rem}
.lb-flow{margin-right:auto;font-size:.8rem;color:var(--primary);font-weight:700}

/* ── Content View Redesign (cv-*) ── */
#view-content .content-back{padding:.6rem 1rem;margin:0;border-bottom:1px solid #DDDDD4;background:#EFEFEC;position:sticky;top:0;z-index:5;}
.cv-page{background:#EFEFEC;min-height:100%;padding-bottom:80px;font-family:'Heebo',system-ui,sans-serif;}
.cv-inner{max-width:1100px;margin:0 auto;padding:16px 16px 0;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;}
.cv-article{flex:1 1 440px;min-width:0;}
.cv-aside{flex:1 1 240px;min-width:0;position:sticky;top:52px;display:flex;flex-direction:column;gap:14px;margin-top:22px;}
.cv-hero{position:relative;max-height:300px;overflow:hidden;}
.cv-hero-img{width:100%;height:clamp(160px,26vh,300px);object-fit:cover;display:block;}
.cv-hero-placeholder{width:100%;height:clamp(160px,26vh,300px);background:#D5D5CD;display:flex;align-items:center;justify-content:center;font-size:2.5rem;}
.cv-badge{position:absolute;top:14px;inset-inline-start:14px;background:#E8A33D;color:#16294D;font-size:12px;font-weight:700;padding:5px 12px;border-radius:4px;letter-spacing:.01em;}
.cv-h1{font-size:clamp(22px,4.8vw,38px);line-height:1.18;font-weight:900;color:#111;margin:20px 0 0;text-wrap:pretty;}
.cv-h2{font-size:clamp(15px,2.3vw,19px);line-height:1.5;font-weight:400;color:#6E6E66;margin:10px 0 0;text-wrap:pretty;}
.cv-meta{margin-top:16px;padding:11px 0;border-top:1px solid #DDDDD4;border-bottom:1px solid #DDDDD4;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:#4A4A44;}
.cv-meta-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cv-avatar{width:34px;height:34px;border-radius:50%;background:#E3E3DC;flex-shrink:0;border:1px solid #C9C9C0;}
.cv-meta-right{display:flex;align-items:center;gap:7px;color:#8A8A82;font-size:12px;flex-wrap:wrap;}
.cv-sep{color:#C9C9C0;}
.cv-article .content-html{font-size:clamp(15px,1.7vw,17px);line-height:1.85;color:#22221E;margin-top:20px;}
.cv-article .content-html h3{font-size:clamp(17px,2.8vw,22px);font-weight:700;color:#111;margin:30px 0 10px;}
.cv-article .content-html h2{font-size:clamp(18px,3vw,24px);font-weight:700;color:#111;margin:30px 0 10px;}
.cv-article .content-html h1{font-size:clamp(20px,3.5vw,28px);font-weight:800;color:#111;margin:30px 0 10px;}
.cv-article .content-html p{margin:12px 0 0;}
.cv-article .content-html blockquote{margin:22px 0;padding:14px 18px;background:#fff;border:1px solid #DDDDD4;border-inline-start:5px solid #16294D;font-size:clamp(15px,2vw,18px);line-height:1.6;font-weight:500;color:#16294D;}
.cv-article .content-html figure figcaption{font-size:12px;color:#8A8A82;padding-top:5px;border-inline-start:3px solid #E8A33D;padding-inline-start:9px;margin-top:5px;}
.cv-article .content-html img{max-width:100%;border-radius:4px;}
.cv-series-nav{margin-top:28px;padding:13px 15px;background:#fff;border:1px solid #C9C9C0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;}
.cv-series-nav-btn{font-size:14px;font-weight:500;color:#1F7A72;background:none;border:none;cursor:pointer;padding:4px 0;font-family:'Heebo',sans-serif;}
.cv-series-nav-btn:hover{color:#16294D;}
.cv-tags{margin-top:20px;display:flex;flex-wrap:wrap;gap:7px;padding-top:14px;border-top:1px solid #DDDDD4;}
.cv-tag-label{font-size:12px;color:#8A8A82;align-self:center;margin-inline-end:3px;}
.cv-tag{font-size:13px;padding:5px 13px;border-radius:999px;border:1px solid #C9C9C0;background:#fff;color:#16294D;cursor:pointer;font-family:'Heebo',sans-serif;transition:.15s;}
.cv-tag:hover{background:#1F7A72;color:#fff;border-color:#1F7A72;}
.cv-eng-bar{margin-top:16px;padding:9px 11px;background:#fff;border:1px solid #DDDDD4;display:flex;flex-wrap:wrap;align-items:center;gap:6px;position:sticky;bottom:8px;z-index:10;}
.cv-eng-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;border:1px solid #C9C9C0;background:#fff;color:#16294D;font-size:13px;font-weight:500;cursor:pointer;min-height:38px;font-family:'Heebo',sans-serif;transition:.15s;}
.cv-eng-btn:hover{border-color:#1F7A72;color:#1F7A72;}
.cv-eng-btn.cv-active-like{background:#1F7A72;color:#fff;border-color:#1F7A72;}
.cv-eng-btn.cv-active-dislike{background:#16294D;color:#fff;border-color:#16294D;}
.cv-eng-btn.cv-active-save{background:#E8A33D;color:#16294D;border-color:#E8A33D;}
.cv-eng-share{margin-inline-start:auto;}
.cv-admin-row{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.7rem;padding:.5rem 0;border-top:1px solid #DDDDD4;}
.cv-admin-row:empty{display:none;}
.cv-newsletter{background:#16294D;color:#fff;padding:16px;text-align:center;}
.cv-newsletter-title{font-size:14px;font-weight:700;margin-top:8px;}
.cv-newsletter-sub{font-size:12px;line-height:1.5;color:#B9C6DC;margin-top:5px;}
.cv-newsletter-cta{background:#E8A33D;color:#16294D;border:none;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px;width:100%;font-family:'Heebo',sans-serif;}
.cv-series-box{background:#fff;border:1px solid #C9C9C0;padding:13px;}
.cv-series-box-title{font-size:11px;font-weight:700;color:#8A8A82;letter-spacing:.04em;margin-bottom:9px;}
.cv-series-link{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #EFEFEC;color:#16294D;cursor:pointer;font-size:13px;line-height:1.4;}
.cv-series-link:hover{color:#1F7A72;}
.cv-series-thumb{flex:0 0 52px;height:39px;background:#E3E3DC;border:1px solid #C9C9C0;flex-shrink:0;}
.cv-comments-header{display:flex;align-items:baseline;justify-content:space-between;gap:14px;border-bottom:2px solid #16294D;padding-bottom:9px;margin-bottom:16px;}
.cv-comments-title{font-size:20px;font-weight:700;color:#111;margin:0;}
.cv-comment-form-wrap{background:#fff;border:1px solid #DDDDD4;padding:13px;margin-bottom:14px;}
.cv-comment-txt{width:100%;box-sizing:border-box;min-height:72px;padding:10px;border:1px solid #DDDDD4;background:#FBFBF8;font-size:14px;line-height:1.6;resize:vertical;font-family:'Heebo',sans-serif;outline:none;margin-top:0;}
.cv-comment-submit{background:#1F7A72;color:#fff;border:none;border-radius:999px;padding:9px 22px;font-size:14px;font-weight:700;cursor:pointer;min-height:40px;font-family:'Heebo',sans-serif;margin-top:9px;}
.cv-sort-bar{display:flex;gap:5px;}
.cv-csort-btn{padding:5px 12px;font-size:12px;border-radius:999px;cursor:pointer;border:1px solid #C9C9C0;background:#fff;color:#16294D;font-family:'Heebo',sans-serif;transition:.15s;}
.cv-csort-btn.active{background:#16294D;color:#fff;border-color:#16294D;}

@media(max-width:680px){.cv-aside{position:static;top:auto;}}

/* TL;DR */
.cv-tldr{margin-top:24px;background:#E4F0EE;border:1px solid #BFD9D5;border-inline-start:5px solid #1F7A72;padding:18px 20px;border-radius:0 6px 6px 0;}
.cv-tldr-label{font-size:12px;font-weight:700;color:#1F7A72;letter-spacing:.04em;margin-bottom:10px;text-transform:uppercase;}
.cv-tldr ul{margin:0;padding-inline-start:20px;font-size:16px;line-height:1.75;color:#2A2A26;}
.cv-tldr li{margin-bottom:4px;}

/* Drop cap */
.cv-article .content-html>p:first-of-type::first-letter{float:inline-start;font-size:56px;line-height:.85;font-weight:900;padding-inline-end:10px;padding-top:4px;color:#16294D;}

/* Hero figcaption */
.cv-hero-figcaption{font-size:12px;color:#8A8A82;padding:5px 16px;background:#EFEFEC;border-bottom:1px solid #DDDDD4;}

/* Inner article images */
.cv-article .content-html figure{margin:26px 0 0;}
.cv-article .content-html figure img{width:100%;display:block;border:1px solid #DDDDD4;}
.cv-article .content-html figcaption{font-size:12px;color:#8A8A82;padding:5px 8px;background:#F5F5F2;border:1px solid #DDDDD4;border-top:none;}

/* ── Feed Homepage ── */
#view-feed-inner{padding:0}
.feed-wrap{max-width:1180px;margin:0 auto;padding:16px;}

/* Hero */
.feed-hero{background:#fff;border:1px solid #DDDDD4;display:flex;flex-wrap:wrap;cursor:pointer;}
.feed-hero:hover .feed-hero-title{color:#1F7A72;}
.feed-hero-img-wrap{flex:1 1 520px;position:relative;min-height:240px;aspect-ratio:16/9;background:#16294D;border-inline-start:1px dashed #C9C9C0;overflow:hidden;}
.feed-hero-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.feed-hero-img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem;background:#D5D5CD;}
.feed-hero-editor-badge{position:absolute;top:12px;inset-inline-start:12px;background:#E8A33D;color:#16294D;font-size:12px;font-weight:700;padding:5px 11px;border-radius:4px;}
.feed-hero-body{flex:1 1 320px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:12px;}
.feed-hero-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;}
.feed-hero-pill{background:#16294D;color:#fff;padding:4px 10px;border-radius:999px;font-weight:700;}
.feed-hero-community{color:#1F7A72;}
.feed-hero-title{margin:0;font-size:clamp(24px,3.6vw,38px);line-height:1.15;font-weight:900;color:#111;text-wrap:pretty;transition:.15s;}
.feed-hero-lead{margin:0;font-size:clamp(15px,1.8vw,18px);line-height:1.6;color:#6E6E66;text-wrap:pretty;}
.feed-hero-meta{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:#8A8A82;align-items:center;}

/* Section headers */
.feed-section-hdr{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid #16294D;padding-bottom:8px;}
.feed-section-hdr h2{margin:0;font-size:clamp(18px,2.4vw,22px);font-weight:700;color:#111;}
.feed-section-hdr a{font-size:13px;color:#1F7A72;cursor:pointer;text-decoration:none;}
.feed-section-hdr a:hover{color:#16294D;text-decoration:underline;}

/* Strips */
.feed-strip-wrap{margin-top:28px;}
.feed-strip-scroll{display:flex;gap:12px;overflow-x:auto;padding:14px 2px 6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
.feed-strip-scroll::-webkit-scrollbar{height:8px;}
.feed-strip-scroll::-webkit-scrollbar-thumb{background:#C9C9C0;border-radius:99px;}
.feed-strip-card{flex:0 0 232px;scroll-snap-align:start;background:#fff;border:1px solid #DDDDD4;color:#111;display:block;cursor:pointer;transition:.15s;}
.feed-strip-card:hover{border-color:#1F7A72;}
.feed-strip-card-img-wrap{position:relative;height:126px;background:#16294D;border-bottom:1px dashed #C9C9C0;overflow:hidden;}
.feed-strip-card-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.feed-strip-card-img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2rem;}
.feed-strip-card-editor{position:absolute;top:8px;inset-inline-start:8px;background:#E8A33D;color:#16294D;font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;}
.feed-strip-card-stat{position:absolute;bottom:8px;inset-inline-end:8px;background:#16294D;color:#fff;font-size:11px;padding:3px 8px;border-radius:3px;}
.feed-strip-card-body{padding:10px 12px 14px;}
.feed-strip-card-community{font-size:11px;color:#1F7A72;font-weight:700;margin-bottom:5px;}
.feed-strip-card-title{font-size:15px;line-height:1.4;font-weight:500;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* Category grid */
.feed-catgrid-wrap{margin-top:32px;}
.feed-catgrid{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;}
.feed-catblock{flex:1 1 320px;min-width:280px;background:#fff;border:1px solid #DDDDD4;padding:14px;}
.feed-catblock-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #EFEFEC;padding-bottom:8px;margin-bottom:12px;}
.feed-catblock-hdr h3{margin:0;font-size:17px;font-weight:700;color:#16294D;}
.feed-catblock-hdr a{font-size:12px;color:#1F7A72;cursor:pointer;text-decoration:none;}
.feed-catblock-lead{display:block;cursor:pointer;color:#111;}
.feed-catblock-lead:hover .feed-catblock-lead-title{color:#1F7A72;}
.feed-catblock-img-wrap{position:relative;height:132px;background:#16294D;overflow:hidden;border:1px dashed #C9C9C0;}
.feed-catblock-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.feed-catblock-img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.2rem;}
.feed-catblock-editor-badge{position:absolute;top:8px;inset-inline-start:8px;background:#E8A33D;color:#16294D;font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;}
.feed-catblock-lead-title{font-size:17px;line-height:1.4;font-weight:700;margin-top:10px;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:.15s;}
.feed-catblock-item{display:flex;gap:8px;padding:9px 0;border-top:1px solid #EFEFEC;color:#22221E;font-size:14px;line-height:1.45;cursor:pointer;text-decoration:none;}
.feed-catblock-item:hover{color:#1F7A72;}
.feed-catblock-bullet{color:#E8A33D;font-weight:700;flex-shrink:0;}

/* Solutions */
.feed-solutions-wrap{margin-top:32px;background:#16294D;padding:20px;}
.feed-solutions-hdr{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px;}
.feed-solutions-hdr-title{margin:0;font-size:clamp(18px,2.4vw,22px);font-weight:700;color:#fff;}
.feed-solutions-hdr a{margin-inline-start:auto;color:#8FD8CF;font-size:13px;cursor:pointer;text-decoration:none;}
.feed-solutions-hdr a:hover{color:#fff;}
.feed-solutions-robot{height:56px;width:auto;object-fit:contain;}
.feed-solutions-cards{display:flex;flex-wrap:wrap;gap:16px;}
.feed-solutions-card{flex:1 1 320px;background:#fff;padding:18px;}
.feed-solutions-card-gold{border-top:4px solid #E8A33D;}
.feed-solutions-card-teal{border-top:4px solid #1F7A72;}
.feed-solutions-label{font-size:12px;font-weight:700;letter-spacing:.04em;}
.feed-solutions-label-gold{color:#E8A33D;}
.feed-solutions-label-teal{color:#1F7A72;}
.feed-solutions-title{margin:10px 0 0;font-size:20px;line-height:1.35;color:#111;font-weight:700;text-wrap:pretty;}
.feed-solutions-body{margin:10px 0 0;font-size:15px;line-height:1.65;color:#6E6E66;}
.feed-solutions-footer{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px;}
.feed-solutions-btn{border:none;border-radius:999px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;font-family:'Heebo',sans-serif;}
.feed-solutions-btn-primary{background:#1F7A72;color:#fff;}
.feed-solutions-btn-secondary{background:#fff;color:#16294D;border:1px solid #C9C9C0!important;}
.feed-solutions-stat{font-size:13px;color:#8A8A82;}

/* Footer */
.feed-kh-footer{margin-top:32px;padding:20px 0;border-top:1px dashed #C9C9C0;display:flex;flex-wrap:wrap;gap:12px 24px;font-size:13px;color:#8A8A82;}
.feed-kh-footer a{color:#1F7A72;text-decoration:none;cursor:pointer;}
.feed-kh-footer a:hover{color:#16294D;}

/* ── Editorial header redesign ── */
#kh-header{background:#fff;border-bottom:1px solid #DDDDD4;position:sticky;top:0;z-index:20;padding:0;height:auto;box-shadow:none;font-family:'Heebo',sans-serif;}
.kh-hdr-row1{padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;}
.kh-hdr-start{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.kh-back-btn{background:none;border:none;cursor:pointer;color:#8A8A82;font-size:1rem;padding:.25rem .45rem;border-radius:.3rem;line-height:1;}
.kh-back-btn:hover{color:#16294D;}
.kh-hdr-logo-img{height:clamp(30px,5vw,44px);width:auto;object-fit:contain;}
.kh-hdr-scope-wrap{display:flex;background:#EFEFEC;border:1px solid #DDDDD4;border-radius:999px;padding:3px;flex-shrink:0;}
.kh-hdr-scope-wrap .scope-btn{border:none!important;background:transparent!important;color:#16294D!important;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Heebo',sans-serif;white-space:nowrap;transition:.15s;}
.kh-hdr-scope-wrap .scope-btn.active{background:#16294D!important;color:#fff!important;}
.kh-hdr-search-wrap{flex:1 1 150px;display:flex;align-items:center;gap:8px;border:1px dashed #C9C9C0;border-radius:999px;padding:0 14px;min-height:40px;background:#FBFBF8;}
.kh-hdr-search-input{flex:1;border:none;background:transparent;outline:none;font-size:13px;color:#16294D;font-family:'Heebo',sans-serif;}
#kh-header .kh-header-actions{display:flex;gap:5px;align-items:center;flex-shrink:0;}
#kh-header .kh-btn-icon{width:33px;height:33px;border:1px solid #DDDDD4;background:#fff;color:#8A8A82;border-radius:50%;font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
#kh-header .kh-btn-icon:hover{background:#1F7A72;color:#fff;border-color:#1F7A72;}
.kh-nav-links{padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:8px 18px;}
.kh-nav-link{font-size:14px;font-weight:500;color:#16294D;cursor:pointer;text-decoration:none;padding:2px 0;border-bottom:2px solid transparent;transition:.15s;font-family:'Heebo',sans-serif;}
.kh-nav-link:hover{color:#1F7A72;}
.kh-nav-link.active{color:#1F7A72;border-bottom-color:#1F7A72;}
#scope-bar{border-bottom:1px solid #DDDDD4;padding:6px 16px;background:#fff;}
#scope-bar>.scope-btn{display:none!important;}
.kh-search-wrap{display:none!important;}
.feed-wrap{font-family:'Heebo',sans-serif;}
</style>
</head>
<body>
<div id="app">

  <!-- Header — editorial -->
  <header id="kh-header">
    <div class="kh-hdr-row1">
      <div class="kh-hdr-start">
        <button id="btn-kh-back" onclick="window.parent.closeKolHaamOverlay&&window.parent.closeKolHaamOverlay()" title="חזרה לאפליקציה" class="kh-back-btn"><i class="fa-solid fa-arrow-right"></i></button>
        <img src="/kol-haam-assets/images/ui/LOGO-oneflowlife.png" alt="ONE flow LIFE" class="kh-hdr-logo-img" onerror="this.style.display='none'">
        <span id="kh-community-name-wrap" style="font-size:11px;color:#8A8A82;font-family:'Heebo',sans-serif;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:none;">מציג: <span id="kh-community-name"></span></span>
      </div>
      <div class="kh-hdr-scope-wrap">
        <button class="scope-btn active" data-scope="local" onclick="KH.setScope('local',this)">🏠 הקהילה שלי</button>
        <button class="scope-btn" data-scope="global" onclick="KH.setScope('global',this)">🌍 כל הארץ</button>
      </div>
      <div class="kh-hdr-search-wrap">
        <span style="color:#8A8A82;">🔍</span>
        <input class="kh-hdr-search-input" id="kh-search-input" type="search" placeholder="חיפוש בכתבות, קהילות ותגיות" onkeydown="if(event.key==='Enter')KH.doSearch()">
      </div>
      <div class="kh-header-actions">
        <button class="kh-btn-icon" onclick="KH.nav('my-drafts')" title="הטיוטות שלי"><i class="fa-solid fa-file-pen"></i></button>
        <button class="kh-btn-icon" onclick="KH.nav('my-content')" title="התוכן שלי"><i class="fa-solid fa-list-check"></i></button>
        <button class="kh-btn-icon" onclick="KH.nav('saved')" title="שמורים שלי"><i class="fa-solid fa-star"></i></button>
        <button class="kh-btn-icon" onclick="KH.nav('following')" title="עוקב אחרי"><i class="fa-solid fa-user-group"></i></button>
        <button class="kh-btn-icon" onclick="KH.nav('collections')" title="האוספים שלי"><i class="fa-solid fa-book-bookmark"></i></button>
        <button class="kh-btn-icon" id="btn-zm-queue" onclick="KH.nav('zm-queue')" title="תור אישורים" style="display:none"><i class="fa-solid fa-inbox"></i></button>
        <button class="kh-btn-icon" id="btn-sa-queue" onclick="KH.nav('sa-queue')" title="אישורים ארציים" style="display:none"><i class="fa-solid fa-globe"></i></button>
        <button class="kh-btn-icon" onclick="KH.nav('editor')" title="כתוב כתבה חדשה" style="background:#1F7A72;color:#fff;border-color:#1F7A72;"><i class="fa-solid fa-plus"></i></button>
      </div>
    </div>
    <nav class="kh-nav-links" id="kh-nav-links"></nav>
  </header>

  <!-- Scope bar: category chips only (scope buttons now in header) -->
  <div id="scope-bar">
    <div id="cat-scroll"></div>
  </div>

  <!-- Body -->
  <div id="kh-body">

    <!-- Feed -->
    <div id="view-feed" class="view active">
      <div id="view-feed-inner">
        <div class="kh-spinner"></div>
      </div>
    </div>

    <!-- Single content -->
    <div id="view-content" class="view">
      <div class="content-back" onclick="KH.back()"><i class="fa-solid fa-arrow-right"></i> חזרה</div>
      <div id="content-inner" style="height:calc(100% - 38px);overflow-y:auto;"></div>
    </div>

    <!-- Editor -->
    <div id="view-editor" class="view">
      <div class="editor-back" onclick="KH.back()"><i class="fa-solid fa-arrow-right"></i> חזרה</div>
      <div id="editor-inner"></div>
    </div>

    <!-- My Drafts -->
    <div id="view-my-drafts" class="view">
      <div class="section-header">
        <span class="section-title">✍️ הטיוטות שלי</span>
        <button class="kh-btn kh-btn-primary kh-btn-sm" onclick="KH.nav('editor')"><i class="fa-solid fa-plus"></i> חדש</button>
      </div>
      <div id="drafts-list"><div class="kh-spinner"></div></div>
    </div>

    <!-- My Content -->
    <div id="view-my-content" class="view">
      <div class="section-header">
        <span class="section-title">📚 התוכן שלי</span>
      </div>
      <div id="my-content-list"><div class="kh-spinner"></div></div>
    </div>

    <!-- ZM Queue -->
    <div id="view-zm-queue" class="view">
      <div class="section-header">
        <span class="section-title">📥 תור אישורים — קהילה</span>
        <button class="kh-btn kh-btn-outline kh-btn-sm" onclick="KH.loadZMQueue()"><i class="fa-solid fa-refresh"></i></button>
      </div>
      <div id="zm-queue-categories" style="margin-bottom:.75rem"></div>
      <div id="zm-queue-list"><div class="kh-spinner"></div></div>
    </div>

    <!-- SA Queue -->
    <div id="view-sa-queue" class="view">
      <div class="section-header">
        <span class="section-title">🌍 אישורים ארציים</span>
        <button class="kh-btn kh-btn-outline kh-btn-sm" onclick="KH.loadSAQueue()"><i class="fa-solid fa-refresh"></i></button>
      </div>
      <div id="sa-deletion-section" style="margin-bottom:1rem"></div>
      <div id="sa-queue-list"><div class="kh-spinner"></div></div>
      <div style="margin-top:1.25rem">
        <div class="section-header"><span class="section-title">📂 קטגוריות ארציות</span>
          <button class="kh-btn kh-btn-primary kh-btn-sm" onclick="KH.showAddGlobalCat()"><i class="fa-solid fa-plus"></i> הוסף</button>
        </div>
        <div id="sa-global-cats"></div>
      </div>
      <!-- בחירת עורך SA -->
      <div style="margin-top:1.5rem">
        <div class="section-header">
          <span class="section-title">⭐ בחירת עורך</span>
          <button class="kh-btn kh-btn-outline kh-btn-sm" onclick="KH.loadEditorPicksSA()">רענן</button>
        </div>
        <div id="sa-editor-picks-list"></div>
      </div>
      <!-- דיווחים SA -->
      <div style="margin-top:1.5rem">
        <div class="section-header">
          <span class="section-title">🚨 דיווחים</span>
          <button class="kh-btn kh-btn-outline kh-btn-sm" onclick="KH.loadZMReports()">רענן</button>
        </div>
        <div id="zm-reports-list"></div>
      </div>
    </div>

    <!-- Saved items view -->
    <div id="view-saved" class="view">
      <div class="section-header">
        <span class="section-title">⭐ שמורים שלי</span>
        <button class="kh-btn kh-btn-outline kh-btn-sm" onclick="KH.back()">← חזרה</button>
      </div>
      <div id="saved-list"><div class="kh-spinner"></div></div>
    </div>

    <!-- ZM reports view -->
    <div id="view-zm-reports" class="view">
      <div class="section-header">
        <span class="section-title">🚨 דיווחים — ZM</span>
        <button class="kh-btn kh-btn-outline kh-btn-sm" onclick="KH.back()">← חזרה</button>
      </div>
      <div id="zm-reports-list-view"><div class="kh-spinner"></div></div>
    </div>

    <!-- Search results view -->
    <div id="view-search" class="view">
      <div class="section-header">
        <span class="section-title" id="search-results-title">תוצאות חיפוש</span>
        <button class="kh-btn kh-btn-outline kh-btn-sm" onclick="KH.nav('feed')">← פיד</button>
      </div>
      <div class="search-filters">
        <select id="sf-type" class="search-filter-btn" onchange="KH.doSearch()">
          <option value="">כל הסוגים</option>
          <option value="ARTICLE">כתבה</option><option value="NEWS">חדשות</option>
          <option value="OPINION">דעה</option><option value="QA_QUESTION">שאלה</option>
          <option value="STORY">סיפור</option><option value="GUIDE">מדריך</option>
        </select>
        <select id="sf-scope" class="search-filter-btn" onchange="KH.doSearch()">
          <option value="">כל הרמות</option>
          <option value="local">מקומי</option><option value="global">ארצי</option>
        </select>
        <select id="sf-date" class="search-filter-btn" onchange="KH.doSearch()">
          <option value="all">כל הזמנים</option>
          <option value="today">היום</option><option value="week">שבוע</option>
          <option value="month">חודש</option><option value="year">שנה</option>
        </select>
      </div>
      <div id="search-result-count" class="search-result-count"></div>
      <div id="search-results-list" style="padding:.5rem .75rem"><div class="kh-spinner"></div></div>
    </div>

    <!-- Tag page view -->
    <div id="view-tag" class="view">
      <div class="section-header">
        <span class="section-title" id="tag-page-title">#תגית</span>
        <button class="kh-btn kh-btn-outline kh-btn-sm" onclick="KH.back()">← חזרה</button>
      </div>
      <div id="tag-page-list" style="padding:.5rem .75rem"><div class="kh-spinner"></div></div>
    </div>

    <!-- Collections list view -->
    <div id="view-collections" class="view">
      <div class="section-header">
        <span class="section-title">📚 האוספים שלי</span>
        <button class="kh-btn kh-btn-primary kh-btn-sm" onclick="KH.showCreateCollection()">+ חדש</button>
      </div>
      <div id="collections-list" style="padding:.75rem;display:flex;flex-direction:column;gap:.5rem"><div class="kh-spinner"></div></div>
    </div>

    <!-- Single collection view -->
    <div id="view-collection" class="view">
      <div class="section-header">
        <span class="section-title" id="collection-view-title">אוסף</span>
        <button class="kh-btn kh-btn-outline kh-btn-sm" onclick="KH.nav('collections')">← אוספים</button>
      </div>
      <div id="collection-view-content"><div class="kh-spinner"></div></div>
    </div>

    <!-- Author profile view -->
    <div id="view-author" class="view">
      <div class="section-header">
        <button class="kh-btn kh-btn-outline kh-btn-sm" onclick="KH.back()">← חזרה</button>
      </div>
      <div id="author-profile-content"><div class="kh-spinner"></div></div>
    </div>

    <!-- Following feed view -->
    <div id="view-following" class="view">
      <div class="section-header">
        <span class="section-title">👥 עוקב אחרי</span>
        <button class="kh-btn kh-btn-outline kh-btn-sm" onclick="KH.nav('feed')">← פיד</button>
      </div>
      <div id="following-feed-list"><div class="kh-spinner"></div></div>
    </div>

  </div><!-- /kh-body -->
</div><!-- /app -->

<div id="kh-toast"></div>

<div id="kh-confirm">
  <div class="kh-confirm-box">
    <h3 id="kh-confirm-title"></h3>
    <p id="kh-confirm-msg"></p>
    <div class="actions">
      <button class="kh-btn kh-btn-outline" onclick="KH.confirmResolve(false)">ביטול</button>
      <button class="kh-btn kh-btn-primary" id="kh-confirm-ok" onclick="KH.confirmResolve(true)">אישור</button>
    </div>
  </div>
</div>

<!-- Report modal -->
<div id="kh-report-modal">
  <div class="kh-report-box">
    <h3>⚠️ דיווח על תוכן</h3>
    <div>
      <label class="report-reason-opt"><input type="radio" name="report-reason" value="SPAM"> ספאם</label>
      <label class="report-reason-opt"><input type="radio" name="report-reason" value="MISLEADING"> מידע מטעה</label>
      <label class="report-reason-opt"><input type="radio" name="report-reason" value="OFFENSIVE"> תוכן פוגעני</label>
      <label class="report-reason-opt"><input type="radio" name="report-reason" value="COPYRIGHT"> זכויות יוצרים</label>
      <label class="report-reason-opt"><input type="radio" name="report-reason" value="COMMERCIAL"> פרסום מסחרי</label>
      <label class="report-reason-opt"><input type="radio" name="report-reason" value="PERSONAL_INFO"> מידע אישי</label>
    </div>
    <textarea id="report-notes" placeholder="הערות נוספות (אופציונלי)..."></textarea>
    <div style="display:flex;gap:.5rem;margin-top:.75rem;justify-content:flex-end">
      <button class="kh-btn kh-btn-outline" onclick="KH.closeReport()">ביטול</button>
      <button class="kh-btn kh-btn-danger" onclick="KH.submitReport()">שלח דיווח</button>
    </div>
  </div>
</div>

<!-- Modal: הוסף לאוסף -->
<div id="kh-collection-modal" class="kh-modal-overlay">
  <div class="kh-modal-box">
    <div class="kh-modal-title">📚 הוסף לאוסף</div>
    <div id="collection-modal-list" style="display:flex;flex-direction:column;gap:.4rem"></div>
    <button class="kh-btn kh-btn-outline kh-btn-sm" onclick="KH.showCreateCollectionModal()">+ צור אוסף חדש</button>
    <button class="kh-btn kh-btn-outline" onclick="KH.closeCollectionModal()">סגור</button>
  </div>
</div>

<!-- Modal: היסטוריית גרסאות -->
<div id="kh-versions-modal" class="kh-modal-overlay">
  <div class="kh-modal-box">
    <div class="kh-modal-title">🕐 היסטוריית עריכות</div>
    <div id="versions-modal-list"></div>
    <button class="kh-btn kh-btn-outline" onclick="document.getElementById('kh-versions-modal').classList.remove('show')">סגור</button>
  </div>
</div>

<input type="file" id="kh-file-input" accept="image/*" style="display:none">

<script src="/kol-haam-app.js"></script>
</body>
</html>
