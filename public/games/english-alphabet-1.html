<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>אנגלית — מהאלף-בית למילים | OneFlow Kids</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0F1E;--bg2:#0F1628;
  --accent:#00D4AA;--accent2:#0099FF;
  --text:#F0F4FF;--muted:#7A8AAA;
  --card:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.1);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}

/* ── HEADER ── */
#header{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:.6rem 1rem;background:var(--bg2);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
#header .logo{font-size:.75rem;font-weight:900;color:var(--accent);letter-spacing:.05em}
#flw-badge{
  display:flex;align-items:center;gap:.35rem;
  background:rgba(0,212,170,.12);border:1px solid rgba(0,212,170,.3);
  border-radius:2rem;padding:.2rem .65rem;font-size:.75rem;font-weight:700;color:var(--accent);
}
#score-badge{
  display:flex;align-items:center;gap:.35rem;
  background:rgba(0,153,255,.12);border:1px solid rgba(0,153,255,.3);
  border-radius:2rem;padding:.2rem .65rem;font-size:.75rem;font-weight:700;color:var(--accent2);
}

/* ── ROBOT ── */
#robot-wrap{
  margin:.6rem 0 .3rem;display:flex;flex-direction:column;align-items:center;
}
#robot-img{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(0,212,170,.4))}
#robot-speech{
  margin-top:.3rem;background:var(--card);border:1px solid var(--border);
  border-radius:1rem;padding:.4rem .9rem;font-size:.78rem;color:var(--text);
  max-width:260px;text-align:center;line-height:1.4;min-height:2.2rem;
}

/* ── PROGRESS ── */
#progress-wrap{width:90%;max-width:420px;margin:.3rem auto}
#progress-bar-bg{height:7px;background:var(--card);border-radius:9px;overflow:hidden}
#progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:9px;transition:width .4s}
#progress-label{font-size:.65rem;color:var(--muted);text-align:center;margin-top:.2rem}

/* ── QUESTION ── */
#question-card{
  width:90%;max-width:420px;
  background:var(--card);border:1px solid var(--border);
  border-radius:1.4rem;padding:1rem 1.2rem;text-align:center;
  margin:.4rem auto;flex-shrink:0;
}
#q-letter{
  font-size:clamp(2.8rem,15vw,5rem);font-weight:900;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1.1;margin-bottom:.2rem;
}
#q-hint{font-size:.72rem;color:var(--muted)}

/* ── ANSWERS ── */
#answers{
  width:90%;max-width:420px;
  display:grid;grid-template-columns:1fr 1fr;gap:.55rem;
  margin:.4rem auto;
}
.ans-btn{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:1rem;padding:.7rem .5rem;
  font-size:clamp(.8rem,3.5vw,1rem);font-weight:700;color:var(--text);
  cursor:pointer;transition:all .18s;text-align:center;line-height:1.3;
}
.ans-btn:hover:not(:disabled){background:rgba(0,212,170,.12);border-color:var(--accent)}
.ans-btn.correct{background:rgba(0,212,170,.2);border-color:var(--accent);color:var(--accent)}
.ans-btn.wrong{background:rgba(255,60,80,.15);border-color:#ff3c50;color:#ff6b7a}
.ans-btn:disabled{cursor:default}

/* ── RESULT OVERLAY ── */
#result-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(10,15,30,.92);backdrop-filter:blur(8px);
  flex-direction:column;align-items:center;justify-content:center;
  z-index:100;padding:1.5rem;text-align:center;
}
#result-overlay.show{display:flex}
#result-emoji{font-size:4rem;margin-bottom:.6rem}
#result-title{font-size:1.5rem;font-weight:900;margin-bottom:.3rem}
#result-sub{font-size:.85rem;color:var(--muted);margin-bottom:1rem}
#result-flw{
  font-size:1.1rem;font-weight:900;color:var(--accent);
  background:rgba(0,212,170,.12);border:1px solid rgba(0,212,170,.3);
  border-radius:2rem;padding:.4rem 1.2rem;margin-bottom:1.2rem;
}
.res-btn{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#0A0F1E;font-weight:900;font-size:.95rem;
  border:none;border-radius:2rem;padding:.75rem 2rem;
  cursor:pointer;transition:opacity .2s;margin:.3rem;
}
.res-btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div class="logo">🎮 OneFlow Kids</div>
  <div id="score-badge">⭐ <span id="score-val">0</span></div>
  <div id="flw-badge">✨ <span id="flw-val">0</span> FLW</div>
</div>

<!-- Robot -->
<div id="robot-wrap">
  <img id="robot-img" src="/games/assets/images/robot-default.svg" alt="רובוט">
  <div id="robot-speech">שלום! בוא נלמד את האלף-בית האנגלי 🎉</div>
</div>

<!-- Progress -->
<div id="progress-wrap">
  <div id="progress-bar-bg"><div id="progress-bar" style="width:0%"></div></div>
  <div id="progress-label">שאלה 1 מתוך 10</div>
</div>

<!-- Question -->
<div id="question-card">
  <div id="q-letter">A</div>
  <div id="q-hint">מה המילה שמתחילה באות הזו?</div>
</div>

<!-- Answers -->
<div id="answers"></div>

<!-- Result Overlay -->
<div id="result-overlay">
  <div id="result-emoji">🎉</div>
  <div id="result-title">כל הכבוד!</div>
  <div id="result-sub">סיימת את המשחק</div>
  <div id="result-flw">הרווחת 0 FLW</div>
  <button class="res-btn" onclick="restartGame()">🔄 שחק שוב</button>
  <button class="res-btn secondary" onclick="closeGame()">🏠 חזור הביתה</button>
</div>

<script>
const QUESTIONS = [
  { letter:'A', correct:'Apple', options:['Apple','Ball','Cat','Dog'] },
  { letter:'B', correct:'Ball',  options:['Apple','Ball','Fish','Egg'] },
  { letter:'C', correct:'Cat',   options:['Dog','Cat','Hat','Jam'] },
  { letter:'D', correct:'Dog',   options:['Dog','Egg','Apple','Cat'] },
  { letter:'E', correct:'Egg',   options:['Fish','Hat','Egg','Ball'] },
  { letter:'F', correct:'Fish',  options:['Fish','Girl','Hat','Igloo'] },
  { letter:'G', correct:'Girl',  options:['Hat','Girl','Jam','Kite'] },
  { letter:'H', correct:'Hat',   options:['Hat','Ice','Jump','Kite'] },
  { letter:'I', correct:'Ice',   options:['Jam','Ice','Kite','Lion'] },
  { letter:'J', correct:'Jam',   options:['Jam','Kite','Lion','Moon'] },
];

const ROBOT_MSGS = {
  start:   'שלום! בוא נלמד את האלף-בית האנגלי 🎉',
  correct: ['מצוין! ✅','כל הכבוד! 🌟','אחלה! 💪','סופר! 🎯','מושלם! ✨'],
  wrong:   ['לא נורא, ננסה שוב 💙','תחשוב טוב יותר! 🤔','ממש קרוב! 😊'],
  finish:  'סיימת את המשחק! אתה כוכב! 🌟',
};

const FLW_PER_Q   = 2;
const SCORE_RIGHT = 10;
const TOTAL_Q     = QUESTIONS.length;

let current = 0, score = 0, flwEarned = 0;

// קרא userId וgroupId מ-parent (postMessage עתידי) או מ-URL
const params   = new URLSearchParams(location.search);
const userId   = params.get('userId') || null;
const gameId   = 1; // יעודכן ל-ID האמיתי מה-catalog

function init() {
  current = 0; score = 0; flwEarned = 0;
  updateScoreDisplay();
  showQuestion();
  document.getElementById('result-overlay').classList.remove('show');
}

function showQuestion() {
  const q = QUESTIONS[current];
  document.getElementById('q-letter').textContent    = q.letter;
  document.getElementById('progress-bar').style.width = ((current / TOTAL_Q) * 100) + '%';
  document.getElementById('progress-label').textContent = `שאלה ${current + 1} מתוך ${TOTAL_Q}`;
  setRobotMsg(current === 0 ? ROBOT_MSGS.start : `איזו מילה מתחילה ב-${q.letter}?`);

  // ערבב תשובות
  const shuffled = [...q.options].sort(() => Math.random() - .5);
  const cont = document.getElementById('answers');
  cont.innerHTML = shuffled.map(opt =>
    `<button class="ans-btn" onclick="answer('${opt}','${q.correct}')">${opt}</button>`
  ).join('');
}

function answer(chosen, correct) {
  const btns = document.querySelectorAll('.ans-btn');
  btns.forEach(b => {
    b.disabled = true;
    if (b.textContent === correct) b.classList.add('correct');
    if (b.textContent === chosen && chosen !== correct) b.classList.add('wrong');
  });

  if (chosen === correct) {
    score += SCORE_RIGHT;
    flwEarned += FLW_PER_Q;
    updateScoreDisplay();
    const msgs = ROBOT_MSGS.correct;
    setRobotMsg(msgs[Math.floor(Math.random() * msgs.length)]);
  } else {
    const msgs = ROBOT_MSGS.wrong;
    setRobotMsg(msgs[Math.floor(Math.random() * msgs.length)]);
  }

  setTimeout(() => {
    current++;
    if (current < TOTAL_Q) showQuestion();
    else showResult();
  }, 1100);
}

function showResult() {
  setRobotMsg(ROBOT_MSGS.finish);
  const pct = Math.round((score / (TOTAL_Q * SCORE_RIGHT)) * 100);
  const el  = document.getElementById('result-overlay');
  document.getElementById('result-emoji').textContent = pct >= 80 ? '🏆' : pct >= 50 ? '🎉' : '💙';
  document.getElementById('result-title').textContent = pct >= 80 ? 'מדהים!' : pct >= 50 ? 'יפה מאוד!' : 'כל הכבוד על הניסיון!';
  document.getElementById('result-sub').textContent   = `ענית נכון על ${Math.round(score/SCORE_RIGHT)} מתוך ${TOTAL_Q} שאלות`;
  document.getElementById('result-flw').textContent   = `הרווחת ${flwEarned} FLW ✨`;
  document.getElementById('progress-bar').style.width = '100%';
  el.classList.add('show');

  // שלח ל-API
  if (userId) {
    fetch('/api/kids/award-flw', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, gameId, score, flwEarned, durationSeconds: 0 })
    }).catch(() => {});
  }

  // הודע ל-parent iframe (postMessage לעתיד)
  try {
    window.parent.postMessage({
      type: 'GAME_COMPLETE',
      score, flwEarned, gameId
    }, '*');
  } catch(e) {}
}

function restartGame() { init(); }
function closeGame() {
  try { window.parent.postMessage({ type: 'GAME_CLOSE' }, '*'); }
  catch(e) { history.back(); }
}

function setRobotMsg(msg) {
  document.getElementById('robot-speech').textContent = msg;
}
function updateScoreDisplay() {
  document.getElementById('score-val').textContent = score;
  document.getElementById('flw-val').textContent   = flwEarned;
}

// טען URL רובוט מותאם (אם הועבר מה-parent)
window.addEventListener('message', e => {
  if (e.data?.type === 'SET_ROBOT_URL' && e.data.url) {
    document.getElementById('robot-img').src = e.data.url;
  }
});

init();
</script>
</body>
</html>
