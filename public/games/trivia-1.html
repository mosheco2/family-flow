<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OF חושב — טריוויה</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#1a1a4e 0%,#2d2d8a 100%);min-height:100vh;color:#fff;overflow-x:hidden}
.screen{display:none;padding:16px;min-height:100vh}
.screen.active{display:flex;flex-direction:column;align-items:center}

/* INTRO */
#intro{justify-content:flex-start;padding-top:20px}
.logo{font-size:2.2rem;font-weight:900;color:#FFD600;text-shadow:0 0 20px #FFD60080;margin-bottom:4px}
.logo-sub{font-size:.9rem;color:#aac;margin-bottom:20px}
.section-title{font-size:.8rem;font-weight:700;color:#FFD600;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;align-self:flex-start;width:100%;max-width:420px}
.age-row{display:flex;gap:10px;margin-bottom:18px;width:100%;max-width:420px}
.age-btn{flex:1;padding:12px 6px;border-radius:14px;border:2px solid #4444aa;background:#ffffff10;color:#ccc;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s}
.age-btn.sel{background:#FFD60020;border-color:#FFD600;color:#FFD600}
.topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:420px;margin-bottom:20px}
.topic-btn{padding:10px 4px;border-radius:12px;border:2px solid #4444aa;background:#ffffff08;color:#ccc;font-size:.8rem;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}
.topic-btn.sel{background:#00A89620;border-color:#00A896;color:#00A896}
.start-btn{width:100%;max-width:420px;padding:16px;border-radius:16px;border:none;background:linear-gradient(135deg,#FFD600,#FF8C00);color:#1a1a4e;font-size:1.1rem;font-weight:900;cursor:pointer;transition:all .2s;margin-top:4px}
.start-btn:disabled{opacity:.4;cursor:not-allowed}
.start-btn:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 6px 20px #FFD60060}

/* GAME */
#game{justify-content:flex-start;padding-top:12px}
.hud{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:440px;background:#ffffff10;border-radius:16px;padding:10px 16px;margin-bottom:12px}
.hud-item{text-align:center}
.hud-label{font-size:.6rem;color:#aac;letter-spacing:1px}
.hud-val{font-size:1.1rem;font-weight:800;color:#FFD600}
.progress-bar{width:100%;max-width:440px;height:6px;background:#ffffff20;border-radius:3px;margin-bottom:14px}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#00A896,#FFD600);transition:width .3s}
.robot-wrap{position:relative;width:140px;height:160px;margin-bottom:10px}
.robot-wrap svg.robot{width:140px;height:140px}
.timer-ring{position:absolute;top:-20px;right:-20px;width:88px;height:88px}
.bubble{max-width:440px;width:100%;background:#fff;color:#1a1a4e;border-radius:20px;padding:14px 18px;margin-bottom:14px;position:relative;box-shadow:0 4px 20px #00000040}
.bubble::after{content:'';position:absolute;bottom:-12px;right:60px;border:12px solid transparent;border-top-color:#fff;border-bottom:none}
.bubble-tag{font-size:.7rem;font-weight:800;color:#00A896;letter-spacing:1px;margin-bottom:4px}
.bubble-q{font-size:1.05rem;font-weight:700;line-height:1.4}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:440px}
.ans-btn{padding:12px 10px;border-radius:14px;border:2px solid #4444aa;background:#ffffff08;color:#fff;font-size:.9rem;font-weight:600;cursor:pointer;text-align:center;transition:all .2s;display:flex;align-items:center;gap:8px}
.ans-btn:hover:not(:disabled){border-color:#FFD600;background:#FFD60010}
.ans-btn.correct{border-color:#00A896;background:#00A89630;color:#00A896}
.ans-btn.wrong{border-color:#EF4444;background:#EF444420;color:#EF4444}
.ans-letter{width:24px;height:24px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;flex-shrink:0}
.feedback-bar{width:100%;max-width:440px;background:#ffffff10;border-radius:14px;padding:10px 14px;margin-top:10px;display:none;font-size:.85rem;line-height:1.4}
.feedback-bar.show{display:block}
.feedback-bar.ok{border:2px solid #00A896;color:#00A896}
.feedback-bar.nope{border:2px solid #EF4444;color:#EF4444}
.fb-explain{color:#ccc;margin-top:4px;font-size:.8rem}
.cont-btn{margin-top:8px;padding:8px 20px;border-radius:10px;border:none;background:#FFD600;color:#1a1a4e;font-weight:800;cursor:pointer;font-size:.85rem}
.combo-toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#FFD600;color:#1a1a4e;border-radius:14px;padding:8px 20px;font-weight:800;font-size:1rem;display:none;z-index:200;animation:popIn .3s ease}
@keyframes popIn{from{transform:translateX(-50%) scale(.5)}to{transform:translateX(-50%) scale(1)}}

/* RESULT */
#result{justify-content:center}
.result-emoji{font-size:4rem;margin-bottom:8px}
.result-title{font-size:1.8rem;font-weight:900;color:#FFD600;margin-bottom:4px}
.result-stars{font-size:2rem;margin-bottom:16px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px;margin-bottom:16px}
.stat-card{background:#ffffff10;border-radius:14px;padding:12px;text-align:center}
.stat-num{font-size:1.6rem;font-weight:900;color:#FFD600}
.stat-lbl{font-size:.7rem;color:#aac;margin-top:2px}
.flw-badge{background:linear-gradient(135deg,#FFD600,#FF8C00);color:#1a1a4e;border-radius:16px;padding:12px 24px;font-size:1.1rem;font-weight:900;margin-bottom:20px}
.result-btns{display:flex;gap:12px;width:100%;max-width:380px}
.result-btns button{flex:1;padding:14px;border-radius:14px;border:none;font-weight:800;font-size:.95rem;cursor:pointer}
.btn-play{background:linear-gradient(135deg,#FFD600,#FF8C00);color:#1a1a4e}
.btn-home{background:#ffffff20;color:#fff}
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro" class="screen active">
  <div class="logo">🤖 OF חושב</div>
  <div class="logo-sub">משחק הטריוויה של הרובוט החכם</div>

  <div class="section-title">קבוצת גיל</div>
  <div class="age-row">
    <button class="age-btn" data-age="6" onclick="selectAge(6)">6–9</button>
    <button class="age-btn" data-age="10" onclick="selectAge(10)">10–12</button>
    <button class="age-btn" data-age="13" onclick="selectAge(13)">13–16</button>
  </div>

  <div class="section-title">בחר נושא</div>
  <div class="topic-grid" id="topicGrid"></div>

  <button class="start-btn" id="startBtn" disabled onclick="startGame()">בואו נחשוב! 🚀</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="hud">
    <div class="hud-item"><div class="hud-label">שאלה</div><div class="hud-val" id="hud-q">1/10</div></div>
    <div class="hud-item"><div class="hud-label">ניקוד</div><div class="hud-val" id="hud-score">0</div></div>
    <div class="hud-item"><div class="hud-label">רצף</div><div class="hud-val" id="hud-streak">🔥0</div></div>
    <div class="hud-item"><div class="hud-label">FLW</div><div class="hud-val" id="hud-flw">0</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="robot-wrap">
    <svg class="robot" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <rect x="35" y="35" width="50" height="50" rx="10" fill="#1a1a6e"/>
      <rect x="42" y="43" width="14" height="10" rx="4" fill="#00CFFF"/>
      <rect x="64" y="43" width="14" height="10" rx="4" fill="#00CFFF"/>
      <path d="M46 62 Q60 72 74 62" stroke="#00FF88" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="45" y="85" width="30" height="20" rx="6" fill="#2a2a8e"/>
      <rect x="30" y="40" width="8" height="18" rx="4" fill="#2a2a8e"/>
      <rect x="82" y="40" width="8" height="18" rx="4" fill="#2a2a8e"/>
      <rect x="48" y="105" width="10" height="14" rx="4" fill="#2a2a8e"/>
      <rect x="62" y="105" width="10" height="14" rx="4" fill="#2a2a8e"/>
      <line x1="60" y1="35" x2="60" y2="20" stroke="#9B5DE5" stroke-width="3"/>
      <circle cx="60" cy="16" r="5" fill="#9B5DE5"/>
    </svg>
    <svg class="timer-ring" id="timerRing" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="40" fill="#1a1a4e" stroke="#ffffff20" stroke-width="6"/>
      <circle id="timerArc" cx="50" cy="50" r="40" fill="none" stroke="#00A896" stroke-width="6"
        stroke-dasharray="251" stroke-dashoffset="0" stroke-linecap="round"
        transform="rotate(-90 50 50)" style="transition:stroke .3s"/>
      <text id="timerText" x="50" y="57" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">15</text>
    </svg>
  </div>

  <div class="bubble">
    <div class="bubble-tag" id="bubbleTag">נושא</div>
    <div class="bubble-q" id="bubbleQ">שאלה תופיע כאן...</div>
  </div>

  <div class="answers" id="answersDiv"></div>
  <div class="feedback-bar" id="feedbackBar">
    <div id="fbText"></div>
    <div class="fb-explain" id="fbExplain"></div>
    <button class="cont-btn" onclick="nextQ()">המשך ▶</button>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="result-emoji" id="resEmoji">🏆</div>
  <div class="result-title" id="resTitle">כל הכבוד!</div>
  <div class="result-stars" id="resStars">⭐⭐⭐</div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-num" id="resCorrect">0</div><div class="stat-lbl">תשובות נכונות</div></div>
    <div class="stat-card"><div class="stat-num" id="resStreak">0</div><div class="stat-lbl">רצף מקסימלי</div></div>
    <div class="stat-card"><div class="stat-num" id="resAvgTime">0s</div><div class="stat-lbl">זמן ממוצע</div></div>
    <div class="stat-card"><div class="stat-num" id="resScore">0</div><div class="stat-lbl">ניקוד סופי</div></div>
  </div>
  <div class="flw-badge" id="resFlw">🪙 +0 מטבעות FLW</div>
  <div class="result-btns">
    <button class="btn-play" onclick="restartGame()">שחק שוב 🔄</button>
    <button class="btn-home" onclick="goHome()">חזרה 🏠</button>
  </div>
</div>

<div class="combo-toast" id="comboToast"></div>

<script>
const TIMER_SEC = 15;
const CIRCUMFERENCE = 251; // 2π×40
const QUESTIONS_PER_GAME = 10;

const TOPICS = [
  {key:'mix',label:'ערבוב',emoji:'🎲'},
  {key:'math',label:'מתמטיקה',emoji:'🔢'},
  {key:'hebrew',label:'עברית',emoji:'📖'},
  {key:'english',label:'אנגלית',emoji:'🇬🇧'},
  {key:'science',label:'מדעים',emoji:'🔬'},
  {key:'history',label:'היסטוריה',emoji:'🏛️'},
  {key:'geo',label:'גיאוגרפיה',emoji:'🌍'},
  {key:'nature',label:'טבע',emoji:'🌿'},
  {key:'culture',label:'תרבות',emoji:'🎵'},
  {key:'logic',label:'לוגיקה',emoji:'🧩'},
  {key:'sport',label:'ספורט',emoji:'⚽'},
  {key:'tech',label:'טכנולוגיה',emoji:'💻'}
];

// Question bank: Q[ageKey][topicKey] = [{q,a,opts,explain}]
// ageKey: 6, 10, 13
const QB = {
  6:{
    math:[
      {q:'כמה רגליים יש לשלושה כלבים?',a:0,opts:['12','9','6','8'],explain:'כל כלב = 4 רגליים, 3×4=12'},
      {q:'מה הוא המספר אחרי 19?',a:1,opts:['18','20','21','22'],explain:'19+1=20'},
      {q:'3 + 7 = ?',a:2,opts:['9','11','10','8'],explain:'3+7 שווה 10'},
      {q:'מה גדול יותר: 15 או 51?',a:1,opts:['15','51','שווים','אי אפשר לדעת'],explain:'51 > 15'},
      {q:'חצי מ-8 הוא?',a:0,opts:['4','3','5','6'],explain:'8÷2=4'},
      {q:'כמה פינות יש למשולש?',a:2,opts:['2','4','3','5'],explain:'למשולש יש 3 פינות'},
      {q:'10 - 4 = ?',a:1,opts:['5','6','7','4'],explain:'10 פחות 4 שווה 6'},
      {q:'2 × 5 = ?',a:3,opts:['7','8','9','10'],explain:'2 כפול 5 שווה 10'},
      {q:'כמה צלעות יש לריבוע?',a:1,opts:['3','4','5','6'],explain:'לריבוע 4 צלעות'},
      {q:'מה מספר הבא: 10, 20, 30, ?',a:2,opts:['35','38','40','45'],explain:'כל מספר גדל ב-10'},
      {q:'5 + 5 + 5 = ?',a:0,opts:['15','10','20','12'],explain:'5+5+5=15'},
      {q:'כמה עיגולים יש בדגל אולימפיאדה?',a:3,opts:['3','4','6','5'],explain:'5 טבעות אולימפיות'},
      {q:'מה גדול יותר: חצי תפוח או רבע תפוח?',a:0,opts:['חצי','רבע','שווה','אי אפשר לדעת'],explain:'חצי (½) גדול מרבע (¼)'},
    ],
    hebrew:[
      {q:'מה ההפך של גדול?',a:1,opts:['עצום','קטן','ענק','רחב'],explain:'ההפך של גדול הוא קטן'},
      {q:'כמה אותיות יש בא-ב?',a:2,opts:['24','20','22','26'],explain:'יש 22 אותיות בעברית'},
      {q:'מה הרבים של "כלב"?',a:0,opts:['כלבים','כלבות','כלביים','כלבן'],explain:'כלב → כלבים'},
      {q:'איזו אות מגיעה ראשונה באלפבית?',a:1,opts:['בית','אלף','גימל','דלת'],explain:'אלף היא האות הראשונה'},
      {q:'מה ההפך של חם?',a:2,opts:['יבש','רטוב','קר','עייף'],explain:'ההפך של חם הוא קר'},
      {q:'כמה מילים במשפט: "הכלב רץ מהר"?',a:1,opts:['2','3','4','5'],explain:'הכלב / רץ / מהר = 3 מילים'},
      {q:'מה הרבים של "ילד"?',a:0,opts:['ילדים','ילדות','ילדן','ילדיים'],explain:'ילד → ילדים'},
      {q:'מה ההפך של לילה?',a:3,opts:['שחר','ערב','בוקר מאוחר','יום'],explain:'ההפך של לילה הוא יום'},
      {q:'מה האות האחרונה בא-ב?',a:2,opts:['שין','תו — ת','תיו','קוף'],explain:'האות האחרונה היא תיו (ת)'},
      {q:'מה הנקבה של "ילד"?',a:1,opts:['ילדן','ילדה','ילדת','ילדית'],explain:'הנקבה של ילד היא ילדה'},
      {q:'מה ההפך של מעלה?',a:0,opts:['מטה','מאחור','מקדימה','מהצד'],explain:'ההפך של מעלה הוא מטה'},

    ],
    science:[
      {q:'כמה עונות יש בשנה?',a:2,opts:['3','2','4','5'],explain:'יש 4 עונות: אביב, קיץ, סתיו, חורף'},

    mix:[
      {q:'מה צבע השמש?',a:3,opts:['כחול','ירוק','לבן','צהוב'],explain:'השמש צהובה'},

      {q:'לאיזו חיה יש הצוואר הארוך ביותר?',a:2,opts:['פיל','נחש','ג\'ירפה','קוף'],explain:'לג\'ירפה הצוואר הארוך ביותר'},

    ],
    english:[

  b.dataset.key=t.key;
  b.innerHTML=`${t.emoji}<br>${t.label}`;
  b.onclick=()=>selectTopic(t.key);
  grid.appendChild(b);
});

function selectAge(a){
  GS.age=a;
  document.querySelectorAll('.age-btn').forEach(b=>b.classList.toggle('sel',+b.dataset.age===a));
  checkReady();
}
function selectTopic(k){
  GS.topic=k;
  document.querySelectorAll('.topic-btn').forEach(b=>b.classList.toggle('sel',b.dataset.key===k));
  checkReady();
}
function checkReady(){
  document.getElementById('startBtn').disabled=!(GS.age&&GS.topic);
}

function getQuestions(){
  const ageKey = GS.age>=13?13:GS.age>=10?10:6;
  let pool;
  if(GS.topic==='mix'){
    pool=[];
    // אנגלית לא נכנסת לערבוב — רק בבחירה מפורשת של נושא אנגלית
    Object.keys(QB[ageKey]).forEach(k=>{ if(k!=='mix' && k!=='english') pool.push(...(QB[ageKey][k]||[])); });
  } else {
    pool=[...(QB[ageKey][GS.topic]||QB[ageKey]['math'])];
  }
  // shuffle & pick
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  return pool.slice(0,QUESTIONS_PER_GAME);
}

function startGame(){
  GS.questions=getQuestions();
  GS.qIdx=0; GS.flw=GS.levelFlwStart; GS.score=0; GS.streak=0; GS.maxStreak=0;
  GS.correct=0; GS.totalTime=0; GS.gameSaved=false;
  GS.startTime=Date.now();
  show('game');
  loadQ();
}

function loadQ(){
  const q=GS.questions[GS.qIdx];
  document.getElementById('hud-q').textContent=`${GS.qIdx+1}/${GS.questions.length}`;
  document.getElementById('hud-score').textContent=GS.score;
  document.getElementById('hud-streak').textContent=`🔥${GS.streak}`;
  document.getElementById('hud-flw').textContent=GS.flw;
  document.getElementById('progressFill').style.width=`${(GS.qIdx/GS.questions.length)*100}%`;

  const topicObj=TOPICS.find(t=>t.key===GS.topic)||TOPICS[0];
  document.getElementById('bubbleTag').textContent=`${topicObj.emoji} ${topicObj.label}`;
  document.getElementById('bubbleQ').textContent=q.q;

  const letters=['א','ב','ג','ד'];
  const div=document.getElementById('answersDiv');
  div.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='ans-btn';
    b.innerHTML=`<span class="ans-letter">${letters[i]}</span>${opt}`;
    b.onclick=()=>answer(i);
    div.appendChild(b);
  });

  const fb=document.getElementById('feedbackBar');
  fb.className='feedback-bar';

  GS.qStartTime=Date.now();
  startTimer();
}

function startTimer(){
  clearInterval(GS.timerInterval);
  GS.timeLeft=TIMER_SEC;
  updateTimerUI(TIMER_SEC);
  GS.timerInterval=setInterval(()=>{
    GS.timeLeft--;
    updateTimerUI(GS.timeLeft);
    if(GS.timeLeft<=0){ clearInterval(GS.timerInterval); handleTimeout(); }
  },1000);
}

function updateTimerUI(t){
  const offset=CIRCUMFERENCE*(1-t/TIMER_SEC);
  const arc=document.getElementById('timerArc');
  const txt=document.getElementById('timerText');
  arc.setAttribute('stroke-dashoffset',offset);
  arc.style.stroke=t>10?'#00A896':t>5?'#FFD600':'#EF4444';
  txt.textContent=t;
}

function handleTimeout(){
  const q=GS.questions[GS.qIdx];
  GS.streak=0;
  document.querySelectorAll('.ans-btn').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.a) b.classList.add('correct');
  });
  showFeedback(false, q.explain, 0);
}

function answer(idx){
  clearInterval(GS.timerInterval);
  const q=GS.questions[GS.qIdx];
  const elapsed=Math.round((Date.now()-GS.qStartTime)/1000);
  const timeLeft=Math.max(0,TIMER_SEC-elapsed);
  GS.totalTime+=elapsed;
  const correct=idx===q.a;

  document.querySelectorAll('.ans-btn').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.a) b.classList.add('correct');
    else if(i===idx&&!correct) b.classList.add('wrong');
  });

  if(correct){
    const timeBonus=Math.floor(timeLeft*0.5);
    const pts=10+timeBonus;
    GS.score+=pts;
    GS.correct++;
    GS.streak++;
    if(GS.streak>GS.maxStreak) GS.maxStreak=GS.streak;
    const flwGain=timeLeft<5?GS.flwPerWin+1:GS.flwPerWin;
    GS.flw+=flwGain;
    document.getElementById('hud-flw').textContent=GS.flw;
    if(GS.streak>=3) showCombo(GS.streak);
    showFeedback(true, q.explain, pts);
  } else {
    GS.streak=0;
    showFeedback(false, q.explain, 0);
  }
}

function showFeedback(ok, explain, pts){
  const fb=document.getElementById('feedbackBar');
  fb.className='feedback-bar show '+(ok?'ok':'nope');
  document.getElementById('fbText').textContent=ok?`✅ נכון! +${pts} נקודות`:'❌ טעות...';
  document.getElementById('fbExplain').textContent=explain;
}

function showCombo(streak){
  const toast=document.getElementById('comboToast');
  toast.textContent=`🔥 רצף × ${streak}! מדהים!`;
  toast.style.display='block';
  setTimeout(()=>{ toast.style.display='none'; },1500);
}

function nextQ(){
  GS.qIdx++;
  if(GS.qIdx>=GS.questions.length){ endGame(); return; }
  loadQ();
}

function endGame(){
  clearInterval(GS.timerInterval);
  const dur=Math.round((Date.now()-GS.startTime)/1000);
  const flwEarned=GS.flw-GS.levelFlwStart;
  const pct=Math.round((GS.correct/GS.questions.length)*100);
  const avgTime=GS.questions.length>0?Math.round(GS.totalTime/GS.questions.length):0;

  // Result screen
  const stars=pct>=80?'⭐⭐⭐':pct>=50?'⭐⭐':'⭐';
  const emoji=pct>=80?'🏆':pct>=50?'😊':'🤔';
  const title=pct>=80?'מדהים! רובוט אלוף!':pct>=50?'כל הכבוד!':'ממשיכים להתאמן!';
  document.getElementById('resEmoji').textContent=emoji;
  document.getElementById('resTitle').textContent=title;
  document.getElementById('resStars').textContent=stars;
  document.getElementById('resCorrect').textContent=`${GS.correct}/${GS.questions.length}`;
  document.getElementById('resStreak').textContent=GS.maxStreak;
  document.getElementById('resAvgTime').textContent=`${avgTime}s`;
  document.getElementById('resScore').textContent=GS.score;
  document.getElementById('resFlw').textContent=`🪙 +${flwEarned} מטבעות FLW`;

  if(!GS.gameSaved){
    GS.gameSaved=true;
    if(window.parent!==window){
      window.parent.postMessage({
        type:'GAME_COMPLETE',
        userId:GS.userId,
        gameId:GS.gameId,
        score:pct,
        flwEarned:flwEarned,
        durationSeconds:dur,
        levelIdx:1,
        isLevelComplete:true,
        gameName:'OF חושב — טריוויה'
      },'*');
    }
  }
  show('result');
}

function restartGame(){
  startGame();
}

function goHome(){
  clearInterval(GS.timerInterval);
  if(!GS.gameSaved&&GS.flw>GS.levelFlwStart&&window.parent!==window){
    GS.gameSaved=true;
    const dur=Math.round((Date.now()-GS.startTime)/1000);
    const flwEarned=GS.flw-GS.levelFlwStart;
    const pct=GS.questions.length>0?Math.round((GS.correct/GS.qIdx||1)*100):0;
    window.parent.postMessage({
      type:'GAME_COMPLETE',
      userId:GS.userId,
      gameId:GS.gameId,
      score:pct,
      flwEarned:flwEarned,
      durationSeconds:dur,
      levelIdx:1,
      isLevelComplete:false,
      gameName:'OF חושב — טריוויה'
    },'*');
    setTimeout(()=>{
      window.parent.postMessage({type:'CLOSE_GAME'},'*');
    },50);
  } else {
    if(window.parent!==window) window.parent.postMessage({type:'CLOSE_GAME'},'*');
  }
}

function show(screenId){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

// postMessage INIT
window.addEventListener('message',e=>{
  const d=e.data;
  if(!d||d.type!=='INIT') return;
  GS.userId=d.userId||null;
  if(d.gameId) GS.gameId=d.gameId;
  if(d.flwReward) GS.flwPerWin=Math.max(1,Math.floor(d.flwReward/5));
  if(d.childName) GS.childName=d.childName;
  if(d.assignedLevel) GS.assignedLevel=d.assignedLevel;
  if(d.assignedRoundsTotal) GS.assignedRoundsTotal=d.assignedRoundsTotal;
  GS.levelFlwStart=GS.flw;

  if(d.age){
    const a=+d.age;
    const mapped=a>=13?13:a>=10?10:6;
    selectAge(mapped);
  }
  if(d.topic&&TOPICS.find(t=>t.key===d.topic)){
    selectTopic(d.topic);
  }
  // אם הגיע גיל אבל לא נושא — נבחר ערבוב כברירת מחדל ונתחיל
  if(GS.age&&!GS.topic){
    selectTopic('mix');
  }
  if(GS.age&&GS.topic) startGame();

  if(d.type==='ROUND_RESULT'){
    if(typeof d.flwDelta==='number') GS.flw+=d.flwDelta;
    GS.gameSaved=false;
  }
});
</script>
</body>
</html>
