// Summary chips
const summary = document.getElementById('summary');
const total = CATS.reduce((a,c)=>a+c.items.length,0);
CATS.forEach(c=>{
  const chip=document.createElement('div');
  chip.className='chip';
  chip.innerHTML=`<b>${c.items.length}</b> ${c.title.replace(/^\d+ · /,'')}`;
  summary.appendChild(chip);
});
const tot=document.createElement('div');
tot.className='chip';
tot.style='border-color:#4338ca;font-weight:700';
tot.innerHTML=`<b style="color:#4338ca">${total}</b> סה"כ`;
summary.appendChild(tot);

// Build categories
const cats=document.getElementById('cats');
CATS.forEach(cat=>{
  const div=document.createElement('div');
  div.className='category';
  div.innerHTML=`
    <div class="cat-header" onclick="const b=this.nextElementSibling;b.style.display=b.style.display==='none'?'block':'none'">
      <span class="cat-title" style="color:${cat.color}">${cat.title}</span>
      <span class="cat-count">${cat.items.length}</span>
    </div>
    <div style="display:block">
      <table>
        <thead><tr>
          <th style="width:32%">שם פונקציה</th>
          <th>תיאור</th>
          <th style="width:22%">מקור</th>
        </tr></thead>
        <tbody>${cat.items.map(i=>`<tr>
          <td class="fn">${i.n}()</td>
          <td>${i.d}</td>
          <td class="src">${i.s}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`;
  cats.appendChild(div);
});
</script>
