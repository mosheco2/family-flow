<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תפריט דיגיטלי — OneFlow Life</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Heebo', sans-serif; }
  code, pre { font-family: 'Fira Code', monospace; direction: ltr; }
  pre { direction: ltr; text-align: left; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:12px; overflow-x:auto; margin-bottom:.75rem; }
  table { border-collapse: collapse; width: 100%; margin-bottom:1rem; }
  th { background:#f1f5f9; padding:8px 12px; border:1px solid #e2e8f0; text-align:right; font-weight:700; font-size:13px; }
  td { padding:8px 12px; border:1px solid #e2e8f0; font-size:13px; vertical-align:top; }
  tr:nth-child(even) td { background:#f8fafc; }
  h1 { font-size:1.6rem; font-weight:900; margin:1.5rem 0 .75rem; }
  h2 { font-size:1.2rem; font-weight:800; margin:2rem 0 .5rem; padding-bottom:.25rem; border-bottom:2px solid #e2e8f0; scroll-margin-top:70px; }
  h3 { font-size:1rem; font-weight:700; margin:1.25rem 0 .4rem; }
  p { margin-bottom:.75rem; font-size:14px; line-height:1.7; }
  ul,ol { padding-right:1.25rem; margin-bottom:.75rem; }
  li { font-size:14px; margin-bottom:.2rem; line-height:1.6; }
  blockquote { border-right:4px solid #cbd5e1; padding:.5rem 1rem; background:#f8fafc; margin:.75rem 0; border-radius:4px; font-size:13px; color:#64748b; }
  a { color:#6366f1; }
  @media print { .no-print { display:none !important; } body { font-size:11pt; } }
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<div class="no-print sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center text-lg flex-shrink-0" style="background:#f9731620">🍽️</div>
      <div class="min-w-0">
        <h1 class="font-black text-slate-800 text-sm leading-none truncate">תפריט דיגיטלי</h1>
        <p class="text-[10px] text-slate-400 mt-0.5">OneFlow Life · <span id="last-update">טוען...</span></p>
      </div>
    </div>
    <div class="flex items-center gap-2 flex-shrink-0">
      <button onclick="loadDoc()" id="reload-btn" class="flex items-center gap-1.5 px-3 py-1.5 bg-green-50 border border-green-200 hover:bg-green-100 text-green-700 rounded-lg text-xs font-bold transition">🔄 רענן</button>
      <a href="spec-menu.md" download class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition">⬇ MD</a>
      <button onclick="window.print()" class="flex items-center gap-1.5 px-3 py-1.5 text-white rounded-lg text-xs font-bold transition" style="background:#f97316">🖨 PDF</button>
    </div>
  </div>
</div>

<div class="max-w-5xl mx-auto px-4 py-8">
  <div id="content" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-10">
    <p class="text-slate-400 text-sm text-center py-12">⏳ טוען...</p>
  </div>
</div>

<script>
const MD_FILE = 'spec-menu.md';
function loadDoc() {
  const btn = document.getElementById('reload-btn');
  if (btn) btn.textContent = '⏳ ...';
  fetch(MD_FILE + '?t=' + Date.now(), { cache: 'no-store' })
    .then(r => {
      // show last modified from response headers
      const lm = r.headers.get('last-modified');
      if (lm) {
        const d = new Date(lm);
        const pad = n => String(n).padStart(2,'0');
        document.getElementById('last-update').textContent = 'עודכן: ' + d.getDate() + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      }
      return r.text();
    })
    .then(md => {
      document.getElementById('content').innerHTML = marked.parse(md);
      if (btn) btn.textContent = '🔄 רענן';
    })
    .catch(() => {
      document.getElementById('content').innerHTML = '<p class="text-red-500 text-center py-12">שגיאה בטעינה. נסה שוב.</p>';
      if (btn) btn.textContent = '🔄 רענן';
    });
}
loadDoc();
</script>
</body>
</html>
