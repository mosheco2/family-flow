<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כניסת דמו — WEFLOWZ</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; }
</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-2 bg-emerald-600 text-white px-4 py-1.5 rounded-full text-xs font-bold mb-3">
        <i class="fa-solid fa-flask"></i> סביבת ניסיון
      </div>
      <h1 class="text-xl font-black text-slate-800">כניסה לעסק לדוגמה</h1>
      <p id="demo-subtitle" class="text-sm text-slate-500 mt-1">התחבר כדי לחוות את יכולות המערכת</p>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <div class="space-y-3">
        <div>
          <label class="text-xs font-bold text-slate-500 mb-1 block">שם משתמש (טלפון)</label>
          <input id="demo-phone" type="text" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm" placeholder="הוזן ע״י מפעיל המערכת">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-500 mb-1 block">סיסמה</label>
          <input id="demo-pass" type="password" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm" placeholder="••••••••">
        </div>
        <div id="demo-msg" class="text-xs font-bold text-red-500 hidden"></div>
        <button id="demo-login-btn" onclick="doDemoLogin()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm transition">
          <i class="fa-solid fa-right-to-bracket ml-1"></i> כניסה
        </button>
      </div>
    </div>

    <p class="text-center text-[11px] text-slate-400 mt-4">זו סביבת ניסיון בלבד. הנתונים בה מתאפסים אוטומטית מעת לעת.</p>
  </div>

<script>
  const API = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';
  const params = new URLSearchParams(window.location.search);
  const groupId = params.get('gid');

  if (!groupId) {
    document.getElementById('demo-subtitle').textContent = 'קישור לא תקין - חסר מזהה עסק';
    document.getElementById('demo-login-btn').disabled = true;
    document.getElementById('demo-login-btn').classList.add('opacity-50');
  }

  function showMsg(text) {
    const el = document.getElementById('demo-msg');
    el.textContent = text;
    el.classList.remove('hidden');
  }

  async function doDemoLogin() {
    const phone = document.getElementById('demo-phone').value.trim();
    const password = document.getElementById('demo-pass').value;
    if (!phone || !password) { showMsg('יש להזין שם משתמש וסיסמה'); return; }
    if (!groupId) { showMsg('קישור לא תקין'); return; }

    const btn = document.getElementById('demo-login-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> מתחבר...';

    try {
      const res = await fetch(`${API}/biz/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=utf-8' },
        body: JSON.stringify({ phone, password, groupId })
      });
      const data = await res.json();
      if (!data.success) {
        showMsg(data.error || 'שם משתמש או סיסמה שגויים');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket ml-1"></i> כניסה';
        return;
      }
      localStorage.setItem('ofl_session', JSON.stringify({
        user: { id: data.user_id, nickname: data.business_name || 'לקוח דמו', role: 'ADMIN' },
        group: { id: data.group_id, type: 'BUSINESS', wizard_completed: data.wizard_completed, name: data.business_name },
        token: data.token
      }));
      window.location.href = 'business.html';
    } catch(e) {
      showMsg('שגיאת תקשורת. נסו שנית.');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket ml-1"></i> כניסה';
    }
  }

  document.getElementById('demo-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doDemoLogin(); });
</script>
</body>
</html>
