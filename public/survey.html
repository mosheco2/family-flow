<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סקר</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; }

  .survey-header-bg {
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #2563eb 100%);
  }
  .star-btn { font-size: 2rem; cursor: pointer; transition: transform 0.1s; color: #c4b5fd; }
  .star-btn.active { color: #fbbf24; }
  .star-btn:hover { transform: scale(1.15); color: #fbbf24; }
  .option-btn { transition: all 0.15s; border: 2px solid #e2e8f0; }
  .option-btn.selected { border-color: #6366f1; background: #eef2ff; color: #4338ca; font-weight: 600; }
  .option-btn:hover:not(.selected) { border-color: #a5b4fc; background: #f5f3ff; }
  .yn-btn { transition: all 0.15s; border: 2px solid #e2e8f0; }
  .yn-btn.selected-yes { border-color: #22c55e; background: #dcfce7; color: #166534; font-weight: 600; }
  .yn-btn.selected-no  { border-color: #ef4444; background: #fee2e2; color: #991b1b; font-weight: 600; }
  .yn-btn:hover:not(.selected-yes):not(.selected-no) { border-color: #94a3b8; background: #f8fafc; }

  @keyframes fade-up { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  .fade-up { animation: fade-up 0.4s ease both; }

  @keyframes pulse-ring { 0%,100%{opacity:.4;transform:scale(1)} 50%{opacity:.8;transform:scale(1.05)} }
  .pulse { animation: pulse-ring 2s ease-in-out infinite; }

  .question-card { transition: box-shadow 0.2s; }
  .question-card:focus-within { box-shadow: 0 0 0 2px #6366f1, 0 4px 16px rgba(99,102,241,0.12); }

  input:focus, textarea:focus { outline: none; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- Header with gradient -->
<div id="survey-header" class="survey-header-bg px-4 pt-8 pb-14 text-center relative overflow-hidden">
  <!-- decorative circles -->
  <div class="absolute top-0 left-0 w-40 h-40 bg-white opacity-5 rounded-full -translate-x-16 -translate-y-16"></div>
  <div class="absolute bottom-0 right-0 w-56 h-56 bg-white opacity-5 rounded-full translate-x-20 translate-y-20"></div>

  <!-- Logo -->
  <div id="logo-wrap" class="hidden mb-4 relative z-10">
    <img id="biz-logo" src="" alt="לוגו" class="w-16 h-16 rounded-2xl object-cover mx-auto shadow-lg border-2 border-white/30">
  </div>
  <!-- Initials fallback -->
  <div id="biz-initials" class="hidden w-16 h-16 rounded-2xl bg-white/20 backdrop-blur border border-white/30 text-white text-2xl font-black flex items-center justify-center mx-auto mb-4 relative z-10 shadow-lg"></div>

  <p id="biz-name" class="text-white/80 text-sm font-semibold mb-1 relative z-10"></p>
  <p id="biz-slogan" class="text-white/60 text-xs mb-4 relative z-10"></p>

  <h1 id="survey-title" class="text-2xl font-black text-white relative z-10 leading-tight drop-shadow"></h1>
  <p id="survey-desc" class="text-white/70 text-sm mt-2 relative z-10"></p>
</div>

<!-- Main -->
<main class="flex-1 flex flex-col items-center px-4 -mt-8 pb-8 max-w-xl mx-auto w-full relative z-10">

  <!-- Loading -->
  <div id="state-loading" class="text-center py-20 w-full">
    <div class="w-14 h-14 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-5"></div>
    <p class="text-slate-400 font-medium">טוען סקר...</p>
  </div>

  <!-- Error -->
  <div id="state-error" class="hidden text-center py-20 w-full fade-up">
    <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-5">
      <i class="fa-solid fa-circle-exclamation text-red-500 text-3xl"></i>
    </div>
    <p id="error-msg" class="text-slate-700 font-bold text-lg"></p>
    <p class="text-slate-400 text-sm mt-2">בדוק שהכתובת נכונה ונסה שוב</p>
  </div>

  <!-- Form -->
  <div id="state-form" class="hidden w-full space-y-4 fade-up">

    <!-- Respondent fields -->
    <div id="respondent-section" class="bg-white rounded-2xl border border-slate-100 shadow-md p-5 space-y-3">
      <div class="flex items-center gap-2 mb-1">
        <div class="w-7 h-7 rounded-lg bg-indigo-100 flex items-center justify-center shrink-0">
          <i class="fa-solid fa-user text-indigo-600 text-xs"></i>
        </div>
        <p class="text-xs font-bold text-slate-600 uppercase tracking-wide">הפרטים שלך</p>
      </div>
      <div id="respondent-fields" class="space-y-3"></div>
    </div>

    <!-- Questions -->
    <div id="questions-section" class="space-y-4"></div>

    <!-- Comment -->
    <div class="bg-white rounded-2xl border border-slate-100 shadow-md p-5">
      <div class="flex items-center gap-2 mb-3">
        <div class="w-7 h-7 rounded-lg bg-slate-100 flex items-center justify-center shrink-0">
          <i class="fa-solid fa-message text-slate-500 text-xs"></i>
        </div>
        <label class="text-xs font-bold text-slate-600 uppercase tracking-wide">הערה חופשית <span class="text-slate-400 font-normal normal-case">(אופציונלי)</span></label>
      </div>
      <textarea id="free-comment" rows="3" placeholder="רשום כאן כל הערה, הצעה או בקשה..."
        class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400 ring-0 border-opacity-100 transition resize-none bg-slate-50 focus:bg-white"></textarea>
    </div>

    <!-- Submit -->
    <button id="submit-btn" onclick="submitSurvey()"
      class="w-full bg-gradient-to-l from-indigo-600 to-violet-600 text-white py-4 rounded-2xl font-black text-base shadow-lg hover:shadow-indigo-200 hover:shadow-xl active:scale-95 transition-all flex items-center justify-center gap-3">
      שלח תשובות
      <i class="fa-solid fa-paper-plane text-sm"></i>
    </button>
    <p id="submit-error" class="hidden text-red-500 text-sm text-center font-medium bg-red-50 rounded-xl py-2 px-4"></p>
  </div>

  <!-- Success -->
  <div id="state-success" class="hidden text-center py-16 w-full fade-up">
    <div class="relative inline-block mb-6">
      <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto pulse">
        <i class="fa-solid fa-check text-green-600 text-4xl"></i>
      </div>
    </div>
    <h2 class="text-3xl font-black text-slate-800 mb-3">תודה רבה!</h2>
    <p class="text-slate-500 text-base">תשובותיך התקבלו בהצלחה</p>
    <p class="text-slate-400 text-sm mt-1">אנו מעריכים את הזמן שהקדשת למענה</p>
  </div>

</main>

<script src="survey-app.js"></script>
</body>
</html>
