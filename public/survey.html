<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סקר</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { heebo: ['Heebo', 'sans-serif'] },
        colors: {
          brand: { 50:'#f0f4ff', 100:'#dde6ff', 300:'#93a8f8', 500:'#5369e3', 600:'#4556d4', 700:'#3744bf', 900:'#1e2672' }
        }
      }
    }
  }
</script>
<style>
  * { font-family: 'Heebo', sans-serif; }
  body { background: #f0f4ff; min-height: 100vh; }

  /* ─── Header mesh gradient ─── */
  .survey-hero {
    background: linear-gradient(135deg, #4556d4 0%, #6d5be8 40%, #9b4fd9 70%, #5369e3 100%);
    position: relative;
    overflow: hidden;
  }
  .survey-hero::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 20% 50%, rgba(255,255,255,.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(155,79,217,.5) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 80%, rgba(69,86,212,.6) 0%, transparent 50%);
  }
  .survey-hero::after {
    content: '';
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  /* ─── Logo ring ─── */
  .logo-ring {
    background: rgba(255,255,255,.18);
    backdrop-filter: blur(12px);
    border: 2px solid rgba(255,255,255,.35);
    box-shadow: 0 8px 32px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.25);
  }

  /* ─── Progress bar ─── */
  .progress-track { background: rgba(255,255,255,.2); }
  .progress-fill {
    background: linear-gradient(90deg, #fff 0%, rgba(255,255,255,.85) 100%);
    transition: width .6s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 0 10px rgba(255,255,255,.4);
  }

  /* ─── Cards ─── */
  .q-card {
    background: #fff;
    border: 1.5px solid #e8ecff;
    border-radius: 20px;
    box-shadow: 0 2px 16px rgba(69,86,212,.06), 0 1px 4px rgba(0,0,0,.04);
    transition: box-shadow .2s, border-color .2s;
  }
  .q-card:focus-within {
    border-color: #93a8f8;
    box-shadow: 0 0 0 3px rgba(83,105,227,.12), 0 4px 24px rgba(69,86,212,.1);
  }

  /* ─── Option buttons ─── */
  .opt-btn {
    border: 2px solid #e8ecff;
    border-radius: 14px;
    background: #f8faff;
    color: #374151;
    font-weight: 500;
    font-size: 14px;
    transition: all .18s ease;
    text-align: right;
    padding: 12px 16px;
    cursor: pointer;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .opt-btn:hover { border-color: #93a8f8; background: #eef1ff; color: #3744bf; }
  .opt-btn.selected {
    border-color: #5369e3;
    background: linear-gradient(135deg, #eef1ff, #e6eaff);
    color: #3744bf;
    font-weight: 700;
    box-shadow: 0 2px 12px rgba(83,105,227,.18);
  }
  .opt-btn .check-circle {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid #d1d8ff;
    background: white;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all .18s;
  }
  .opt-btn.selected .check-circle {
    background: #5369e3; border-color: #5369e3;
    box-shadow: 0 2px 8px rgba(83,105,227,.4);
  }
  .opt-btn .check-circle::after {
    content: ''; width: 6px; height: 6px;
    background: white; border-radius: 50%;
    display: none;
  }
  .opt-btn.selected .check-circle::after { display: block; }

  /* ─── Yes/No buttons ─── */
  .yn-btn {
    border: 2px solid #e8ecff;
    border-radius: 14px;
    background: #f8faff;
    font-weight: 600;
    font-size: 15px;
    padding: 14px;
    cursor: pointer;
    transition: all .18s ease;
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
  }
  .yn-btn:hover { background: #eef1ff; border-color: #93a8f8; }
  .yn-btn.selected-yes {
    border-color: #22c55e; background: linear-gradient(135deg, #dcfce7, #f0fdf4);
    color: #15803d; box-shadow: 0 2px 12px rgba(34,197,94,.18);
  }
  .yn-btn.selected-no {
    border-color: #f87171; background: linear-gradient(135deg, #fee2e2, #fff5f5);
    color: #dc2626; box-shadow: 0 2px 12px rgba(248,113,113,.18);
  }

  /* ─── Stars ─── */
  .star-btn {
    font-size: 2.4rem; cursor: pointer;
    color: #dde6ff; transition: color .15s, transform .12s;
    line-height: 1;
  }
  .star-btn:hover { color: #fbbf24; transform: scale(1.15); }
  .star-btn.active { color: #f59e0b; }

  /* ─── Text fields ─── */
  .survey-input {
    width: 100%;
    border: 2px solid #e8ecff;
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 14px;
    color: #1e293b;
    background: #f8faff;
    transition: border-color .18s, box-shadow .18s, background .18s;
    outline: none;
    font-family: 'Heebo', sans-serif;
  }
  .survey-input:focus {
    border-color: #5369e3;
    background: white;
    box-shadow: 0 0 0 3px rgba(83,105,227,.12);
  }
  .survey-input::placeholder { color: #94a3b8; }

  /* ─── Submit button ─── */
  .submit-btn {
    background: linear-gradient(135deg, #5369e3 0%, #7c5be8 50%, #9b4fd9 100%);
    border: none;
    border-radius: 18px;
    color: white;
    font-weight: 800;
    font-size: 16px;
    padding: 18px;
    width: 100%;
    cursor: pointer;
    box-shadow: 0 4px 24px rgba(83,105,227,.35), 0 1px 4px rgba(0,0,0,.1);
    transition: all .22s ease;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-family: 'Heebo', sans-serif;
  }
  .submit-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(83,105,227,.45);
  }
  .submit-btn:active:not(:disabled) { transform: scale(.97); }
  .submit-btn:disabled { opacity: .7; cursor: not-allowed; }

  /* ─── Number badge ─── */
  .q-number {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, #5369e3, #7c5be8);
    color: white;
    font-weight: 800;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(83,105,227,.3);
  }

  /* ─── Animations ─── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleIn { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes ring { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

  .fade-up { animation: fadeUp .45s cubic-bezier(.4,0,.2,1) both; }
  .fade-up-2 { animation: fadeUp .45s .1s cubic-bezier(.4,0,.2,1) both; }
  .scale-in { animation: scaleIn .4s cubic-bezier(.34,1.56,.64,1) both; }
  .ring-anim { animation: ring 2s ease-in-out infinite; }

  /* ─── Success tick ─── */
  .success-ring {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, #dcfce7, #bbf7d0);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(34,197,94,.25);
  }

  /* ─── Desktop centering ─── */
  @media (min-width: 640px) {
    body { background: linear-gradient(160deg, #ede9fe 0%, #f0f4ff 50%, #e0e7ff 100%); }
    .survey-card-wrap { max-width: 600px; margin: 0 auto; }
  }
</style>
</head>
<body>

<!-- Hero Header -->
<div class="survey-hero px-5 pt-10 pb-16 text-center relative">
  <!-- Logo -->
  <div id="logo-wrap" class="hidden mb-4 relative z-10">
    <img id="biz-logo" src="" alt=""
      class="logo-ring w-18 h-18 rounded-2xl object-cover mx-auto"
      style="width:72px;height:72px;">
  </div>
  <div id="biz-initials"
    class="logo-ring hidden w-18 h-18 rounded-2xl text-white text-2xl font-black items-center justify-center mx-auto mb-4 relative z-10"
    style="width:72px;height:72px;display:none;"></div>

  <div class="relative z-10">
    <p id="biz-name" class="text-white/90 text-sm font-semibold tracking-wide mb-0.5"></p>
    <p id="biz-slogan" class="text-white/55 text-xs mb-5 italic"></p>
    <h1 id="survey-title" class="text-white font-black leading-tight mb-2"
        style="font-size:clamp(1.35rem,5vw,2rem);text-shadow:0 2px 16px rgba(0,0,0,.15)"></h1>
    <p id="survey-desc" class="text-white/70 text-sm leading-relaxed max-w-sm mx-auto"></p>
  </div>

  <!-- Progress bar -->
  <div id="progress-wrap" class="hidden mt-6 relative z-10 max-w-xs mx-auto">
    <div class="progress-track rounded-full h-1.5 overflow-hidden">
      <div id="progress-fill" class="progress-fill h-full rounded-full" style="width:0%"></div>
    </div>
    <p id="progress-label" class="text-white/60 text-xs mt-1.5"></p>
  </div>
</div>

<!-- Content: floats up over hero -->
<div class="survey-card-wrap px-4 -mt-8 pb-12 relative z-10">

  <!-- Loading -->
  <div id="state-loading" class="text-center pt-16">
    <div class="w-12 h-12 rounded-full border-4 border-brand-100 border-t-brand-500 animate-spin mx-auto mb-4"></div>
    <p class="text-slate-400 font-medium">טוען סקר...</p>
  </div>

  <!-- Error -->
  <div id="state-error" class="hidden text-center pt-16 fade-up">
    <div class="w-20 h-20 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-5">
      <i class="fa-solid fa-circle-exclamation text-red-500 text-3xl"></i>
    </div>
    <p id="error-msg" class="text-slate-700 font-bold text-lg mb-2"></p>
    <p class="text-slate-400 text-sm">בדוק שהכתובת נכונה ונסה שוב</p>
  </div>

  <!-- Form -->
  <div id="state-form" class="hidden space-y-4 fade-up">

    <!-- Respondent fields card -->
    <div id="respondent-section" class="q-card p-5">
      <div class="flex items-center gap-2.5 mb-4">
        <div class="w-8 h-8 rounded-xl bg-brand-100 flex items-center justify-center">
          <i class="fa-solid fa-user text-brand-500 text-sm"></i>
        </div>
        <p class="text-sm font-bold text-slate-700">הפרטים שלך</p>
      </div>
      <div id="respondent-fields" class="space-y-3"></div>
    </div>

    <!-- Questions section -->
    <div id="questions-section" class="space-y-4"></div>

    <!-- Free comment card -->
    <div class="q-card p-5">
      <div class="flex items-center gap-2.5 mb-3">
        <div class="w-8 h-8 rounded-xl bg-amber-50 flex items-center justify-center">
          <i class="fa-solid fa-message text-amber-500 text-sm"></i>
        </div>
        <div>
          <p class="text-sm font-bold text-slate-700">הערה חופשית</p>
          <p class="text-xs text-slate-400">אופציונלי — כל הערה, הצעה או בקשה</p>
        </div>
      </div>
      <textarea id="free-comment" rows="3" placeholder="כתוב כאן..."
        class="survey-input resize-none"></textarea>
    </div>

    <!-- Submit -->
    <button id="submit-btn" onclick="submitSurvey()" class="submit-btn">
      שלח תשובות
      <i class="fa-solid fa-paper-plane text-sm"></i>
    </button>
    <p id="submit-error" class="hidden text-red-600 text-sm text-center font-semibold bg-red-50 border border-red-100 rounded-2xl py-3 px-4"></p>
  </div>

  <!-- Success -->
  <div id="state-success" class="hidden text-center pt-16 scale-in">
    <div class="success-ring ring-anim mx-auto mb-6">
      <i class="fa-solid fa-check text-green-600 text-4xl"></i>
    </div>
    <h2 class="text-3xl font-black text-slate-800 mb-3">תודה רבה! 🎉</h2>
    <p class="text-slate-500 text-base">תשובותיך התקבלו בהצלחה</p>
    <p class="text-slate-400 text-sm mt-1">אנו מעריכים את הזמן שהקדשת</p>
  </div>

</div>

<script src="survey-app.js"></script>
</body>
</html>
