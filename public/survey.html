<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סקר</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8fafc; }
  .star-btn { font-size: 2rem; cursor: pointer; transition: transform 0.1s; color: #d1d5db; }
  .star-btn.active { color: #f59e0b; }
  .star-btn:hover { transform: scale(1.1); }
  .option-btn { transition: all 0.15s; border: 2px solid #e2e8f0; }
  .option-btn.selected { border-color: #6366f1; background: #eef2ff; color: #4338ca; font-weight: 600; }
  .yn-btn { transition: all 0.15s; border: 2px solid #e2e8f0; }
  .yn-btn.selected-yes { border-color: #22c55e; background: #dcfce7; color: #166534; font-weight: 600; }
  .yn-btn.selected-no  { border-color: #ef4444; background: #fee2e2; color: #991b1b; font-weight: 600; }
  @keyframes fade-up { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  .fade-up { animation: fade-up 0.35s ease both; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- Header -->
<div id="survey-header" class="bg-white border-b border-slate-100 px-4 py-4 text-center shadow-sm">
  <p id="biz-name" class="text-xs text-slate-400 font-medium mb-1"></p>
  <h1 id="survey-title" class="text-xl font-black text-slate-800"></h1>
  <p id="survey-desc" class="text-sm text-slate-500 mt-1"></p>
</div>

<!-- Main -->
<main class="flex-1 flex flex-col items-center px-4 py-6 max-w-xl mx-auto w-full">

  <!-- Loading -->
  <div id="state-loading" class="text-center py-16 w-full">
    <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-4"></div>
    <p class="text-slate-400">טוען סקר...</p>
  </div>

  <!-- Error -->
  <div id="state-error" class="hidden text-center py-16 w-full">
    <i class="fa-solid fa-circle-exclamation text-4xl text-red-400 mb-3 block"></i>
    <p id="error-msg" class="text-slate-600 font-semibold"></p>
  </div>

  <!-- Form -->
  <div id="state-form" class="hidden w-full space-y-5 fade-up">
    <!-- Respondent fields -->
    <div id="respondent-section" class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5 space-y-3">
      <p class="text-xs font-bold text-slate-500 uppercase tracking-wide">פרטיך</p>
      <div id="respondent-fields" class="space-y-3"></div>
    </div>

    <!-- Questions -->
    <div id="questions-section" class="space-y-4"></div>

    <!-- Comment -->
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
      <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">הערה חופשית (אופציונלי)</label>
      <textarea id="free-comment" rows="3" placeholder="רשום כאן כל הערה, הצעה או בקשה..." class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none"></textarea>
    </div>

    <!-- Submit -->
    <button id="submit-btn" onclick="submitSurvey()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black text-base shadow-lg hover:bg-indigo-700 active:scale-95 transition">
      שלח תשובות <i class="fa-solid fa-paper-plane mr-2"></i>
    </button>
    <p id="submit-error" class="hidden text-red-500 text-sm text-center font-medium"></p>
  </div>

  <!-- Success -->
  <div id="state-success" class="hidden text-center py-16 w-full fade-up">
    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-5">
      <i class="fa-solid fa-check text-green-600 text-4xl"></i>
    </div>
    <h2 class="text-2xl font-black text-slate-800 mb-2">תודה!</h2>
    <p class="text-slate-500">תשובותיך התקבלו בהצלחה</p>
  </div>
</main>

<script src="survey-app.js"></script>
</body>
</html>
